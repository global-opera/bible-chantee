                        icon: "✉️",
                        title: "Contatto",
                        content: `<p>Hai domande, suggerimenti o vuoi supportare il progetto?</p>
                        <p>Non esitare a contattarci:</p>
                        <p style="text-align: center; margin-top: 20px;">
                            <a href="mailto:info@biblechantee.com" class="email-link">info@biblechantee.com</a>
                        </p>
                        <p style="margin-top: 20px; text-align: center; color: #b0b0b0;">
                            Seguici per scoprire novità e aggiornamenti del progetto!
                        </p>`
                    }
                ]
            }
        };

        // Résoudre la langue (priorité: URL > localStorage > défaut)
        const params = new URLSearchParams(window.location.search);
        let currentLang = params.get('lang') || localStorage.getItem('bc_lang') || 'FR';
        currentLang = currentLang.toUpperCase();

        // Sauvegarder dans localStorage pour cohérence
        localStorage.setItem('bc_lang', currentLang);

        // Update page content
        function updateContent(lang) {
            const t = TRANSLATIONS[lang] || TRANSLATIONS.FR;

            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('pageSubtitle').textContent = t.pageSubtitle;
            document.getElementById('backBtn').textContent = t.backBtn;

            // Generate sections
            const sectionsContainer = document.getElementById('sectionsContainer');
            sectionsContainer.innerHTML = '';

            t.sections.forEach(section => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section';
                sectionDiv.innerHTML = `
                    <div class="section-header">
                        <span class="section-icon">${section.icon}</span>
                        <h2 class="section-title">${section.title}</h2>
                    </div>
                    <div class="section-content">
                        ${section.content}
                    </div>
                `;
                sectionsContainer.appendChild(sectionDiv);
            });
        }

        // Initialize
        updateContent(currentLang);
    </script>
</body>
</html>
