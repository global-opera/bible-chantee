    const params = new URLSearchParams(window.location.search);
    let currentLang = params.get('lang') || localStorage.getItem('bc_lang') || 'FR';
    currentLang = currentLang.toUpperCase();

    // Sauvegarder dans localStorage pour cohérence
    localStorage.setItem('bc_lang', currentLang);

    // Favorites management
    let showOnlyFavorites = false;

    function getFavorites() {
        try {
            const stored = localStorage.getItem("bc_favorites_confessions");
            return stored ? JSON.parse(stored) : [];
        } catch (e) {
            return [];
        }
    }

    function saveFavorites(favorites) {
        try {
            localStorage.setItem("bc_favorites_confessions", JSON.stringify(favorites));
        } catch (e) {
            console.error("Failed to save favorites:", e);
        }
    }

    function getFavoriteKey(lang, index) {
        return "confession_" + lang + "_" + index;
    }

    function isFavorite(lang, index) {
        const favorites = getFavorites();
        return favorites.includes(getFavoriteKey(lang, index));
    }

    function toggleFavorite(lang, index, event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        let favorites = getFavorites();
        const key = getFavoriteKey(lang, index);

        if (favorites.includes(key)) {
            favorites = favorites.filter(f => f !== key);
        } else {
            favorites.push(key);
        }

        saveFavorites(favorites);
        render(currentLang);
    }

        } else {
            filterBtn.classList.remove('active');
            filterText.textContent = d.favorites;
        }

        render(currentLang);
    }

    function render(lang) {
        console.log('[DEBUG] render() called with lang:', lang, 'type:', typeof lang);
        currentLang = lang;
        const d = DATA[lang] || DATA.FR;

        document.getElementById('pageTitle').textContent = d.title;
        document.getElementById('backLink').textContent = d.back;
        document.getElementById('subtitle').textContent = d.subtitle;

        const grid = document.getElementById('confessionsGrid');
        const emptyState = document.getElementById('emptyState');
        grid.innerHTML = '';

        // Filter items if showing only favorites
        let itemsToShow = d.items;
        if (showOnlyFavorites) {
            itemsToShow = d.items.filter((item, i) => isFavorite(lang, i));

            if (itemsToShow.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                emptyState.textContent = d.noFavorites;
                return;
            }
        }

        grid.style.display = 'grid';
        emptyState.style.display = 'none';

        d.items.forEach((item, i) => {
            if (showOnlyFavorites && !isFavorite(lang, i)) {
                return;
            }

            // Create card using IIFE to capture values properly
            (function(index, itemData) {
                const card = document.createElement('div');
                card.className = 'confession-card';
                card.style.cursor = 'pointer'; // Ensure cursor shows it's clickable

                const ref = CONFESSION_REFS[index];
                if (!ref) {
                    console.error(`[ERROR] No ref found for index ${index}`);
                    return;
                }

                // Click handler - ouvre overlay player (comme prières)
                card.addEventListener('click', function(e) {
                    // Don't open player if clicking on star
                    if (e.target.classList.contains('favorite-star')) {
                        return;
                    }
                    openPlayer(index, lang);
                });

                const star = document.createElement('span');
                star.className = 'favorite-star' + (isFavorite(lang, index) ? ' favorited' : '');
                star.textContent = isFavorite(lang, index) ? '★' : '☆';
                star.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleFavorite(lang, index, e);
                });

                const icon = document.createElement('div');
                icon.className = 'confession-icon';
                icon.textContent = ICONS[index];

                const title = document.createElement('div');
                title.className = 'confession-title';
                title.textContent = itemData[0];

                card.appendChild(star);
                card.appendChild(icon);
                card.appendChild(title);
                grid.appendChild(card);
            })(i, item);
        });
    }

    // Ouvrir le player overlay avec audio/paroles CONFESSIONS
    function openPlayer(index, lang) {
        const d = DATA[lang] || DATA.FR;
        const confession = d.items[index];

        // Afficher le titre
        document.getElementById('playerTitle').textContent = confession[0];

        const langUpper = lang.toUpperCase();
        const confNum = String(index + 1).padStart(2, '0'); // 0 → "01", 1 → "02", etc.

        // Audio depuis archive.org (confessions spécifiques)
        // Langues disponibles: FR, PT. Fallback vers FR si non disponible
        let audioVarName = `audioUrlsConfessions${langUpper}`;
        let audioUrls = window[audioVarName];
        let audioLang = langUpper;

        // Fallback vers FR si langue audio pas disponible
        if (!audioUrls || !audioUrls[confNum]) {
            console.log('[PLAYER] Audio not available for', langUpper, ', falling back to FR');
            audioVarName = 'audioUrlsConfessionsFR';
            audioUrls = window[audioVarName];
            audioLang = 'FR';
        }

        let audioUrl = audioUrls && audioUrls[confNum] ? audioUrls[confNum] : null;

        console.log('[PLAYER] Loading confession:', { index, confNum, lang: langUpper, audioLang, audioUrl });

        const audio = document.getElementById('confessionAudio');

        if (audioUrl) {
            audio.src = audioUrl;
        } else {
            console.error('[PLAYER] No audio URL for confession', confNum);
        }

        // Charger paroles depuis lyrics/confessions/{LANG}/
        const lyricsBox = document.getElementById('lyricsBox');
        lyricsBox.textContent = 'Chargement des paroles...';

        const lyricsFileName = getLyricsFileName(confNum, langUpper);
        const lyricsUrl = `/lyrics/confessions/${langUpper}/${lyricsFileName}`;

        // Essayer langue demandée, sinon fallback FR
        fetch(lyricsUrl)
            .then(r => {
                if (r.ok) return r.text();
                // Fallback vers FR si langue pas disponible
                console.log('[PLAYER] Lyrics not found for', langUpper, ', trying FR');
                return fetch(`/lyrics/confessions/FR/${getLyricsFileName(confNum, 'FR')}`).then(r2 => r2.text());
            })
            .then(lyrics => {
                if (lyrics && lyrics.trim()) {
                    const html = lyrics.split('\n\n').map(p => {
                        return '<p style="margin: 0 0 1em 0;">' + p.split('\n').join('<br>') + '</p>';
                    }).join('');
                    lyricsBox.innerHTML = html;
                } else {
                    lyricsBox.textContent = `${confession[0]}\n\n${confession[1]}`;
                }
            })
            .catch(err => {
                console.error('[PLAYER] Lyrics fetch error:', err);
                lyricsBox.textContent = `${confession[0]}\n\n${confession[1]}\n\n[Paroles non disponibles]`;
            });

        // Afficher l'overlay
        document.getElementById('playerOverlay').classList.add('active');

        // Tenter de lire l'audio
        if (audioUrl) {
            audio.play().catch(function(err) {
                console.error('[PLAYER] Audio play error:', err);
            });
        }
    }

    // Mapping numéro confession → nom fichier lyrics
    function getLyricsFileName(confNum, lang) {
        const mapping = {
            '01': 'Joie', '02': 'Gueri', '03': 'Sante', '04': 'Vainqueur',
            '05': 'Prospere', '06': 'Reconnaissant', '07': 'Heureux',
            '08': 'Beni', '09': 'Amen', '10': 'Shalom'
        };
        const name = mapping[confNum] || 'Unknown';
        return `${confNum}_${name}.txt`;
    }

    // Fermer le player
    function closePlayer() {
        const overlay = document.getElementById('playerOverlay');
        overlay.classList.remove('active');

        // Arrêter l'audio
        const audio = document.getElementById('confessionAudio');
        audio.pause();
        audio.src = '';
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Utiliser currentLang déjà résolu (URL > localStorage > défaut)
        render(currentLang);
    });
    </script>
