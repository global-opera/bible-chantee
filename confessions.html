    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a237e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 400px; margin: 0 auto; padding: 20px; }

        h1 {
            text-align: center;
            font-size: 1.7rem;
            color: #f5c842;
            margin-bottom: 20px;
        }
        .back-link {
            display: block;
            text-align: center;
            color: #f5c842;
            text-decoration: none;
            padding: 10px 25px;
            border: 2px solid #f5c842;
            border-radius: 25px;
            width: fit-content;
            margin: 0 auto 20px;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: #f5c842;
            color: #1a237e;
        }
        .subtitle {
            text-align: center;
            font-style: italic;
            color: #b0b0b0;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        /* Favorites filter button */
        .filter-container { text-align: center; margin-bottom: 20px; }
        .filter-btn {
            padding: 8px 20px;
            border: 2px solid rgba(245, 200, 66, 0.5);
            background: rgba(30, 58, 95, 0.6);
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .filter-btn:hover {
            border-color: #f5c842;
            background: rgba(30, 58, 95, 0.8);
        }
        .filter-btn.active {
            background: #f5c842;
            color: #1a237e;
            border-color: #f5c842;
            font-weight: bold;
        }

        /* Favorite star */
        .favorite-star {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s;
            user-select: none;
        }
        .favorite-star:hover { transform: scale(1.2); }
        .favorite-star.favorited { color: #f5c842; }
        .favorite-star:not(.favorited) { color: rgba(255, 255, 255, 0.3); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #b0b0b0;
            font-style: italic;
        }

        .confessions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 13px;
            max-width: 495px;
            margin: 0 auto;
        }
        .confession-card {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(30, 58, 95, 0.8);
            border-radius: 11px;
            text-decoration: none;
            padding: 13px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        .confession-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(245, 200, 66, 0.3);
        }
        .confession-icon {
            font-size: 2.2rem;
            margin-bottom: 9px;
        }
        .confession-title {
            color: white;
            font-size: 0.85rem;
            text-align: center;
            font-weight: normal;
            line-height: 1.2;
        }
        
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
        }
    </style>

        { book: "45", chapter: "5" },   // Romains 5:1
        { book: "45", chapter: "8" },   // Romains 8:37
        { book: "50", chapter: "4" },   // Philippiens 4:13
        { book: "50", chapter: "4" },   // Philippiens 4:19

        { book: "49", chapter: "1" },   // Ephesiens 1:3
        { book: "45", chapter: "5" }    // Romains 5:5
    ];

    const ICONS = ["😊", "🤍", "💪", "🏆", "🌱", "🙏", "⭐", "🎵", "🙌", "❤️"];

    // Résoudre la langue (priorité: URL > localStorage > défaut)
    const params = new URLSearchParams(window.location.search);
    let currentLang = params.get('lang') || localStorage.getItem('bc_lang') || 'FR';
    currentLang = currentLang.toUpperCase();

    // Sauvegarder dans localStorage pour cohérence
    localStorage.setItem('bc_lang', currentLang);

    // Favorites management
    let showOnlyFavorites = false;

    function getFavorites() {
        try {
            const stored = localStorage.getItem("bc_favorites_confessions");
            return stored ? JSON.parse(stored) : [];
        } catch (e) {
            return [];
        }
    }

    function saveFavorites(favorites) {
        try {
            localStorage.setItem("bc_favorites_confessions", JSON.stringify(favorites));
        } catch (e) {
            console.error("Failed to save favorites:", e);
        }
    }

    function getFavoriteKey(lang, index) {
        return "confession_" + lang + "_" + index;
    }

    function isFavorite(lang, index) {
        const favorites = getFavorites();
        return favorites.includes(getFavoriteKey(lang, index));
    }

    function toggleFavorite(lang, index, event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        let favorites = getFavorites();
        const key = getFavoriteKey(lang, index);

        if (favorites.includes(key)) {
            favorites = favorites.filter(f => f !== key);
        } else {
            favorites.push(key);
        }

        saveFavorites(favorites);
        render(currentLang);
    }

    function toggleFilter() {
        showOnlyFavorites = !showOnlyFavorites;
        const filterBtn = document.getElementById('filterBtn');
        const filterText = document.getElementById('filterText');
        const d = DATA[currentLang] || DATA.FR;

        if (showOnlyFavorites) {
            filterBtn.classList.add('active');
            filterText.textContent = d.showAll;
        } else {
            filterBtn.classList.remove('active');
            filterText.textContent = d.favorites;
        }

        render(currentLang);
    }

    function render(lang) {
        currentLang = lang;
        const d = DATA[lang] || DATA.FR;

        document.getElementById('pageTitle').textContent = d.title;
        document.getElementById('backLink').textContent = d.back;
        document.getElementById('subtitle').textContent = d.subtitle;

        const grid = document.getElementById('confessionsGrid');
        const emptyState = document.getElementById('emptyState');
        grid.innerHTML = '';

        // Filter items if showing only favorites
        let itemsToShow = d.items;
        if (showOnlyFavorites) {
            itemsToShow = d.items.filter((item, i) => isFavorite(lang, i));

            if (itemsToShow.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                emptyState.textContent = d.noFavorites;
                return;
            }
        }

        grid.style.display = 'grid';
        emptyState.style.display = 'none';

        d.items.forEach((item, i) => {
            if (showOnlyFavorites && !isFavorite(lang, i)) {
                return;
            }

            const card = document.createElement('a');
            card.className = 'confession-card';
            const ref = CONFESSION_REFS[i];
            card.href = `lecteur.html?book=${ref.book}&chapter=${ref.chapter}&lang=${lang}`;

            const star = document.createElement('span');
            star.className = 'favorite-star' + (isFavorite(lang, i) ? ' favorited' : '');
            star.textContent = isFavorite(lang, i) ? '★' : '☆';
            star.onclick = (e) => toggleFavorite(lang, i, e);

            card.innerHTML = `
                <div class="confession-icon">${ICONS[i]}</div>
                <div class="confession-title">${item[0]}</div>
            `;
            card.insertBefore(star, card.firstChild);
            grid.appendChild(card);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Utiliser currentLang déjà résolu (URL > localStorage > défaut)
        render(currentLang);
    });
