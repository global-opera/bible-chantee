<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 Confessions – Bible Chantée</title>

  <!-- Langue globale (OBLIGATOIRE AVANT TOUT SCRIPT) -->
  <script src="lang-shared.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #1a237e 100%);
      min-height: 100vh;
      color: #fff;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      color: #f5c842;
      margin-bottom: 20px;
    }
    .back-link {
      display: block;
      text-align: center;
      color: #f5c842;
      text-decoration: none;
      padding: 10px 25px;
      border: 2px solid #f5c842;
      border-radius: 25px;
      width: fit-content;
      margin: 0 auto 20px;
      transition: all 0.3s;
    }
    .back-link:hover {
      background: #f5c842;
      color: #1a237e;
    }
    .subtitle {
      text-align: center;
      font-style: italic;
      color: #b0b0b0;
      margin-bottom: 40px;
      font-size: 1.2rem;
    }
    .confessions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .confession-card {
      background: rgba(30, 58, 95, 0.8);
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      text-decoration: none;
      display: block;
      color: inherit;
    }
    .confession-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(245, 200, 66, 0.3);
    }
    .confession-icon { font-size: 3rem; margin-bottom: 15px; }
    .confession-word { color: #f5c842; font-size: 0.9rem; }
    .confession-title { font-size: 1.3rem; margin: 10px 0; }
    .confession-verse { color: #b0b0b0; font-style: italic; margin-bottom: 15px; }
    .confession-cta {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background: linear-gradient(135deg, #f5c842, #e0b030);
      color: #1e3a5f;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
    }
  </style>
</head>

<body>
<div class="container">
  <h1 id="pageTitle"></h1>
  <a href="#" class="back-link" id="backLink"></a>
  <p class="subtitle" id="subtitle"></p>
  <div class="confessions-grid" id="confessionsGrid"></div>
</div>

<script>
(function () {
  const lang = window.currentLanguage || "FR";

  const DATA = {
    FR: {
      title: "10 Confessions de la Bible Chantée",
      back: "Retour accueil",
      subtitle: "Déclare la Parole de Dieu sur ta vie",
      word: "Confession",
      listenBtn: "Écouter"
    },
    EN: {
      title: "10 Sung Bible Confessions",
      back: "Back to Home",
      subtitle: "Declare God's Word over your life",
      word: "Confession",
      listenBtn: "Listen"
    }
  };

  const ITEMS = [
    ["Je suis enfant de Dieu", "Jean 1:12"],
    ["Je suis justifié par la foi", "Romains 5:1"],
    ["Je suis plus que vainqueur", "Romains 8:37"],
    ["Je peux tout en Christ", "Philippiens 4:13"],
    ["Dieu pourvoit à mes besoins", "Philippiens 4:19"],
    ["Je suis guéri", "Ésaïe 53:5"],
    ["Aucune arme ne prospère", "Ésaïe 54:17"],
    ["Le Seigneur est mon berger", "Psaume 23:1"],
    ["Je suis béni", "Éphésiens 1:3"],
    ["L’amour de Dieu est en moi", "Romains 5:5"]
  ];

  const ICONS = ["😊","🤍","💪","🏆","🌱","🙏","⭐","🎵","🙌","❤️"];
  const d = DATA[lang] || DATA.FR;

  document.getElementById("pageTitle").textContent = d.title;
  document.getElementById("subtitle").textContent = d.subtitle;
  document.getElementById("backLink").textContent = d.back;
  document.getElementById("backLink").href = `index.html?lang=${lang}`;

  const grid = document.getElementById("confessionsGrid");

  ITEMS.forEach((item, i) => {
    const a = document.createElement("a");
    a.className = "confession-card";
    a.href = `lecteur.html?confession=${i}&lang=${lang}&return=confessions.html`;
    a.innerHTML = `
      <div class="confession-icon">${ICONS[i]}</div>
      <div class="confession-word">${d.word} ${i+1}</div>
      <h3 class="confession-title">${item[0]}</h3>
      <p class="confession-verse">${item[1]}</p>
      <div class="confession-cta">${d.listenBtn} ▶</div>
    `;
    grid.appendChild(a);
  });
})();
</script>
</body>
</html>
