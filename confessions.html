        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a237e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .lang-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .lang-btn {
            padding: 8px 16px;
            background: #1e3a5f;
            color: #f5c842;
            border: 1px solid #f5c842;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .lang-btn:hover, .lang-btn.active {
            background: #f5c842;
            color: #1e3a5f;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5rem;
            color: #f5c842;
            margin-bottom: 20px;
        }
        .back-link {
            display: block;
            text-align: center;
            color: #f5c842;
            text-decoration: none;
            padding: 10px 25px;
            border: 2px solid #f5c842;
            border-radius: 25px;
            width: fit-content;
            margin: 0 auto 20px;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: #f5c842;
            color: #1a237e;
        }
        .subtitle {
            text-align: center;
            font-style: italic;
            color: #b0b0b0;
            margin-bottom: 40px;
            font-size: 1.2rem;
        }
        
        .confessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .confession-card {
            background: rgba(30, 58, 95, 0.8);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .confession-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .confession-icon { font-size: 3rem; margin-bottom: 15px; }
        .confession-word { color: #f5c842; font-size: 0.9rem; }
        .confession-title { font-size: 1.3rem; margin: 10px 0; color: #fff; }
        .confession-verse { color: #b0b0b0; font-style: italic; }
        
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .lang-btn { padding: 6px 10px; font-size: 12px; }
        }
    </style>
</head>

    let currentLang = 'FR';

    function render(lang) {
        currentLang = lang;
        const d = DATA[lang] || DATA.FR;
        
        document.getElementById('pageTitle').textContent = d.title;
        document.getElementById('backLink').textContent = d.back;
        document.getElementById('subtitle').textContent = d.subtitle;
        
        const grid = document.getElementById('confessionsGrid');
        grid.innerHTML = '';
        
        d.items.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = 'confession-card';
            card.innerHTML = `
                <div class="confession-icon">${ICONS[i]}</div>
                <div class="confession-word">${d.word} ${i + 1}</div>
                <h3 class="confession-title">${item[0]}</h3>
                <p class="confession-verse">${item[1]}</p>
            `;
            grid.appendChild(card);
        });
        
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });
        
        localStorage.setItem('selectedLang', lang);
    }

    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                render(this.dataset.lang);
            });
        });
        
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || localStorage.getItem('selectedLang') || 'FR';
        render(lang);
    });
