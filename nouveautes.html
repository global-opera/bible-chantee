        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bleu-nuit: #1E3A5F;
            --bleu-sombre: #162B46;
            --bleu-cartes: #243F66;
            --bleu-hover: #2C4A73;
            --or-moyen: #F5CB42;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bleu-sombre) 0%, var(--bleu-nuit) 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--or-moyen);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #b0b0b0;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 25px;
            background: transparent;
            border: 2px solid var(--or-moyen);
            border-radius: 25px;
            color: var(--or-moyen);
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: var(--or-moyen);
            color: var(--bleu-nuit);
        }

        .update-card {
            background: rgba(30, 58, 95, 0.8);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid var(--or-moyen);
            transition: transform 0.3s;
        }

        .update-card:hover {
            transform: translateX(5px);
        }

        /* Card FEATURED pour la nouveauté principale */
        .update-card.featured {
            border: 2px solid var(--or-moyen);
            border-left: 5px solid var(--or-moyen);
            background: linear-gradient(135deg, rgba(36, 63, 102, 0.95) 0%, rgba(30, 58, 95, 0.95) 100%);
            box-shadow: 0 0 20px rgba(245, 203, 66, 0.3);
        }

        .featured-badge {
            display: inline-block;
            background: var(--or-moyen);
            color: var(--bleu-nuit);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .update-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .update-date {
            color: var(--or-moyen);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .update-version {
            background: var(--or-moyen);
            color: var(--bleu-nuit);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .update-list {
            list-style: none;
            padding-left: 0;
        }

        .update-list li {
            padding: 8px 0;
            padding-left: 30px;
            position: relative;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .update-list li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: var(--or-moyen);
            font-weight: bold;
        }

        .try-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: var(--or-moyen);
            color: var(--bleu-nuit);
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .try-btn:hover {
            background: #fff;
            transform: scale(1.05);
        }

        .footer {
            text-align: center;
            color: #888;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .update-card {
                padding: 20px;

        function updateContent(lang) {
            const t = TRANSLATIONS[lang] || TRANSLATIONS.FR;

            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('pageSubtitle').textContent = t.pageSubtitle;
            document.getElementById('backBtn').textContent = t.backBtn;

            const updatesContainer = document.getElementById('updatesContainer');
            updatesContainer.innerHTML = '';

            t.updates.forEach(update => {
                const updateDiv = document.createElement('div');
                updateDiv.className = update.featured ? 'update-card featured' : 'update-card';
                
                let headerHTML = `
                    <div class="update-header">
                        <div class="update-date">${update.date}${update.featured ? `<span class="featured-badge">${t.featured}</span>` : ''}</div>
                        <div class="update-version">${update.version}</div>
                    </div>
                `;
                
                let listHTML = `
                    <ul class="update-list">
                        ${update.items.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                `;
                
                let btnHTML = update.featured ? `<a href="lecteur.html" class="try-btn">${t.tryNow}</a>` : '';
                
                updateDiv.innerHTML = headerHTML + listHTML + btnHTML;
                updatesContainer.appendChild(updateDiv);
            });
        }
