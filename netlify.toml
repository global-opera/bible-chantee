[build.processing.html]
  pretty_urls = false

[build.processing.js]
  bundle = false
  minify = false

[[redirects]]
  from = "/"
  to = "/lecteur.html"
  status = 302
  force = true
  conditions = {Host = ["biblechantee.com", "www.biblechantee.com"]}

[[redirects]]
  from = "/index.html"
  to = "/lecteur.html"
  status = 302
  force = true
  conditions = {Host = ["biblechantee.com", "www.biblechantee.com"]}

[[redirects]]
  from = "/thank-you*"
  to = "/thank-you.html"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Audit du 2026-09-07 : le site publie la racine du depot, donc les scripts,
