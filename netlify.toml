[build]
  publish = "."

# Anti-cache pour index.html
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

# --- PROD: block demo/crowdfunding/old pages (strict funnel) ---
[[redirects]]
  from = "/demo*"
  to = "/lecteur.html"
  status = 302
  force = true

[[redirects]]
  from = "/crowdfunding*"
  to = "/lecteur.html"
  status = 302
  force = true

[[redirects]]
  from = "/contact*"
  to = "/lecteur.html"
  status = 302
  force = true

[[redirects]]
  from = "/pricing*"
  to = "/lecteur.html"
  status = 302
  force = true

[[redirects]]
  from = "/html%20old/*"
  to = "/lecteur.html"
  status = 302
  force = true

[[redirects]]
  from = "/Scripts/*"
  to = "/lecteur.html"
  status = 302
  force = true

[[redirects]]
  from = "/mnt/*"
  to = "/lecteur.html"
  status = 302
  force = true

[[redirects]]
  from = "/bible-chantee-fr-site/*"
  to = "/lecteur.html"
  status = 302
  force = true
