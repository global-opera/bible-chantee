[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/demo.html"
  status = 200
  conditions = {Host = ["sungbible.world"]}

[[redirects]]
  from = "/"
  to = "/lecteur.html"
  status = 200
  conditions = {Host = ["biblechantee.com"]}
