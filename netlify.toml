[build]
  publish = "."

# Anti-cache pour index.html
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

# Premium d'abord si cookie bc_premium present
[[redirects]]
  from = "/"
  to = "/premium.html"
  status = 302
  force = true
  conditions = {Cookie = ["bc_premium"]}

# Sinon lecteur
[[redirects]]
  from = "/"
  to = "/lecteur.html"
  status = 302
  force = true
