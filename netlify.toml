[build]
  publish = "."

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

# -------------------------
# PRODUCTION ONLY (funnel)
# -------------------------
[context.production]

  [[context.production.redirects]]
    from = "/demo*"
    to = "/lecteur.html"
    status = 302
    force = true

  [[context.production.redirects]]
    from = "/crowdfunding*"
    to = "/lecteur.html"
    status = 302
    force = true

  [[context.production.redirects]]
    from = "/contact*"
    to = "/lecteur.html"
    status = 302
    force = true

  [[context.production.redirects]]
    from = "/pricing*"
    to = "/lecteur.html"
    status = 302
    force = true

  [[context.production.redirects]]
    from = "/html%20old/*"
    to = "/lecteur.html"
    status = 302
    force = true

  [[context.production.redirects]]
    from = "/Scripts/*"
    to = "/lecteur.html"
    status = 302
    force = true

  [[context.production.redirects]]
    from = "/mnt/*"
    to = "/lecteur.html"
    status = 302
    force = true

  [[context.production.redirects]]
    from = "/bible-chantee-fr-site/*"
    to = "/lecteur.html"
    status = 302
    force = true

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 301
  force = true
