[build]
  publish = "."
  command = "echo 'No build needed'"

# ============================================================================
# ARCHITECTURE DÉFINITIVE - REDIRECTIONS 301
# ============================================================================
# Règle absolue : TOUTES les URLs clean → fichier .html
# AUCUNE page sans extension ne doit exister
# Index.html = SEULE page avec sélecteur de langue
# ============================================================================

# Promesses/promesses (PT/EN/FR)
[[redirects]]
  from = "/promesses"
  to = "/promesses.html"
  status = 301
  force = true

[[redirects]]
  from = "/promesses-tema"
  to = "/promesses-tema.html"
  status = 301
  force = true

[[redirects]]
  from = "/promesses"
  to = "/promesses.html"
  status = 301
  force = true

[[redirects]]
  from = "/promesse-detail"
  to = "/promesse-detail.html"
  status = 301
  force = true

# Confessions
[[redirects]]
  from = "/confessions"
  to = "/confessions.html"
  status = 301
  force = true

[[redirects]]
  from = "/confessions-tema"
  to = "/confessions-tema.html"
  status = 301
  force = true

[[redirects]]
  from = "/confession-detail"
  to = "/confession-detail.html"
  status = 301
  force = true

# Bible & Lecteur
[[redirects]]
  from = "/bible"
  to = "/bible.html"
  status = 301
  force = true

[[redirects]]
  from = "/lecteur"
  to = "/lecteur.html"
  status = 301
  force = true

# Pages informatives
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 301
  force = true

# ============================================================================
# NOUVELLE ARCHITECTURE - PAGES DE LANGUES (2025-12-17)
# ============================================================================
# Pages de lecteurs par langue avec système freemium
# Chaque langue a son propre localStorage et 100 crédits gratuits
# ============================================================================

# French reader
[[redirects]]
  from = "/fr"
  to = "/fr/index.html"
  status = 200

[[redirects]]
  from = "/fr/"
  to = "/fr/index.html"
  status = 200

# English reader
[[redirects]]
  from = "/en"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/en/"
  to = "/en/index.html"
  status = 200

# Portuguese reader
[[redirects]]
  from = "/pt"
  to = "/pt/index.html"
  status = 200

[[redirects]]
  from = "/pt/"
  to = "/pt/index.html"
  status = 200

# 404 fallback - APRÈS toutes les règles spécifiques
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

