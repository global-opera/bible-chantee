<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Spotify Auth - Bible Chantée</title>
<style>
  body { font-family: monospace; background: #121212; color: #1DB954; padding: 40px; }
  h2 { color: #fff; }
  #code { background: #282828; padding: 20px; border-radius: 8px; word-break: break-all; color: #1DB954; font-size: 14px; margin-top: 20px; }
  #error { color: #e74c3c; }
  button { margin-top: 16px; background: #1DB954; color: #000; border: none; padding: 12px 24px; border-radius: 24px; font-size: 16px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<h2>Spotify Authorization</h2>
<div id="content"></div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');
  const div = document.getElementById('content');

  if (error) {
    div.innerHTML = '<p id="error">Erreur : ' + error + '</p>';
  } else if (code) {
    div.innerHTML = '<p>Code d\'autorisation reçu. Copie l\'URL complète de ta barre d\'adresse et colle-la dans Claude Code.</p>'
      + '<div id="code">' + window.location.href + '</div>'
      + '<button onclick="navigator.clipboard.writeText(window.location.href).then(()=>this.textContent=\'Copié !\')">Copier l\'URL</button>';
  } else {
    div.innerHTML = '<p>Aucun paramètre reçu.</p>';
  }
</script>
</body>
</html>
