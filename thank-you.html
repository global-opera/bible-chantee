<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="thankYouPageTitle">Merci - Bible Chantée</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TX3ETCKJQZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-TX3ETCKJQZ');
    gtag('config', 'G-H8H3TWSGTF');
  </script>

  <style>
    body{background:#1a2332;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;margin:0}
    .container{text-align:center;padding:40px}
    h1{color:#d4a84b;font-size:2.5em;margin-bottom:20px}
    p{color:#fff;font-size:1.2em;margin:20px 0}
    .sub{color:#aaa;font-size:1em}
    a{display:inline-block;margin-top:30px;padding:15px 40px;background:#d4a84b;color:#1a2332;text-decoration:none;border-radius:25px;font-weight:bold;transition:transform 0.2s}
    a:hover{transform:scale(1.05)}
    .emoji{font-size:3em;margin-bottom:20px}
  </style>

<script src="translations.js"></script>
<script src="translations-extra.js"></script>
<script src="i18n.js"></script>
<script src="lang-shared.js"></script>
</head>
<body>
  <div class="container">
    <div class="emoji">🎵</div>
    <h1 id="title" data-i18n="thankYouTitle">Merci !</h1>
    <p id="message" data-i18n="thankYouMessage">Vous avez été inscrit avec succès.</p>
    <p class="sub" id="submessage" data-i18n="thankYouSubmessage">Nous vous informerons lorsque du nouveau contenu sera disponible.</p>
    <a href="https://biblechantee.com/lecteur.html" id="access-link" data-i18n="thankYouButton">Accéder au site (100 crédits gratuits)</a>
  </div>

  <script>
    // Initialize BibleI18n system
    const BibleI18n = {
      currentLang: window.currentLanguage || (window.BC_LANG && window.BC_LANG.current) || 'EN',

      init() {
        // Read language from localStorage (backward compatibility with bc_lang)
        const storedLang = localStorage.getItem('bc_lang');
        if (storedLang) {
          this.currentLang = String(storedLang).toUpperCase();
        } else {
          this.currentLang = window.currentLanguage || (window.BC_LANG && window.BC_LANG.current) || 'EN';
        }

        // Update <html lang> attribute for SEO/accessibility
        if (window.updateHtmlLang) {
          window.updateHtmlLang(this.currentLang);
        }

        this.updatePageTitle();
        this.translatePage();
        this.updateAccessLink();
        this.trackSignup();
        this.setupAutoRedirect();
      },

      updatePageTitle() {
        const t = window.translations?.[this.currentLang];
        if (t?.thankYouPageTitle) {
          document.title = t.thankYouPageTitle;
        }
      },

      translatePage() {
        const t = window.translations?.[this.currentLang];
        if (!t) return;

        // Translate all elements with data-i18n
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (t[key]) {
            if (el.tagName === 'TITLE') {
              el.textContent = t[key];
            } else {
              el.textContent = t[key];
            }
          }
        });
      },

      updateAccessLink() {
        const link = document.getElementById('access-link');
        if (link) {
          link.href = `https://biblechantee.com/lecteur.html?lang=${this.currentLang}`;
          console.log(`✅ Thank you page displayed in: ${this.currentLang}`);
          console.log(`📍 Redirect link: ${link.href}`);
        }
      },

      trackSignup() {
        // Track signup event to GA4
        if (typeof gtag === 'function') {
          gtag('event', 'sign_up', {
            method: 'netlify_form',
            lang: this.currentLang
          });
          console.log('📊 GA4 event sent: sign_up');
        }
      },

      setupAutoRedirect() {
        // Auto-redirect after 5 seconds
        setTimeout(() => {
          const link = document.getElementById('access-link');
          if (link && link.href) {
            console.log('🔄 Auto-redirecting to lecteur...');
            window.location.href = link.href;
          }
        }, 5000);
      }
    };

    // Initialize on DOM ready
    document.addEventListener('DOMContentLoaded', () => {
      BibleI18n.init();
    });

    // Re-translate on language change
    window.addEventListener('languageChanged', (e) => {
      BibleI18n.currentLang = e.detail.lang;
      BibleI18n.init();
    });
  </script>
</body>
</html>
