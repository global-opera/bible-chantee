<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promesses - Bible Chantee</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a237e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        .back-link {
            display: inline-block;
            color: #f5c842;
            text-decoration: none;
            padding: 10px 25px;
            border: 2px solid #f5c842;
            border-radius: 25px;
            margin-bottom: 30px;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: #f5c842;
            color: #1a237e;
        }
        
        .theme-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .theme-icon { font-size: 4rem; margin-bottom: 15px; }
        .theme-name { 
            color: #f5c842; 
            font-size: 2.2rem; 
            font-weight: bold; 
            margin-bottom: 10px; 
        }
        .theme-desc { 
            color: #b0b0b0; 
            font-size: 1.1rem; 
            font-style: italic;
        }
        
        .psalms-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .psalm-card {
            background: rgba(30, 58, 95, 0.9);
            border-radius: 15px;
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .psalm-card:hover {
            box-shadow: 0 5px 20px rgba(245, 200, 66, 0.2);
        }
        
        .psalm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .psalm-title {
            color: #f5c842;
            font-size: 1.4rem;
            font-weight: bold;
        }
        
        .psalm-theme {
            color: #8899aa;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.3);
            padding: 5px 12px;
            border-radius: 15px;
        }
        
        .audio-player {
            width: 100%;
            margin: 15px 0;
        }

        .audio-player audio {
            width: 100%;
            height: 45px;
            border-radius: 25px;
        }

        .psalm-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f5c842 0%, #e0b030 100%);
            color: #1e3a5f;
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(245, 200, 66, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #f5c842;
            color: #f5c842;
        }
        .btn-secondary:hover {
            background: rgba(245, 200, 66, 0.1);
        }

        .btn-toggle {
            background: transparent;
            border: 1px solid rgba(245, 200, 66, 0.4);
            color: #f5c842;
        }
        .btn-toggle.active {
            background: #f5c842;
            color: #1e3a5f;
            font-weight: bold;
        }
        .btn-toggle:hover {
            background: rgba(245, 200, 66, 0.1);
        }

        .lyrics-box {
            background: rgba(10, 22, 40, 0.8);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.8;
            color: #e0e0e0;
            display: none;
        }
        .lyrics-box.active {
            display: block;
        }
        
        .no-audio {
            color: #8899aa;
            font-style: italic;
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        
        @media (max-width: 480px) {
            .theme-name { font-size: 1.6rem; }
            .psalm-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .psalm-actions { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>

    // Mapping index theme -> section key (meme que sections-promesses.js)
    const THEME_INDEX_TO_KEY = [
        'anxiete',   // 0
        'paix',      // 1
        'louange',   // 2
        'protection', // 3
        'tristesse', // 4
        'force',     // 5
        'confiance', // 6
        'amour',     // 7
        'esperance', // 8
        'adoration'  // 9
    ];

    function getLecteurUrl(psalmNum, lang, themeIndex) {
        const sectionKey = THEME_INDEX_TO_KEY[themeIndex] || 'anxiete';
        const isPremium = (localStorage.getItem('bc_unlimited') === 'true')
            || /(?:^|;\\s*)bc_premium=1(?:;|$)/.test(document.cookie || '');
        const page = isPremium ? 'premium.html' : 'lecteur.html';
        return `${page}?book=19&chapter=${psalmNum}&lang=${lang}&return=/promesse-detail.html?theme=${themeIndex}&section=${sectionKey}`;
    }

    function render() {
        const urlParams = new URLSearchParams(window.location.search);
        const themeIndex = parseInt(urlParams.get('theme')) || 0;
        const lang = urlParams.get('lang') || localStorage.getItem('selectedLang') || 'EN';
        
        const langData = THEMES_DATA[lang] || THEMES_DATA.FR;
        const theme = langData.themes[themeIndex];
        
        if (!theme) {
            window.location.href = 'promesses.html';
            return;
        }
        
        // Update back link
        document.getElementById('backLink').textContent = langData.back;
        document.getElementById('backLink').href = `promesses.html?lang=${lang}`;
        
        // Update header
        document.getElementById('themeIcon').textContent = theme.icon;
        document.getElementById('themeName').textContent = theme.name;
        document.getElementById('themeDesc').textContent = theme.desc;
        document.title = `${theme.name} - ${langData.siteName}`;
        
        // Build psalms list
        const listContainer = document.getElementById('psalmsList');
        listContainer.innerHTML = '';
        
        theme.psalms.forEach((psalmNum, index) => {
            const card = document.createElement('div');
            card.className = 'psalm-card';
            card.dataset.psalmNum = psalmNum;

            const psalmTheme = PSALM_THEMES[psalmNum] ? (PSALM_THEMES[psalmNum][lang] || PSALM_THEMES[psalmNum].FR) : '';
            const audioUrl = getAudioUrl(psalmNum, lang);
            const lyricsId = `lyrics-${psalmNum}`;
            const audioId = `audio-${psalmNum}`;

            card.innerHTML = `
                <div class="psalm-header">
                    <h2 class="psalm-title">${langData.psalmWord} ${psalmNum}</h2>
                    <span class="psalm-theme">${psalmTheme}</span>
                </div>
                <div class="audio-player">
                    <audio id="${audioId}" controls ${index === 0 ? 'autoplay' : ''}>
                        ${audioUrl ? `<source src="${audioUrl}" type="audio/mpeg">` : ''}
                    </audio>
                </div>
                <div class="psalm-actions">
                    <button class="btn btn-toggle" onclick="toggleLyrics('${lyricsId}', this)">
                        🎤 ${langData.lyricsLabel || 'Paroles'}
                    </button>
                    <button class="btn btn-toggle" onclick="toggleBible('${psalmNum}', '${lyricsId}', this, '${lang}')">
                        📖 ${langData.bibleLabel || 'Bible'}
                    </button>
                </div>
                <div id="${lyricsId}" class="lyrics-box">
                    ${langData.loadingText || 'Chargement...'}
                </div>
            `;

            listContainer.appendChild(card);

            // Load lyrics after card is added
            loadLyrics(psalmNum, lang, lyricsId);
        });
    }

    // Get audio URL for psalm
    function getAudioUrl(psalmNum, lang) {
        // Format: 19_PSA_23_ES for Psalm 23 in Spanish
        const langUpper = lang.toUpperCase();
        const chapter = String(psalmNum).padStart(2, '0');
        const key = `19_PSA_${chapter}_${langUpper}`;

        // Try to get from window.AUDIO_URLS if it exists
        if (window.AUDIO_URLS && window.AUDIO_URLS[key]) {
            return window.AUDIO_URLS[key];
        }

        // Fallback to R2 URL pattern
        return `https://pub-2dc4dfed0c5e45338913878f35d4d56a.r2.dev/${langUpper}/19_PSA/19_PSA_${chapter}_${langUpper}.mp3`;
    }

    // Toggle lyrics display
    function toggleLyrics(lyricsId, button) {
        const lyricsBox = document.getElementById(lyricsId);
        const allButtons = button.parentElement.querySelectorAll('.btn-toggle');

        if (lyricsBox.classList.contains('active')) {
            lyricsBox.classList.remove('active');
            button.classList.remove('active');
        } else {
            lyricsBox.classList.add('active');
            allButtons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }
    }

    // Toggle Bible text display
    function toggleBible(psalmNum, lyricsId, button, lang) {
        const lyricsBox = document.getElementById(lyricsId);
        const allButtons = button.parentElement.querySelectorAll('.btn-toggle');
        const langData = THEMES_DATA[lang] || THEMES_DATA.FR;

        // Load Bible text (simplified - you can enhance this)
        const bibleText = `Psaume ${psalmNum}\n\n[Texte biblique du Psaume ${psalmNum}]\n\nPour lire le texte complet, ouvrez le lecteur principal.`;

        if (lyricsBox.classList.contains('active') && button.classList.contains('active')) {
            lyricsBox.classList.remove('active');
            button.classList.remove('active');
        } else {
            lyricsBox.textContent = bibleText;
            lyricsBox.classList.add('active');
            allButtons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }
    }

    // Load lyrics from JSON file
    async function loadLyrics(psalmNum, lang, lyricsId) {
        const lyricsBox = document.getElementById(lyricsId);
        const langData = THEMES_DATA[lang] || THEMES_DATA.FR;
        const langUpper = lang.toUpperCase();

        try {
            // Load lyrics from JSON file (lyrics/ES.json, lyrics/FR.json, etc.)
            const response = await fetch(`lyrics/${langUpper}.json`);
            if (response.ok) {
                const data = await response.json();
                // Get psalm from book 19
                if (data['19'] && data['19'][String(psalmNum)]) {
                    let lyrics = data['19'][String(psalmNum)];
                    // Clean up the text (remove [TITLE], [LYRICS] tags, etc.)
                    lyrics = lyrics.replace(/\[TITLE\]\r?\n/g, '');
                    lyrics = lyrics.replace(/\[LYRICS\]\r?\n/g, '');
                    lyrics = lyrics.replace(/\r\n/g, '\n');
                    lyricsBox.textContent = lyrics.trim();
                } else {
                    lyricsBox.textContent = langData.lyricsUnavailable || 'Paroles non disponibles';
                }
            } else {
                lyricsBox.textContent = langData.lyricsUnavailable || 'Paroles non disponibles';
            }
        } catch (error) {
            console.error('Error loading lyrics:', error);
            lyricsBox.textContent = langData.lyricsUnavailable || 'Paroles non disponibles';
        }
    }

    document.addEventListener('DOMContentLoaded', render);
    </script>
