<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promesses - Bible Chantee</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a237e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        .back-link {
            display: inline-block;
            color: #f5c842;
            text-decoration: none;
            padding: 10px 25px;
            border: 2px solid #f5c842;
            border-radius: 25px;
            margin-bottom: 30px;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: #f5c842;
            color: #1a237e;
        }
        
        .theme-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .theme-icon { font-size: 4rem; margin-bottom: 15px; }
        .theme-name { 
            color: #f5c842; 
            font-size: 2.2rem; 
            font-weight: bold; 
            margin-bottom: 10px; 
        }
        .theme-desc { 
            color: #b0b0b0; 
            font-size: 1.1rem; 
            font-style: italic;
        }
        
        .psalms-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .psalm-card {
            background: rgba(30, 58, 95, 0.9);
            border-radius: 15px;
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .psalm-card:hover {
            box-shadow: 0 5px 20px rgba(245, 200, 66, 0.2);
        }
        
        .psalm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .psalm-title {
            color: #f5c842;
            font-size: 1.4rem;
            font-weight: bold;
        }
        
        .psalm-theme {
            color: #8899aa;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.3);
            padding: 5px 12px;
            border-radius: 15px;
        }
        
        .audio-player {
            width: 100%;
            margin: 15px 0;
        }

        .audio-player audio {
            width: 100%;
            height: 45px;
            border-radius: 25px;
        }

        .psalm-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f5c842 0%, #e0b030 100%);
            color: #1e3a5f;
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(245, 200, 66, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #f5c842;
            color: #f5c842;
        }
        .btn-secondary:hover {
            background: rgba(245, 200, 66, 0.1);
        }

        .btn-toggle {
            background: transparent;
            border: 1px solid rgba(245, 200, 66, 0.4);
            color: #f5c842;
        }
        .btn-toggle.active {
            background: #f5c842;
            color: #1e3a5f;
            font-weight: bold;
        }
        .btn-toggle:hover {
            background: rgba(245, 200, 66, 0.1);
        }

        .lyrics-box {
            background: rgba(10, 22, 40, 0.8);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.8;
            color: #e0e0e0;
            display: none;
        }
        .lyrics-box.active {
            display: block;
        }

        /* Styles for formatted lyrics (Couplet 1, Refrain, etc.) */
        .lyrics-container {
            font-size: 1rem;
            line-height: 1.8;
        }
        .lyrics-section {
            margin-bottom: 20px;
        }
        .lyrics-tag {
            font-weight: bold;
            color: #f5c842;
            margin-bottom: 8px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .lyrics-paragraph {
            color: #e0e0e0;
            margin-bottom: 12px;
        }
        
        .no-audio {
            color: #8899aa;
            font-style: italic;
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        
        @media (max-width: 480px) {
            .theme-name { font-size: 1.6rem; }
            .psalm-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .psalm-actions { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>

    // Mapping index theme -> section key (meme que sections-promesses.js)
    const THEME_INDEX_TO_KEY = [
        'anxiete',   // 0
        'paix',      // 1
        'louange',   // 2
        'protection', // 3
        'tristesse', // 4
        'force',     // 5
        'confiance', // 6
        'amour',     // 7
        'esperance', // 8
        'adoration'  // 9
    ];

    function getLecteurUrl(psalmNum, lang, themeIndex) {
        const sectionKey = THEME_INDEX_TO_KEY[themeIndex] || 'anxiete';
        const isPremium = (localStorage.getItem('bc_unlimited') === 'true')
            || /(?:^|;\\s*)bc_premium=1(?:;|$)/.test(document.cookie || '');
        const page = isPremium ? 'premium.html' : 'lecteur.html';
        return `${page}?book=19&chapter=${psalmNum}&lang=${lang}&return=/promesse-detail.html?theme=${themeIndex}&section=${sectionKey}`;
    }

    function render() {
        const urlParams = new URLSearchParams(window.location.search);
        const themeIndex = parseInt(urlParams.get('theme')) || 0;
        currentLang = urlParams.get('lang') || localStorage.getItem('selectedLang') || 'EN';

        const langData = THEMES_DATA[currentLang] || THEMES_DATA.FR;
        const theme = langData.themes[themeIndex];
        
        if (!theme) {
            window.location.href = 'promesses.html';
            return;
        }
        
        // Update back link
        document.getElementById('backLink').textContent = langData.back;
        document.getElementById('backLink').href = `promesses.html?lang=${currentLang}`;

        // Update header
        document.getElementById('themeIcon').textContent = theme.icon;
        document.getElementById('themeName').textContent = theme.name;
        document.getElementById('themeDesc').textContent = theme.desc;
        document.title = `${theme.name} - ${langData.siteName}`;

        // Build psalms list
        const listContainer = document.getElementById('psalmsList');
        listContainer.innerHTML = '';

        theme.psalms.forEach((psalmNum, index) => {
            const card = document.createElement('div');
            card.className = 'psalm-card';
            card.dataset.psalmNum = psalmNum;

            const psalmTheme = PSALM_THEMES[psalmNum] ? (PSALM_THEMES[psalmNum][currentLang] || PSALM_THEMES[psalmNum].FR) : '';
            const audioUrl = getAudioUrl(psalmNum, currentLang);
            const lyricsId = `lyrics-${psalmNum}`;
            const audioId = `audio-${psalmNum}`;

            card.innerHTML = `
                <div class="psalm-header">
                    <h2 class="psalm-title">${langData.psalmWord} ${psalmNum}</h2>
                    <span class="psalm-theme">${psalmTheme}</span>
                </div>
                <div class="audio-player">
                    <audio id="${audioId}" controls ${index === 0 ? 'autoplay' : ''}>
                        ${audioUrl ? `<source src="${audioUrl}" type="audio/mpeg">` : ''}
                    </audio>
                </div>
                <div class="psalm-actions">
                    <button class="btn btn-toggle" onclick="toggleLyrics('${lyricsId}', this)">
                        🎤 ${langData.lyricsLabel || 'Paroles'}
                    </button>
                    <button class="btn btn-toggle" onclick="toggleBible('${psalmNum}', '${lyricsId}', this, '${currentLang}')">
                        📖 ${langData.bibleLabel || 'Bible'}
                    </button>
                    <button class="btn btn-toggle" onclick="shareContent(${themeIndex}, ${psalmNum}, '${currentLang}', this)">
                        🔗 ${langData.shareLabel || 'Partager'}
                    </button>
                </div>
                <div id="${lyricsId}" class="lyrics-box">
                    ${langData.loadingText || 'Chargement...'}
                </div>
            `;

            listContainer.appendChild(card);

            // Load lyrics after card is added
            loadLyrics(psalmNum, currentLang, lyricsId);
        });
    }

    // Get audio URL for psalm
    function getAudioUrl(psalmNum, lang) {
        // Format: 19_PSA_23_ES for Psalm 23 in Spanish
        const langUpper = lang.toUpperCase();
        const chapter = String(psalmNum).padStart(2, '0');
        const key = `19_PSA_${chapter}_${langUpper}`;

        // Try to get from window.AUDIO_URLS if it exists
        if (window.AUDIO_URLS && window.AUDIO_URLS[key]) {
            return window.AUDIO_URLS[key];
        }

        // Fallback to R2 URL pattern
        return `https://pub-2dc4dfed0c5e45338913878f35d4d56a.r2.dev/${langUpper}/19_PSA/19_PSA_${chapter}_${langUpper}.mp3`;
    }

    // Cache for loaded content
    const contentCache = {};

    // Toggle lyrics display
    function toggleLyrics(lyricsId, button) {
        const lyricsBox = document.getElementById(lyricsId);
        const psalmNum = lyricsId.replace('lyrics-', '');

        // Deactivate Bible button
        const bibleBtn = button.parentElement.querySelector('.btn-toggle:not(:first-child)');
        if (bibleBtn) bibleBtn.classList.remove('active');

        if (button.classList.contains('active')) {
            lyricsBox.classList.remove('active');
            button.classList.remove('active');
        } else {
            // Restore lyrics from cache or reload
            if (contentCache[`lyrics-${psalmNum}-${currentLang}`]) {
                lyricsBox.innerHTML = contentCache[`lyrics-${psalmNum}-${currentLang}`];
            }
            lyricsBox.classList.add('active');
            button.classList.add('active');
        }
    }

    // Map language codes to Bible file names
    const BIBLE_FILES = {
        'FR': 'fr_bible_segond1910.json',
        'EN': 'en_bible_kjv_1611.json',
        'PT': 'pt_bible_almeida_acf.json',
        'ES': 'es_bible_reina_valera_1909.json',
        'DE': 'de_bible_luther_1912.json',
        'IT': 'it_bible_diodati_1649.json'
    };

    // Toggle Bible text display
    async function toggleBible(psalmNum, lyricsId, button, lang) {
        const lyricsBox = document.getElementById(lyricsId);
        const langData = THEMES_DATA[lang] || THEMES_DATA.FR;
        const langUpper = lang.toUpperCase();

        // Deactivate Lyrics button
        const lyricsBtn = button.parentElement.querySelector('.btn-toggle:first-child');
        if (lyricsBtn) lyricsBtn.classList.remove('active');

        // Deactivate Share button
        const shareBtn = button.parentElement.querySelector('.btn-toggle:last-child');
        if (shareBtn) shareBtn.classList.remove('active');

        if (button.classList.contains('active')) {
            lyricsBox.classList.remove('active');
            button.classList.remove('active');
        } else {
            button.classList.add('active');
            lyricsBox.classList.add('active');

            // Check cache first
            const cacheKey = `bible-${psalmNum}-${lang}`;
            if (contentCache[cacheKey]) {
                lyricsBox.textContent = contentCache[cacheKey];
                return;
            }

            lyricsBox.textContent = langData.loadingText || 'Chargement...';

            try {
                const bibleFile = BIBLE_FILES[langUpper] || BIBLE_FILES['EN'];
                const response = await fetch(`bible/${bibleFile}`);

                if (response.ok) {
                    const data = await response.json();
                    const verses = data.verses || [];

                    // Filter verses for Psalms (book 19) and specific chapter
                    const psalmVerses = verses.filter(v =>
                        v.book === 19 && v.chapter === parseInt(psalmNum)
                    );

                    if (psalmVerses.length > 0) {
                        // Combine verses into text
                        const bibleText = psalmVerses
                            .sort((a, b) => a.verse - b.verse)
                            .map(v => `${v.verse}. ${v.text}`)
                            .join('\n\n');

                        // Cache the result
                        contentCache[cacheKey] = bibleText;
                        lyricsBox.textContent = bibleText;
                    } else {
                        lyricsBox.textContent = langData.lyricsUnavailable || 'Texte biblique non disponible';
                    }
                } else {
                    lyricsBox.textContent = langData.lyricsUnavailable || 'Texte biblique non disponible';
                }
            } catch (error) {
                console.error('Error loading Bible text:', error);
                lyricsBox.textContent = langData.lyricsUnavailable || 'Erreur de chargement';
            }
        }
    }

    // Load lyrics from window.chapterLyricsPrompts (same as lecteur.html)
    async function loadLyrics(psalmNum, lang, lyricsId) {
        const lyricsBox = document.getElementById(lyricsId);
        const langData = THEMES_DATA[lang] || THEMES_DATA.FR;

        // Check cache first
        const cacheKey = `lyrics-${psalmNum}-${lang}`;
        if (contentCache[cacheKey]) {
            lyricsBox.innerHTML = contentCache[cacheKey];
            return;
        }

        try {
            // Pour FR: utiliser window.chapterLyricsPrompts (paroles structurées avec tags [Verse], [Chorus])
            if (lang === 'FR' && window.chapterLyricsPrompts && window.LyricsFormatter) {
                const rawLyrics = window.chapterLyricsPrompts['19'] && window.chapterLyricsPrompts['19'][psalmNum];

                if (rawLyrics && rawLyrics.includes('[Verse')) {
                    // Formater avec LyricsFormatter (convertit [Verse 1] → "Couplet 1", [Chorus] → "Refrain", etc.)
                    const formattedHTML = window.LyricsFormatter.format(rawLyrics);
                    contentCache[cacheKey] = formattedHTML;
                    lyricsBox.innerHTML = formattedHTML;
                    return;
                }
            }

            // Fallback: charger depuis JSON pour les autres langues
            const langUpper = lang.toUpperCase();
            const response = await fetch(`lyrics/${langUpper}.json`);
            if (response.ok) {
                const data = await response.json();
                // Get psalm from book 19
                if (data['19'] && data['19'][String(psalmNum)]) {
                    let lyrics = data['19'][String(psalmNum)];
                    // Clean up the text (remove [TITLE], [LYRICS] tags, etc.)
                    lyrics = lyrics.replace(/\[TITLE\]\r?\n/g, '');
                    lyrics = lyrics.replace(/\[LYRICS\]\r?\n/g, '');
                    lyrics = lyrics.replace(/\r\n/g, '\n');
                    lyrics = lyrics.trim();

                    // Cache the result
                    contentCache[cacheKey] = lyrics;
                    lyricsBox.textContent = lyrics;
                } else {
                    lyricsBox.textContent = langData.lyricsUnavailable || 'Paroles non disponibles';
                }
            } else {
                lyricsBox.textContent = langData.lyricsUnavailable || 'Paroles non disponibles';
            }
        } catch (error) {
            console.error('Error loading lyrics:', error);
            lyricsBox.textContent = langData.lyricsUnavailable || 'Paroles non disponibles';
        }
    }

    // Share content function
    function shareContent(themeIndex, psalmNum, lang, button) {
        const langData = THEMES_DATA[lang] || THEMES_DATA.FR;

        // Generate shareable URL with shared=true parameter for email gate
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}?theme=${themeIndex}&psalm=${psalmNum}&lang=${lang}&shared=true`;

        // Copy to clipboard
        navigator.clipboard.writeText(shareUrl).then(() => {
            // Show feedback
            const originalText = button.innerHTML;
            button.innerHTML = `✓ ${langData.shareCopied}`;
            button.classList.add('active');

            setTimeout(() => {
                button.innerHTML = originalText;
                button.classList.remove('active');
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy:', err);
            alert(shareUrl);
        });
    }

    // Check if this is a shared link (requires email gate)
    function checkEmailGate() {
        const urlParams = new URLSearchParams(window.location.search);
        const isShared = urlParams.get('shared');

        if (isShared === 'true') {
            // Check if user has already entered email within 7 days
            const emailData = localStorage.getItem('bc_trial_email');

            if (emailData) {
                const data = JSON.parse(emailData);
                const now = Date.now();
                const sevenDays = 7 * 24 * 60 * 60 * 1000;

                if (now - data.timestamp < sevenDays) {
                    // Still within trial period
                    return true;
                }
            }

            // Show email gate modal
            showEmailGate();
            return false;
        }

        return true;
    }

    // Show email gate modal
    function showEmailGate() {
        const lang = new URLSearchParams(window.location.search).get('lang') || currentLang;
        const langData = THEMES_DATA[lang] || THEMES_DATA.FR;

        const modal = document.createElement('div');
        modal.id = 'emailGateModal';
        modal.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        `;

        const modalContent = document.createElement('div');
        modalContent.style.cssText = `
            background: linear-gradient(135deg, #1a237e 0%, #0a1628 100%);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 60px rgba(245, 200, 66, 0.3);
        `;

        const messages = {
            FR: {
                title: 'Bienvenue sur Bible Chantée',
                subtitle: 'Entrez votre email pour accéder gratuitement pendant 7 jours',
                placeholder: 'Votre email',
                button: 'Accéder gratuitement',
                privacy: 'Nous respectons votre vie privée'
            },
            EN: {
                title: 'Welcome to Sung Bible',
                subtitle: 'Enter your email for 7 days free access',
                placeholder: 'Your email',
                button: 'Get Free Access',
                privacy: 'We respect your privacy'
            },
            PT: {
                title: 'Bem-vindo à Bíblia Cantada',
                subtitle: 'Digite seu email para acesso gratuito por 7 dias',
                placeholder: 'Seu email',
                button: 'Obter Acesso Gratuito',
                privacy: 'Respeitamos sua privacidade'
            },
            ES: {
                title: 'Bienvenido a Biblia Cantada',
                subtitle: 'Ingresa tu email para acceso gratuito por 7 días',
                placeholder: 'Tu email',
                button: 'Obtener Acceso Gratuito',
                privacy: 'Respetamos tu privacidad'
            },
            DE: {
                title: 'Willkommen bei Gesungene Bibel',
                subtitle: 'Geben Sie Ihre E-Mail für 7 Tage kostenlosen Zugang ein',
                placeholder: 'Ihre E-Mail',
                button: 'Kostenlosen Zugang erhalten',
                privacy: 'Wir respektieren Ihre Privatsphäre'
            },
            IT: {
                title: 'Benvenuto su Bibbia Cantata',
                subtitle: 'Inserisci la tua email per accesso gratuito per 7 giorni',
                placeholder: 'La tua email',
                button: 'Ottieni Accesso Gratuito',
                privacy: 'Rispettiamo la tua privacy'
            }
        };

        const msg = messages[lang] || messages.FR;

        modalContent.innerHTML = `
            <h1 style="color: #f5c842; margin-bottom: 20px; font-size: 2rem;">🎵 ${msg.title}</h1>
            <p style="font-size: 1.2rem; margin-bottom: 30px; line-height: 1.6;">${msg.subtitle}</p>
            <input type="email" id="trialEmail" placeholder="${msg.placeholder}"
                style="width: 100%; padding: 15px; font-size: 1rem; border-radius: 10px; border: 2px solid #f5c842; margin-bottom: 20px; background: rgba(255,255,255,0.9); color: #1a237e;">
            <button id="submitEmail" style="width: 100%; padding: 15px; font-size: 1.1rem; background: #f5c842; color: #1a237e; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-bottom: 15px;">
                ${msg.button}
            </button>
            <p style="font-size: 0.9rem; color: #b0b0b0;">${msg.privacy}</p>
        `;

        modal.appendChild(modalContent);
        document.body.appendChild(modal);

        // Handle email submission
        document.getElementById('submitEmail').onclick = async function() {
            const email = document.getElementById('trialEmail').value.trim();
            const submitBtn = document.getElementById('submitEmail');

            if (!email || !email.includes('@')) {
                alert('Please enter a valid email address');
                return;
            }

            // Désactiver le bouton pendant la requête
            submitBtn.disabled = true;
            submitBtn.textContent = 'En cours...';

            try {
                // Générer UID unique
                const uid = 'uid_' + Date.now() + '_' + Math.random().toString(36).substring(2, 11);

                // Sauvegarder localement AVANT l'appel backend
                const data = {
                    uid: uid,
                    email: email,
                    timestamp: Date.now()
                };
                localStorage.setItem('bc_trial_email', JSON.stringify(data));

                // Envoyer vers backend Supabase
                const response = await fetch('/.netlify/functions/bc_signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid, email })
                });

                const result = await response.json();

                if (result.ok) {
                    console.log('✅ Utilisateur inscrit:', result.me);

                    // Sauvegarder les infos complètes
                    localStorage.setItem('bc_user', JSON.stringify(result.me));
                } else {
                    console.warn('⚠️ Backend signup failed:', result.error);
                    // Continuer quand même (fail gracefully)
                }

            } catch (error) {
                console.error('❌ Error during signup:', error);
                // Continuer quand même (fail gracefully)
            }

            // Fermer le modal et afficher le contenu
            modal.remove();
            render();
        };

        // Allow Enter key to submit
        document.getElementById('trialEmail').onkeypress = function(e) {
            if (e.key === 'Enter') {
                document.getElementById('submitEmail').click();
            }
        };
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (checkEmailGate()) {
            render();
        }
    });
    </script>
