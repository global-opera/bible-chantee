<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Chantée - Prière</title>
  <style>
    :root {
      --bleu-nuit: #1E3A5F;
      --bleu-sombre: #162B46;
      --bleu-cartes: #243F66;
      --or-moyen: #F5CB42;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, var(--bleu-nuit) 0%, var(--bleu-sombre) 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: white;
      padding: 20px;
    }
    .container { max-width: 500px; margin: 0 auto; text-align: center; }
    .icon { font-size: 60px; margin-bottom: 15px; }
    .title { color: var(--or-moyen); font-size: 24px; margin-bottom: 20px; }
    .player-box {
      background: var(--bleu-cartes);
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(245, 203, 66, 0.3);
      margin-bottom: 20px;
    }
    audio { width: 100%; margin-bottom: 15px; }
    .toggle-row { display: flex; gap: 10px; margin-bottom: 15px; }
    .toggle-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid rgba(245, 203, 66, 0.4);
      border-radius: 10px;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }
    .toggle-btn.active {
      background: var(--or-moyen);
      color: var(--bleu-nuit);
      font-weight: bold;
    }
    .lyrics-box {
      background: var(--bleu-sombre);
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
    }
    .back-btn {
      display: inline-block;
      padding: 12px 30px;
      background: transparent;
      border: 2px solid var(--or-moyen);
      color: var(--or-moyen);
      border-radius: 25px;
      text-decoration: none;
      transition: all 0.3s;
    }
    .back-btn:hover {
      background: var(--or-moyen);
      color: var(--bleu-nuit);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="prayers.html" class="back-btn" id="backBtn">← Retour</a>
    <div class="icon">🙏</div>
    <h1 class="title" id="title">Prière</h1>
    <div class="player-box">
      <audio id="audio" controls autoplay></audio>
      <div class="toggle-row">
        <button class="toggle-btn active" id="toggleLyrics">🎤 Paroles</button>
        <button class="toggle-btn" id="toggleShare">🔗 Partager</button>
      </div>
      <div class="lyrics-box" id="lyricsBox">Chargement...</div>
    </div>
  </div>

  <script src="js/prayers-data.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = parseInt(params.get('id')) || 0;
    const lang = (params.get('lang') || 'FR').toUpperCase();

    // UI translations
    const UI_TEXTS = {
      FR: { lyrics: "🎤 Paroles", share: "🔗 Partager", back: "← Retour", unavailable: "Paroles non disponibles", shareCopied: "Lien copié !" },
      EN: { lyrics: "🎤 Lyrics", share: "🔗 Share", back: "← Back", unavailable: "Lyrics not available", shareCopied: "Link copied!" },
      PT: { lyrics: "🎤 Letras", share: "🔗 Compartilhar", back: "← Voltar", unavailable: "Letras não disponíveis", shareCopied: "Link copiado!" },
      ES: { lyrics: "🎤 Letras", share: "🔗 Compartir", back: "← Volver", unavailable: "Letras no disponibles", shareCopied: "Enlace copiado!" },
      DE: { lyrics: "🎤 Text", share: "🔗 Teilen", back: "← Zurück", unavailable: "Text nicht verfügbar", shareCopied: "Link kopiert!" },
      IT: { lyrics: "🎤 Testo", share: "🔗 Condividi", back: "← Indietro", unavailable: "Testo non disponibile", shareCopied: "Link copiato!" },
      TL: { lyrics: "🎤 Lyrics", share: "🔗 Ibahagi", back: "← Bumalik", unavailable: "Walang lyrics", shareCopied: "Na-copy ang link!" }
    };
    const ui = UI_TEXTS[lang] || UI_TEXTS.FR;

    // Get prayer data
    const prayersForLang = window.getPrayersByLanguage(lang);
    const prayer = prayersForLang[id];

    if (prayer) {
      document.getElementById('title').textContent = prayer.title;

      // Set audio
      const audioUrl = window.getPrayerAudioUrl(prayer.audioFile);
      if (audioUrl) {
        document.getElementById('audio').src = audioUrl;
      }

      // Load lyrics
      const lyricsBox = document.getElementById('lyricsBox');
      if (prayer.lyricsFile) {
        const lyricsPath = window.getPrayerLyricsPath(prayer.lyricsFile);
        fetch(lyricsPath)
          .then(r => r.ok ? r.text() : Promise.reject())
          .then(text => {
            // Convert markdown to simple HTML
            let html = text;
            // Remove [VERSE], [CHORUS], etc. markers
            html = html.replace(/\[(VERSE|CHORUS|BRIDGE|PRE-CHORUS|INTRO|OUTRO|REFRAIN|COUPLET|PONT)\]/gi, '');
            // Convert **bold** to <strong>
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            // Convert line breaks
            html = html.replace(/\n/g, '<br>');
            lyricsBox.innerHTML = html;
          })
          .catch(() => lyricsBox.textContent = ui.unavailable);
      } else {
        lyricsBox.textContent = ui.unavailable;
      }
    }

    // UI elements
    document.getElementById('toggleLyrics').textContent = ui.lyrics;
    document.getElementById('toggleShare').textContent = ui.share;
    document.getElementById('backBtn').textContent = ui.back;
    document.getElementById('backBtn').href = "prayers.html?lang=" + lang;

    // Toggle lyrics
    document.getElementById('toggleLyrics').onclick = function() {
      this.classList.add('active');
      document.getElementById('toggleShare').classList.remove('active');

      if (prayer && prayer.lyricsFile) {
        const lyricsPath = window.getPrayerLyricsPath(prayer.lyricsFile);
        fetch(lyricsPath)
          .then(r => r.text())
          .then(text => {
            let html = text;
            html = html.replace(/\[(VERSE|CHORUS|BRIDGE|PRE-CHORUS|INTRO|OUTRO|REFRAIN|COUPLET|PONT)\]/gi, '');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\n/g, '<br>');
            lyricsBox.innerHTML = html;
          });
      }
    };

    // Share button
    document.getElementById('toggleShare').onclick = function() {
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = `${baseUrl}?id=${id}&lang=${lang}`;

      navigator.clipboard.writeText(shareUrl).then(() => {
        const originalText = this.textContent;
        this.textContent = `✓ ${ui.shareCopied}`;
        this.classList.add('active');
        document.getElementById('toggleLyrics').classList.remove('active');

        setTimeout(() => {
          this.textContent = originalText;
          this.classList.remove('active');
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy:', err);
        alert(shareUrl);
      });
    };
  </script>
</body>
</html>
