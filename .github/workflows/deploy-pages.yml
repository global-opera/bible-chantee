name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare web files
        run: |
          mkdir -p _site
          rsync -av . _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.netlify/' \
            --exclude='_site/' \
            --exclude='Scripts/' \
            --exclude='_BACKUP_*/' \
            --exclude='_archive_*/' \
            --exclude='docs/' \
            --exclude='bible-chantee-fr-site/' \
            --exclude='bibles/' \
            --exclude='netlify/' \
            --exclude='html old/' \
            --exclude='*.py' \
            --exclude='*.ps1' \
            --exclude='*.sql' \
            --exclude='*.bat' \
            --exclude='*.md' \
            --exclude='.env*' \
            --exclude='.gitignore' \
            --exclude='netlify.toml' \
            --exclude='package.json'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
