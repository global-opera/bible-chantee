name: Update Social Stats

on:
  schedule:
      - cron: '0 6 * * *'
        workflow_dispatch:

        jobs:
          update-stats:
              runs-on: ubuntu-latest
                  permissions:
                        contents: write

                            steps:
                                  - name: Checkout repository
                                          uses: actions/checkout@v4
                                                  with:
                                                            ref: main

                                                                  - name: Fetch YouTube stats
                                                                          id: youtube
                                                                                  env:
                                                                                            YT_KEY: ${{ secrets.YOUTUBE_API_KEY }}
                                                                                                      YT_CHANNEL: ${{ secrets.YOUTUBE_CHANNEL_ID }}
                                                                                                              run: |
                                                                                                                        R=$(curl -s "https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${YT_CHANNEL}&key=${YT_KEY}")
                                                                                                                                  SUBS=$(echo "$R" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['items'][0]['statistics']['subscriberCount'])")
                                                                                                                                            VIEWS=$(echo "$R" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['items'][0]['statistics']['viewCount'])")
                                                                                                                                                      echo "subs=$SUBS" >> $GITHUB_OUTPUT
                                                                                                                                                                echo "views=$VIEWS" >> $GITHUB_OUTPUT
                                                                                                                                                                          DATE28=$(date -d '28 days ago' -u +%Y-%m-%dT%H:%M:%SZ)
                                                                                                                                                                                    VR=$(curl -s "https://www.googleapis.com/youtube/v3/search?part=id&channelId=${YT_CHANNEL}&type=video&publishedAfter=${DATE28}&maxResults=50&key=${YT_KEY}")
                                                                                                                                                                                              VIDS=$(echo "$VR" | python3 -c "import sys,json;d=json.load(sys.stdin);ids=[i['id']['videoId'] for i in d.get('items',[])];print(','.join(ids))")
                                                                                                                                                                                                        if [ -n "$VIDS" ]; then
                                                                                                                                                                                                                    SR=$(curl -s "https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${VIDS}&key=${YT_KEY}")
                                                                                                                                                                                                                                V28=$(echo "$SR" | python3 -c "import sys,json;d=json.load(sys.stdin);print(sum(int(i['statistics'].get('viewCount',0)) for i in d.get('items',[])))")
                                                                                                                                                                                                                                          else
                                                                                                                                                                                                                                                      V28=0
                                                                                                                                                                                                                                                                fi
                                                                                                                                                                                                                                                                          echo "views28=$V28" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                - name: Fetch Facebook stats
                                                                                                                                                                                                                                                                                        id: facebook
                                                                                                                                                                                                                                                                                                env:
                                                                                                                                                                                                                                                                                                          FB_PAGE: ${{ secrets.FACEBOOK_PAGE_ID }}
                                                                                                                                                                                                                                                                                                                    FB_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
                                                                                                                                                                                                                                                                                                                            run: |
                                                                                                                                                                                                                                                                                                                                      R=$(curl -s "https://graph.facebook.com/v19.0/${FB_PAGE}?fields=followers_count,fan_count&access_token=${FB_TOKEN}")
                                                                                                                                                                                                                                                                                                                                                FOL=$(echo "$R" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('followers_count',d.get('fan_count',0)))")
                                                                                                                                                                                                                                                                                                                                                          echo "followers=$FOL" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                                                                                                                                                                    SINCE=$(date -d '28 days ago' +%s)
                                                                                                                                                                                                                                                                                                                                                                              PR=$(curl -s "https://graph.facebook.com/v19.0/${FB_PAGE}/posts?fields=insights.metric(post_impressions_unique)&since=${SINCE}&access_token=${FB_TOKEN}")
                                                                                                                                                                                                                                                                                                                                                                                        INT=$(echo "$PR" | python3 -c "
                                                                                                                                                                                                                                                                                                                                                                                                  import sys,json
                                                                                                                                                                                                                                                                                                                                                                                                            d=json.load(sys.stdin)
                                                                                                                                                                                                                                                                                                                                                                                                                      total=0
                                                                                                                                                                                                                                                                                                                                                                                                                                for post in d.get('data',[]):
                                                                                                                                                                                                                                                                                                                                                                                                                                            for ins in post.get('insights',{}).get('data',[]):
                                                                                                                                                                                                                                                                                                                                                                                                                                                          if ins.get('name')=='post_impressions_unique':
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          total+=ins.get('values',[{}])[-1].get('value',0)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    print(total)")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              echo "interactions=$INT" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - name: Update JSON and commit
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      NEW_SUBS: ${{ steps.youtube.outputs.subs }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                NEW_VIEWS: ${{ steps.youtube.outputs.views }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          NEW_VIEWS28: ${{ steps.youtube.outputs.views28 }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    NEW_FOL: ${{ steps.facebook.outputs.followers }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              NEW_INT: ${{ steps.facebook.outputs.interactions }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                python3 - <<'PYEOF'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          import json, os, datetime
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    now = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              with open('data/social-stats.json') as f:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            d = json.load(f)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      prev_subs = d['youtube']['subscribers_current']
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                prev_fol = d['facebook']['followers_current']
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          new_subs = int(os.environ['NEW_SUBS'])
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    new_fol = int(os.environ['NEW_FOL'])
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              delta_s = max(0, new_subs - prev_subs)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        delta_f = max(0, new_fol - prev_fol)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  g_s = round((new_subs-prev_subs)/prev_subs*100,1) if prev_subs>0 else 0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            g_f = round((new_fol-prev_fol)/prev_fol*100,1) if prev_fol>0 else 0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      d['youtube'].update({'subscribers_current':new_subs,'subscribers_new_28d':delta_s,'subscribers_growth_pct':g_s,'views_total':int(os.environ['NEW_VIEWS']),'views_28d':int(os.environ['NEW_VIEWS28']),'updated_at':now})
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                d['facebook'].update({'followers_current':new_fol,'followers_new_28d':delta_f,'followers_growth_pct':g_f,'interactions_total_28d':int(os.environ['NEW_INT']),'updated_at':now})
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          d['last_updated'] = now
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    with open('data/social-stats.json','w') as f:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  json.dump(d,f,indent=2,ensure_ascii=False)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            print(f"YT={new_subs}, FB={new_fol}")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      PYEOF
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                git config user.name "github-actions[bot]"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          git config user.email "github-actions[bot]@users.noreply.github.com"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    git add data/social-stats.json
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              git diff --staged --quiet || git commit -m "Auto-update social stats $(date -u +%Y-%m-%d)" && git push origin main
