<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Promesses Bibliques</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a237e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 400px; margin: 0 auto; padding: 20px; }

        h1 {
            text-align: center;
            font-size: 1.7rem;
            color: #f5c842;
            margin-bottom: 20px;
        }
        .back-link {
            display: block;
            text-align: center;
            color: #f5c842;
            text-decoration: none;
            padding: 10px 25px;
            border: 2px solid #f5c842;
            border-radius: 25px;
            width: fit-content;
            margin: 0 auto 20px;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: #f5c842;
            color: #1a237e;
        }
        .subtitle {
            text-align: center;
            font-style: italic;
            color: #b0b0b0;
            margin-bottom: 40px;
            font-size: 1.2rem;
        }

        .promesses-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 13px;
            max-width: 495px;
            margin: 0 auto;
        }
        .promesse-card {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(30, 58, 95, 0.8);
            border-radius: 11px;
            text-decoration: none;
            padding: 13px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .promesse-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(245, 200, 66, 0.3);
        }
        .promesse-icon {
            font-size: 2.2rem;
            margin-bottom: 9px;
        }
        .promesse-title {
            color: white;
            font-size: 0.85rem;
            text-align: center;
            font-weight: normal;
            line-height: 1.2;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <!-- Langue lue depuis localStorage (définie sur page accueil) -->
    <script src="lang-shared.js"></script>

    <div class="container">
        <a href="lecteur.html" class="back-link" id="backLink">Retour accueil</a>
        <h1 id="pageTitle">10 Promesses Bibliques</h1>
        <p class="subtitle" id="subtitle">Les promesses de Dieu pour votre vie</p>

        <div class="promesses-grid" id="promessesGrid"></div>
    </div>

    <script>

                ["Repos en Dieu", "Matthieu 11:28"],
                ["Espoir eternel", "Romains 15:13"],
                ["Dieu te protege", "Psaume 91:11"],

                ["Guerison divine", "Exode 15:26"],
                ["Dieu te guide", "Psaume 32:8"]
            ]
        },

                ["Divine healing", "Exodus 15:26"],
                ["God guides you", "Psalm 32:8"]
            ]
        },
        PT: {
            title: "10 Promessas Biblicas",
            back: "Voltar ao inicio",
            subtitle: "As promessas de Deus para sua vida",
            word: "Promessa",
            listenBtn: "Ouvir",
            items: [
                ["Paz interior", "Filipenses 4:7"],
                ["Forca na provacao", "Isaias 41:10"],
                ["Confianca em Deus", "Proverbios 3:5-6"],
                ["O amor de Deus", "Joao 3:16"],
                ["Descanso em Deus", "Mateus 11:28"],
                ["Esperanca eterna", "Romanos 15:13"],
                ["Deus te protege", "Salmo 91:11"],
                ["Deus prove", "Filipenses 4:19"],
                ["Cura divina", "Exodo 15:26"],
                ["Deus te guia", "Salmo 32:8"]
            ]
        },
        ES: {
            title: "10 Promesas Biblicas",
            back: "Volver al inicio",
            subtitle: "Las promesas de Dios para tu vida",
            word: "Promesa",
            listenBtn: "Escuchar",
            items: [
                ["Paz interior", "Filipenses 4:7"],
                ["Fuerza en la prueba", "Isaias 41:10"],
                ["Confianza en Dios", "Proverbios 3:5-6"],
                ["El amor de Dios", "Juan 3:16"],
                ["Descanso en Dios", "Mateo 11:28"],
                ["Esperanza eterna", "Romanos 15:13"],
                ["Dios te protege", "Salmo 91:11"],
                ["Dios provee", "Filipenses 4:19"],
                ["Sanacion divina", "Exodo 15:26"],
                ["Dios te guia", "Salmo 32:8"]
            ]
        },
        DE: {
            title: "10 Biblische Verheissungen",
            back: "Zuruck zur Startseite",
            subtitle: "Gottes Verheissungen fur dein Leben",
            word: "Verheissung",
            listenBtn: "Anhoren",
            items: [
                ["Innerer Frieden", "Philipper 4:7"],
                ["Kraft in Prufungen", "Jesaja 41:10"],
                ["Vertrauen auf Gott", "Spruche 3:5-6"],
                ["Gottes Liebe", "Johannes 3:16"],
                ["Ruhe in Gott", "Matthaus 11:28"],
                ["Ewige Hoffnung", "Romer 15:13"],
                ["Gott schutzt dich", "Psalm 91:11"],
                ["Gott versorgt", "Philipper 4:19"],
                ["Gottliche Heilung", "Exodus 15:26"],
                ["Gott leitet dich", "Psalm 32:8"]
            ]
        },
        IT: {
            title: "10 Promesse Bibliche",
            back: "Torna alla home",
            subtitle: "Le promesse di Dio per la tua vita",
            word: "Promessa",
            listenBtn: "Ascolta",
            items: [
                ["Pace interiore", "Filippesi 4:7"],
                ["Forza nella prova", "Isaia 41:10"],
                ["Fiducia in Dio", "Proverbi 3:5-6"],
                ["L'amore di Dio", "Giovanni 3:16"],
                ["Riposo in Dio", "Matteo 11:28"],
                ["Speranza eterna", "Romani 15:13"],
                ["Dio ti protegge", "Salmo 91:11"],
                ["Dio provvede", "Filippesi 4:19"],
                ["Guarigione divina", "Esodo 15:26"],
                ["Dio ti guida", "Salmo 32:8"]
            ]
        }
    };

    // Bible references for each promise (book number, chapter)
    const BIBLE_REFS = [
        { book: "50", chapter: "4" },   // Philippiens 4:7
        { book: "23", chapter: "41" },  // Esaie 41:10
        { book: "20", chapter: "3" },   // Proverbes 3:5-6
        { book: "43", chapter: "3" },   // Jean 3:16
        { book: "40", chapter: "11" },  // Matthieu 11:28
        { book: "45", chapter: "15" },  // Romains 15:13
        { book: "19", chapter: "91" },  // Psaume 91:11
        { book: "50", chapter: "4" },   // Philippiens 4:19
        { book: "02", chapter: "15" },  // Exode 15:26
        { book: "19", chapter: "32" }   // Psaume 32:8
    ];

    const ICONS = ["😰", "💪", "🙏", "❤️", "🕊️", "🌟", "🛡️", "💰", "🩹", "🎯"];

    // Résoudre la langue (priorité: URL > localStorage > défaut)
    const params = new URLSearchParams(window.location.search);
    let currentLang = params.get('lang') || localStorage.getItem('bc_lang') || 'FR';
    currentLang = currentLang.toUpperCase();

    // Sauvegarder dans localStorage pour cohérence
    localStorage.setItem('bc_lang', currentLang);

    function render(lang) {
        currentLang = lang;
        const d = DATA[lang] || DATA.FR;

        document.getElementById('pageTitle').textContent = d.title;
        document.getElementById('backLink').textContent = d.back;
        document.getElementById('subtitle').textContent = d.subtitle;

        const grid = document.getElementById('promessesGrid');
        grid.innerHTML = '';

        d.items.forEach((item, i) => {
            const card = document.createElement('a');
            card.className = 'promesse-card';
            card.href = `promesse-detail.html?id=${i}&lang=${lang}`;
            card.innerHTML = `
                <div class="promesse-icon">${ICONS[i]}</div>
                <div class="promesse-title">${item[0]}</div>
            `;
            grid.appendChild(card);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Utiliser currentLang déjà résolu (URL > localStorage > défaut)
        render(currentLang);
    });
    </script>

  <script src="/translations.js"></script>
  <script src="/translations-extra.js"></script>
  <script src="/i18n.js"></script>
  <script src="/lang-shared.js"></script>
</body>
</html>
