<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promesses Bibliques - Bible Chantée</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1E3A5F 0%, #162B46 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        .lang-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            margin-bottom: 30px;
            border-radius: 10px;
        }
        .lang-btn {
            padding: 8px 16px;
            background: #243F66;
            color: #F5CB42;
            border: 1px solid #F5CB42;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            font-weight: 500;
        }
        .lang-btn:hover {
            background: #2C4A73;
            transform: translateY(-2px);
        }
        .lang-btn.active {
            background: #F5CB42;
            color: #1E3A5F;
        }
        .lang-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #666;
            color: #666;
        }
        .lang-btn.disabled:hover {
            background: #243F66;
            transform: none;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            color: #F5CB42;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .back-link {
            display: block;
            text-align: center;
            color: #F5CB42;
            text-decoration: none;
            padding: 10px 25px;
            border: 2px solid #F5CB42;
            border-radius: 25px;
            width: fit-content;
            margin: 0 auto 20px;
            transition: all 0.3s;
            font-weight: 500;
        }
        .back-link:hover {
            background: #F5CB42;
            color: #1E3A5F;
            transform: scale(1.05);
        }
        .subtitle {
            text-align: center;
            font-style: italic;
            color: #b0b0b0;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .promesses-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .promesse-card {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(36, 63, 102, 0.8);
            border-radius: 12px;
            text-decoration: none;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .promesse-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(245, 203, 66, 0.4);
            border-color: #F5CB42;
            background: rgba(44, 74, 115, 0.9);
        }
        .promesse-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .promesse-title {
            color: white;
            font-size: 0.95rem;
            text-align: center;
            font-weight: 500;
            line-height: 1.3;
        }

        @media (min-width: 768px) {
            .promesses-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .lang-btn { padding: 6px 12px; font-size: 12px; }
            .promesse-icon { font-size: 2rem; }
            .promesse-title { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <script src="lang-shared.js"></script>

    <div class="container">
        <h1 id="pageTitle">Promesses Bibliques</h1>
        <a href="lecteur.html" class="back-link" id="backLink">← Retour</a>
        <p class="subtitle" id="subtitle">Découvrez les promesses de Dieu pour votre vie</p>

        <div class="lang-bar">
            <button class="lang-btn active" data-lang="FR">🇫🇷 FR</button>
            <button class="lang-btn" data-lang="EN">🇬🇧 EN</button>
            <button class="lang-btn" data-lang="PT">🇵🇹 PT</button>
            <button class="lang-btn" data-lang="ES">🇪🇸 ES</button>
            <button class="lang-btn" data-lang="DE">🇩🇪 DE</button>
            <button class="lang-btn" data-lang="IT">🇮🇹 IT</button>
            <button class="lang-btn disabled" data-lang="AR">🇸🇦 AR</button>
            <button class="lang-btn disabled" data-lang="RU">🇷🇺 RU</button>
            <button class="lang-btn disabled" data-lang="ZH">🇨🇳 ZH</button>
            <button class="lang-btn disabled" data-lang="HI">🇮🇳 HI</button>
            <button class="lang-btn disabled" data-lang="TL">🇵🇭 TL</button>
            <button class="lang-btn disabled" data-lang="SW">🇹🇿 SW</button>
        </div>

        <div class="promesses-grid" id="promessesGrid"></div>
    </div>

    <script>
    const DATA = {
        FR: {
            title: "Promesses Bibliques",
            back: "← Retour",
            subtitle: "Découvrez les promesses de Dieu pour votre vie",
            themes: [
                ["Anxiété", "anxiete"],
                ["Force", "force"],
                ["Foi", "foi"],
                ["Amour", "amour"],
                ["Paix", "paix"],
                ["Espérance", "esperance"],
                ["Protection", "protection"],
                ["Provision", "provision"],
                ["Guérison", "guerison"],
                ["Direction", "direction"]
            ]
        },
        EN: {
            title: "Biblical Promises",
            back: "← Back",
            subtitle: "Discover God's promises for your life",
            themes: [
                ["Anxiety", "anxiety"],
                ["Strength", "strength"],
                ["Faith", "faith"],
                ["Love", "love"],
                ["Peace", "peace"],
                ["Hope", "hope"],
                ["Protection", "protection"],
                ["Provision", "provision"],
                ["Healing", "healing"],
                ["Guidance", "guidance"]
            ]
        },
        PT: {
            title: "Promessas Bíblicas",
            back: "← Voltar",
            subtitle: "Descubra as promessas de Deus para sua vida",
            themes: [
                ["Ansiedade", "ansiedade"],
                ["Força", "forca"],
                ["Fé", "fe"],
                ["Amor", "amor"],
                ["Paz", "paz"],
                ["Esperança", "esperanca"],
                ["Proteção", "protecao"],
                ["Provisão", "provisao"],
                ["Cura", "cura"],
                ["Direção", "direcao"]
            ]
        },
        ES: {
            title: "Promesas Bíblicas",
            back: "← Volver",
            subtitle: "Descubre las promesas de Dios para tu vida",
            themes: [
                ["Ansiedad", "ansiedad"],
                ["Fuerza", "fuerza"],
                ["Fe", "fe"],
                ["Amor", "amor"],
                ["Paz", "paz"],
                ["Esperanza", "esperanza"],
                ["Protección", "proteccion"],
                ["Provisión", "provision"],
                ["Sanación", "sanacion"],
                ["Dirección", "direccion"]
            ]
        },
        DE: {
            title: "Biblische Verheißungen",
            back: "← Zurück",
            subtitle: "Entdecken Sie Gottes Verheißungen für Ihr Leben",
            themes: [
                ["Angst", "angst"],
                ["Kraft", "kraft"],
                ["Glaube", "glaube"],
                ["Liebe", "liebe"],
                ["Frieden", "frieden"],
                ["Hoffnung", "hoffnung"],
                ["Schutz", "schutz"],
                ["Versorgung", "versorgung"],
                ["Heilung", "heilung"],
                ["Führung", "fuehrung"]
            ]
        },
        IT: {
            title: "Promesse Bibliche",
            back: "← Indietro",
            subtitle: "Scopri le promesse di Dio per la tua vita",
            themes: [
                ["Ansia", "ansia"],
                ["Forza", "forza"],
                ["Fede", "fede"],
                ["Amore", "amore"],
                ["Pace", "pace"],
                ["Speranza", "speranza"],
                ["Protezione", "protezione"],
                ["Provvidenza", "provvidenza"],
                ["Guarigione", "guarigione"],
                ["Guida", "guida"]
            ]
        }
    };

    const ICONS = ["😰", "💪", "🙏", "❤️", "🕊️", "🌟", "🛡️", "💰", "🩹", "🎯"];

    // Résoudre la langue (priorité: URL > localStorage > défaut)
    const params = new URLSearchParams(window.location.search);
    let currentLang = params.get('lang') || localStorage.getItem('bc_lang') || 'FR';
    currentLang = currentLang.toUpperCase();

    // Sauvegarder dans localStorage pour cohérence
    localStorage.setItem('bc_lang', currentLang);

    function render(lang) {
        currentLang = lang;
        const d = DATA[lang] || DATA.FR;

        document.getElementById('pageTitle').textContent = d.title;
        document.getElementById('backLink').textContent = d.back;
        document.getElementById('backLink').href = `lecteur.html?lang=${lang}`;
        document.getElementById('subtitle').textContent = d.subtitle;

        const grid = document.getElementById('promessesGrid');
        grid.innerHTML = '';

        d.themes.forEach((theme, i) => {
            const card = document.createElement('a');
            card.className = 'promesse-card';
            card.href = `promesses-tema.html?tema=${theme[1]}&lang=${lang}`;
            card.innerHTML = `
                <div class="promesse-icon">${ICONS[i]}</div>
                <div class="promesse-title">${theme[0]}</div>
            `;
            grid.appendChild(card);
        });

        // Mettre à jour les boutons de langue
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.lang === lang) {
                btn.classList.add('active');
            }
        });
    }

    // Gestion des clics sur les drapeaux
    document.querySelectorAll('.lang-btn:not(.disabled)').forEach(btn => {
        btn.addEventListener('click', () => {
            const lang = btn.dataset.lang;
            localStorage.setItem('bc_lang', lang);
            render(lang);
        });
    });

    document.addEventListener('DOMContentLoaded', function() {
        // Utiliser currentLang déjà résolu (URL > localStorage > défaut)
        render(currentLang);
    });
    </script>

  <script src="/translations.js"></script>
  <script src="/translations-extra.js"></script>
  <script src="/i18n.js"></script>
</body>
</html>
