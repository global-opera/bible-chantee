<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Promesses Bibliques</title>
  <script src="analytics-tracking.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a237e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 400px; margin: 0 auto; padding: 20px; }

        h1 {
            text-align: center;
            font-size: 1.7rem;
            color: #f5c842;
            margin-bottom: 20px;
        }
        .back-link {
            display: block;
            text-align: center;
            color: #f5c842;
            text-decoration: none;
            padding: 10px 25px;
            border: 2px solid #f5c842;
            border-radius: 25px;
            width: fit-content;
            margin: 0 auto 20px;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: #f5c842;
            color: #1a237e;
        }
        .subtitle {
            text-align: center;
            font-style: italic;
            color: #b0b0b0;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        /* Favorites filter button */
        .filter-container { text-align: center; margin-bottom: 20px; }
        .filter-btn {
            padding: 8px 20px;
            border: 2px solid rgba(245, 200, 66, 0.5);
            background: rgba(30, 58, 95, 0.6);
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .filter-btn:hover {
            border-color: #f5c842;
            background: rgba(30, 58, 95, 0.8);
        }
        .filter-btn.active {
            background: #f5c842;
            color: #1a237e;
            border-color: #f5c842;
            font-weight: bold;
        }

        /* Favorite star */
        .favorite-star {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s;
            user-select: none;
        }
        .favorite-star:hover { transform: scale(1.2); }
        .favorite-star.favorited { color: #f5c842; }
        .favorite-star:not(.favorited) { color: rgba(255, 255, 255, 0.3); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #b0b0b0;
            font-style: italic;
        }

        .promesses-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 13px;
            max-width: 495px;
            margin: 0 auto;
        }
        .promesse-card {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(30, 58, 95, 0.8);
            border-radius: 11px;
            text-decoration: none;
            padding: 13px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        .promesse-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(245, 200, 66, 0.3);
        }
        .promesse-icon {
            font-size: 2.2rem;
            margin-bottom: 9px;
        }
        .promesse-title {
            color: white;
            font-size: 0.85rem;
            text-align: center;
            font-weight: normal;
            line-height: 1.2;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <!-- Langue lue depuis localStorage (définie sur page accueil) -->
    <script src="lang-shared.js"></script>

        <div class="filter-container">
            <button class="filter-btn" id="filterBtn" onclick="toggleFilter()">
                <span id="filterText">★ Favoris</span>
            </button>
        </div>

        <div class="promesses-grid" id="promessesGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;"></div>
    </div>

    <script>

            items: [
                ["Innerer Frieden", "Philipper 4:7"],

        IT: {

            word: "Promessa",
            listenBtn: "Ascolta",

            noFavorites: "Nessun preferito. Clicca su ★ per aggiungere.",
            items: [
                ["Pace interiore", "Filippesi 4:7"],

                ["L'amore di Dio", "Giovanni 3:16"],
                ["Riposo in Dio", "Matteo 11:28"],

        },
        TL: {
            title: "10 Mga Pangako ng Bibliya",
            back: "Bumalik sa Simula",
            subtitle: "Ang mga pangako ng Diyos para sa iyong buhay",
            word: "Pangako",
            listenBtn: "Makinig",
            favorites: "★ Mga Paborito",
            showAll: "Ipakita lahat",
            noFavorites: "Walang paborito. I-click ang ★ para magdagdag.",
            items: [
                ["Kapayapaan sa loob", "Filipos 4:7"],
                ["Lakas sa pagsubok", "Isaias 41:10"],
                ["Pagtitiwala sa Diyos", "Kawikaan 3:5-6"],
                ["Pag-ibig ng Diyos", "Juan 3:16"],
                ["Pahinga sa Diyos", "Mateo 11:28"],
                ["Walang hanggang pag-asa", "Roma 15:13"],
                ["Protektado ka ng Diyos", "Awit 91:11"],
                ["Nagbibigay ang Diyos", "Filipos 4:19"],
                ["Banal na pagpapagaling", "Exodo 15:26"],
                ["Ginagabayan ka ng Diyos", "Awit 32:8"]

    };

    // Bible references for each promise (book number, chapter)
    const BIBLE_REFS = [
        { book: "50", chapter: "4" },   // Philippiens 4:7
        { book: "23", chapter: "41" },  // Esaie 41:10
        { book: "20", chapter: "3" },   // Proverbes 3:5-6
        { book: "43", chapter: "3" },   // Jean 3:16
        { book: "40", chapter: "11" },  // Matthieu 11:28
        { book: "45", chapter: "15" },  // Romains 15:13
        { book: "19", chapter: "91" },  // Psaume 91:11
        { book: "50", chapter: "4" },   // Philippiens 4:19
        { book: "02", chapter: "15" },  // Exode 15:26
        { book: "19", chapter: "32" }   // Psaume 32:8
    ];

    const ICONS = ["😰", "💪", "🙏", "❤️", "🕊️", "🌟", "🛡️", "💰", "🩹", "🎯"];

    // Détection automatique de la langue
    const getDefaultLang = () => {
        const browserLang = (navigator.language || navigator.userLanguage || 'en').substring(0, 2).toUpperCase();
        const supported = ['FR', 'EN', 'PT', 'ES', 'DE', 'IT', 'TL'];
        return supported.includes(browserLang) ? browserLang : 'EN';
    };

    // Résoudre la langue (priorité: URL > localStorage > navigateur)
    const params = new URLSearchParams(window.location.search);
    let currentLang = params.get('lang') || localStorage.getItem('bc_lang') || getDefaultLang();
    currentLang = currentLang.toUpperCase();

    // Sauvegarder dans localStorage pour cohérence
    localStorage.setItem('bc_lang', currentLang);

    // Favorites management
    let showOnlyFavorites = false;

    function getFavorites() {
        try {
            const stored = localStorage.getItem("bc_favorites_promesses");
            return stored ? JSON.parse(stored) : [];
        } catch (e) {
            return [];
        }
    }

    function saveFavorites(favorites) {
        try {
            localStorage.setItem("bc_favorites_promesses", JSON.stringify(favorites));
        } catch (e) {
            console.error("Failed to save favorites:", e);
        }
    }

    function getFavoriteKey(lang, theme) {
        return "promesse_" + lang + "_" + theme;
    }

    function isFavorite(lang, theme) {
        const favorites = getFavorites();
        return favorites.includes(getFavoriteKey(lang, theme));
    }

    function toggleFavorite(lang, theme, event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        let favorites = getFavorites();
        const key = getFavoriteKey(lang, theme);

        if (favorites.includes(key)) {
            favorites = favorites.filter(f => f !== key);
        } else {
            favorites.push(key);
        }

        saveFavorites(favorites);
        render(currentLang);
    }

    function toggleFilter() {
        showOnlyFavorites = !showOnlyFavorites;
        const filterBtn = document.getElementById('filterBtn');
        const filterText = document.getElementById('filterText');
        const d = DATA[currentLang] || DATA.FR;

        if (showOnlyFavorites) {
            filterBtn.classList.add('active');
            filterText.textContent = d.showAll;
        } else {
            filterBtn.classList.remove('active');
            filterText.textContent = d.favorites;
        }

        render(currentLang);
    }

    function render(lang) {
        currentLang = lang;
        const d = DATA[lang] || DATA.FR;

        document.getElementById('pageTitle').textContent = d.title;
        document.getElementById('backLink').textContent = d.back;
        document.getElementById('subtitle').textContent = d.subtitle;

        const grid = document.getElementById('promessesGrid');
        const emptyState = document.getElementById('emptyState');
        grid.innerHTML = '';

        // Filter items if showing only favorites
        let itemsToShow = d.items;
        if (showOnlyFavorites) {
            itemsToShow = d.items.filter((item, i) => isFavorite(lang, i));

            if (itemsToShow.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                emptyState.textContent = d.noFavorites;
                return;
            }
        }

        grid.style.display = 'grid';
        emptyState.style.display = 'none';

        d.items.forEach((item, i) => {
            if (showOnlyFavorites && !isFavorite(lang, i)) {
                return;
            }

            const card = document.createElement('a');
            card.className = 'promesse-card';
            card.href = `promesse-detail.html?theme=${i}&lang=${lang}`;

            const star = document.createElement('span');
            star.className = 'favorite-star' + (isFavorite(lang, i) ? ' favorited' : '');
            star.textContent = isFavorite(lang, i) ? '★' : '☆';
            star.onclick = (e) => toggleFavorite(lang, i, e);

            card.innerHTML = `
                <div class="promesse-icon">${ICONS[i]}</div>
                <div class="promesse-title">${item[0]}</div>
            `;
            card.insertBefore(star, card.firstChild);
            grid.appendChild(card);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Utiliser currentLang déjà résolu (URL > localStorage > défaut)
        render(currentLang);
    });
    </script>

  <script src="/translations.js"></script>

</html>
