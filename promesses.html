            padding: 10px 25px;
            border: 2px solid #f5c842;
            border-radius: 25px;
            width: fit-content;
            margin: 0 auto 20px;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: #f5c842;
            color: #1a237e;
        }
        .subtitle {
            text-align: center;
            font-style: italic;
            color: #b0b0b0;
            margin-bottom: 40px;
            font-size: 1.2rem;
        }
        
        .themes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .theme-card {
            background: rgba(30, 58, 95, 0.8);
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            display: block;
        }
        .theme-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(245, 200, 66, 0.3);
        }
        .theme-icon { font-size: 3rem; margin-bottom: 15px; }
        .theme-name { color: #f5c842; font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; }
        .theme-desc { color: #b0b0b0; font-size: 0.95rem; margin-bottom: 15px; }
        .theme-psalms {

                { icon: "😰", name: "불안과 두려움", desc: "내면의 평화를 찾으세요", psalms: [23, 27, 46, 91] },
                { icon: "🕊️", name: "평화와 안식", desc: "하나님의 안식에 들어가세요", psalms: [4, 23, 37, 131] },
                { icon: "🙌", name: "찬양과 감사", desc: "하나님의 선하심을 기뻐하세요", psalms: [100, 103, 145, 150] },
                { icon: "🛡️", name: "보호", desc: "하나님은 당신의 피난처입니다", psalms: [91, 121, 125, 144] },
                { icon: "😢", name: "슬픔과 애도", desc: "시련 중의 위로", psalms: [30, 34, 42, 130] },
                { icon: "💪", name: "힘과 용기", desc: "하나님 안에서 강해지세요", psalms: [18, 27, 46, 144] },
                { icon: "🙏", name: "하나님을 신뢰", desc: "그분께 맡기세요", psalms: [37, 62, 125, 131] },
                { icon: "❤️", name: "하나님의 사랑", desc: "그분의 사랑을 경험하세요", psalms: [103, 145, 147, 148] },
                { icon: "🌟", name: "소망", desc: "미래는 그분의 손에 있습니다", psalms: [27, 42, 62, 130] },
                { icon: "🎵", name: "예배", desc: "만왕의 왕을 경배하세요", psalms: [100, 148, 150] }
            ]
        }
    };

    let currentLang = (window.BC_LANG ? BC_LANG.resolveLang() : 'EN');

    function render(lang) {
        currentLang = lang;
        const d = DATA[lang] || DATA.FR;

        document.title = d.title;
        document.getElementById('pageTitle').textContent = d.title;
        document.getElementById('backLink').textContent = d.back;
        document.getElementById('subtitle').textContent = d.subtitle;
        
        const grid = document.getElementById('themesGrid');
        grid.innerHTML = '';
        
        d.themes.forEach((theme, i) => {
            const card = document.createElement('a');
            card.className = 'theme-card';
            card.href = `promesse-detail.html?theme=${i}&lang=${lang}`;
            
            const psalmsText = theme.psalms.join(', ');
            
            card.innerHTML = `
                <div class="theme-icon">${theme.icon}</div>
                <div class="theme-name">${theme.name}</div>
                <div class="theme-desc">${theme.desc}</div>
                <div class="theme-psalms">${d.psalmWord}: ${psalmsText}</div>
                <div class="theme-cta">${d.listenBtn} &#9658;</div>
            `;
            grid.appendChild(card);
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Utiliser la langue depuis lang-shared.js (lue depuis localStorage)
        const lang = window.currentLanguage || 'EN';
        render(lang);
    });
    </script>

  <script src="/lang-shared.js"></script>
</body>
