<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prieres Chantees - Bible Chantee</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0a1628 0%, #1a237e 100%); min-height: 100vh; color: #fff; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; font-size: 1.7rem; color: #f5c842; margin-bottom: 10px; }
        .subtitle { text-align: center; font-style: italic; color: #b0b0b0; margin-bottom: 20px; font-size: 1rem; }
        .back-link { display: block; text-align: center; color: #f5c842; text-decoration: none; padding: 10px 25px; border: 2px solid #f5c842; border-radius: 25px; width: fit-content; margin: 0 auto 20px; transition: all 0.3s; }
        .back-link:hover { background: #f5c842; color: #1a237e; }

        /* Favorites filter button */
        .filter-container { text-align: center; margin-bottom: 20px; }
        .filter-btn {
            padding: 8px 20px;
            border: 2px solid rgba(245, 200, 66, 0.5);
            background: rgba(30, 58, 95, 0.6);
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .filter-btn:hover {
            border-color: #f5c842;
            background: rgba(30, 58, 95, 0.8);
        }
        .filter-btn.active {
            background: #f5c842;
            color: #1a237e;
            border-color: #f5c842;
            font-weight: bold;
        }

        .prayers-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 13px; }
        .prayer-card {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(30, 58, 95, 0.8);
            border-radius: 11px;
            padding: 13px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        .prayer-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(245, 200, 66, 0.3); }
        .prayer-icon { font-size: 2.2rem; margin-bottom: 9px; }
        .prayer-title { color: white; font-size: 0.85rem; text-align: center; line-height: 1.2; }

        /* Favorite star */
        .favorite-star {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s;
            user-select: none;
        }
        .favorite-star:hover { transform: scale(1.2); }
        .favorite-star.favorited { color: #f5c842; }
        .favorite-star:not(.favorited) { color: rgba(255, 255, 255, 0.3); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #b0b0b0;
            font-style: italic;
        }

        .player-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; }
        .player-overlay.active { display: block; }
        .player-container { max-width: 500px; margin: 20px auto; padding: 20px; }
        .close-btn { display: block; text-align: right; color: #f5c842; font-size: 30px; cursor: pointer; margin-bottom: 10px; user-select: none; }
        .player-title { color: #f5c842; font-size: 1.5rem; text-align: center; margin-bottom: 20px; }
        .player-box { background: rgba(30, 58, 95, 0.9); border-radius: 15px; padding: 20px; }
        audio { width: 100%; margin-bottom: 15px; }
        .lyrics-box { background: #162B46; border-radius: 10px; padding: 15px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; line-height: 1.6; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="lecteur.html" class="back-link" id="backLink">Retour</a>
        <h1 id="pageTitle">Prieres Chantees</h1>
        <p class="subtitle" id="subtitle">Elevez votre coeur vers Dieu</p>

        <div class="filter-container">
            <button class="filter-btn" id="filterBtn" onclick="toggleFilter()">
                <span id="filterText">★ Favoris</span>
            </button>
        </div>

        <div class="prayers-grid" id="prayersGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;"></div>
    </div>

    <div class="player-overlay" id="playerOverlay">
        <div class="player-container">
            <span class="close-btn" id="closePlayer">&times;</span>
            <div style="text-align:center;font-size:50px;">🙏</div>
            <h2 class="player-title" id="playerTitle">Priere</h2>
            <div class="player-box">
                <audio id="audio" controls></audio>
                <div class="lyrics-box" id="lyricsBox">Chargement...</div>
            </div>
        </div>
    </div>

    <script>
    var AUDIO_BASE = "https://pub-2dc4dfed0c5e45338913878f35d4d56a.r2.dev/prayers/";
    var LYRICS_BASE = "lyrics/prayers/";

    // Prayer data with EXACT filenames matching R2 and lyrics folder
    var PRAYERS = {
        FR: [
            { title: "Notre Pere", audio: "FR_Notre Pere.mp3", lyrics: "FR_Notre Pere.md" },
            { title: "D'Abord Je Te Cherche", audio: "FR_DAbord Je Te Cherche.mp3", lyrics: "FR_DAbord Je Te Cherche.md" },
            { title: "Priere de Delivrance", audio: "FR_Priere de delivrance.mp3", lyrics: "FR_Priere de delivrance.md" },
            { title: "Reconnaissance", audio: "FR_Reconnaissance.mp3", lyrics: "FR_Reconnaissance.md" },
            { title: "Tu Es Ma Protection", audio: "FR_Tu Es Ma Protection.mp3", lyrics: "FR_Tu Es Ma Protection.md" }
        ],
        EN: [
            { title: "Our Father", audio: "EN_Our Father.mp3", lyrics: "EN_Our Father.md" },
            { title: "First I Seek You", audio: "EN_First I Seek You.mp3", lyrics: "EN_First I Seek You.md" },
            { title: "Gratitude", audio: "EN_Gratitude.mp3", lyrics: "EN_Gratitude.md" },
            { title: "Prayer of Deliverance", audio: "EN_Prayer of Deliverance.mp3", lyrics: "EN_Prayer of Deliverance.md" },
            { title: "You Are My Protection", audio: "EN_You Are My Protection.mp3", lyrics: "EN_You Are My Protection.md" },
            { title: "You Open Doors", audio: "EN_You Open Doors.mp3", lyrics: "EN_You Open Doors.md" }
        ],
        ES: [
            { title: "Padre Nuestro", audio: "ES_Padre Nuestro.mp3", lyrics: "ES_Padre Nuestro.md" },
            { title: "Primero Te Busco", audio: "ES_Primero Te Busco.mp3", lyrics: "ES_Primero Te Busco.md" },
            { title: "Gratitud", audio: "ES_Gratitud.mp3", lyrics: "ES_Gratitud.md" },
            { title: "Oracion de Liberacion", audio: "ES_Oracion de Liberacion.mp3", lyrics: "ES_Oración de Liberación.md" },
            { title: "Tu Eres Mi Proteccion", audio: "ES_Tu Eres Mi Proteccion.mp3", lyrics: "ES_Tú Eres Mi Protección.md" },
            { title: "Abres Las Puertas", audio: "ES_Abres Las Puertas.mp3", lyrics: "ES_Abres Las Puertas.md" }
        ],
        DE: [
            { title: "Vater Unser", audio: "DE_Vater Unser.mp3", lyrics: "DE_Vater Unser.md" },
            { title: "Zuerst Suche Ich Dich", audio: "DE_Zuerst Suche Ich Dich.mp3", lyrics: "DE_Zuerst Suche Ich Dich.md" },
            { title: "Dankbarkeit", audio: "DE_Dankbarkeit.mp3", lyrics: "DE_Dankbarkeit.md" },
            { title: "Gebet der Befreiung", audio: "DE_Gebet der Befreiung.mp3", lyrics: "DE_Gebet der Befreiung.md" },
            { title: "Du Bist Mein Schutz", audio: "DE_Du Bist Mein Schutz.mp3", lyrics: "DE_Du Bist Mein Schutz.md" },
            { title: "Du Offnest Turen", audio: "DE_Du offnest Turen.mp3", lyrics: "DE_Du Öffnest Türen.md" }
        ],
        IT: [
            { title: "Padre Nostro", audio: "IT_Padre Nostro.mp3", lyrics: "IT_Padre Nostro.md" },
            { title: "Prima Ti Cerco", audio: "IT_Prima Ti Cerco.mp3", lyrics: "IT_Prima Ti Cerco.md" },
            { title: "Gratitudine", audio: "IT_Gratitudine.mp3", lyrics: "IT_Gratitudine.md" },
            { title: "Preghiera di Liberazione", audio: "IT_Preghiera di Liberazione.mp3", lyrics: "IT_Preghiera di Liberazione.md" },
            { title: "Tu Sei La Mia Protezione", audio: "IT_Tu Sei La Mia Protezione.mp3", lyrics: "IT_Tu Sei La Mia Protezione.md" },
            { title: "Apri Le Porte", audio: "IT_Apri Le Porte.mp3", lyrics: "IT_Apri Le Porte.md" }
        ],
        PT: [
            { title: "Pai Nosso", audio: "PT_Pai Nosso.mp3", lyrics: "PT_Pai Nosso.md" },
            { title: "Gratidao", audio: "PT_Gratidao.mp3", lyrics: "PT_Gratidão.md" },
            { title: "Oracao de Libertacao", audio: "PT_Oracao de Libertacao.mp3", lyrics: "PT_Oração de Libertação.md" },
            { title: "Primeiro Eu Te Busco", audio: "PT_Primeiro Eu Te Busco.mp3", lyrics: "PT_Primeiro Eu Te Busco.md" },
            { title: "Tu Es a Minha Protecao", audio: "PT_Tu es a Minha Protecao.mp3", lyrics: "PT_Tu És a Minha Proteção.md" }
        ],
        TL: [
            { title: "Ama Namin", audio: "TL_Ama Namin.mp3", lyrics: "TL_Ama Namin.md" },
            { title: "Pasasalamat", audio: "TL_Pasasalamat.mp3", lyrics: "TL_Pasasalamat.md" },
            { title: "Panalangin ng Paglaya", audio: "TL_Panalangin ng Paglaya.mp3", lyrics: "TL_Panalangin ng Paglaya.md" },
            { title: "Una Kitang Hinahanap", audio: "TL_Una Kitang Hinahanap.mp3", lyrics: "TL_Una Kitang Hinahanap.md" },
            { title: "Binubuksan Mo Ang Pinto", audio: "TL_Binubuksan Mo Ang Pinto.mp3", lyrics: "TL_Binubuksan Mo Ang Pinto.md" },
            { title: "Ikaw ang Aking Proteksiyon", audio: "TL_Ikaw ang Aking Proteksiyon.mp3", lyrics: "TL_Ikaw ang Aking Proteksiyon.md" }
        ]
    };

    var UI = {
        FR: {
            title: "Prieres Chantees",
            subtitle: "Elevez votre coeur vers Dieu",
            back: "Retour",
            loading: "Chargement...",
            unavailable: "Paroles non disponibles",
            favorites: "★ Favoris",
            showAll: "Voir tout",
            noFavorites: "Aucun favori. Cliquez sur ★ pour en ajouter."
        },
        EN: {
            title: "Sung Prayers",
            subtitle: "Lift your heart to God",
            back: "Back",
            loading: "Loading...",
            unavailable: "Lyrics not available",
            favorites: "★ Favorites",
            showAll: "Show all",
            noFavorites: "No favorites. Click ★ to add some."
        },
        ES: {
            title: "Oraciones Cantadas",
            subtitle: "Eleva tu corazon a Dios",
            back: "Volver",
            loading: "Cargando...",
            unavailable: "Letras no disponibles",
            favorites: "★ Favoritos",
            showAll: "Ver todo",
            noFavorites: "Sin favoritos. Haz clic en ★ para agregar."
        },
        DE: {
            title: "Gesungene Gebete",
            subtitle: "Erhebe dein Herz zu Gott",
            back: "Zuruck",
            loading: "Laden...",
            unavailable: "Text nicht verfügbar",
            favorites: "★ Favoriten",
            showAll: "Alle anzeigen",
            noFavorites: "Keine Favoriten. Klicke auf ★ zum Hinzufügen."
        },
        IT: {
            title: "Preghiere Cantate",
            subtitle: "Eleva il tuo cuore a Dio",
            back: "Indietro",
            loading: "Caricamento...",
            unavailable: "Testo non disponibile",
            favorites: "★ Preferiti",
            showAll: "Mostra tutto",
            noFavorites: "Nessun preferito. Clicca su ★ per aggiungere."
        },
        PT: {
            title: "Oracoes Cantadas",
            subtitle: "Eleve seu coracao a Deus",
            back: "Voltar",
            loading: "Carregando...",
            unavailable: "Letras não disponíveis",
            favorites: "★ Favoritos",
            showAll: "Ver tudo",
            noFavorites: "Sem favoritos. Clique em ★ para adicionar."
        },
        TL: {
            title: "Mga Panalangin",
            subtitle: "Itaas ang puso mo sa Diyos",
            back: "Bumalik",
            loading: "Naglo-load...",
            unavailable: "Walang lyrics",
            favorites: "★ Mga Paborito",
            showAll: "Ipakita lahat",
            noFavorites: "Walang paborito. I-click ang ★ para magdagdag."
        }
    };

    var currentLang = new URLSearchParams(location.search).get("lang") || localStorage.getItem("bc_lang") || "FR";
    currentLang = currentLang.toUpperCase();
    if (!PRAYERS[currentLang]) currentLang = "FR";

    var showOnlyFavorites = false;

    // Favorites management
    function getFavorites() {
        try {
            var stored = localStorage.getItem("bc_prayer_favorites");
            return stored ? JSON.parse(stored) : {};
        } catch (e) {
            return {};
        }
    }

    function saveFavorites(favorites) {
        try {
            localStorage.setItem("bc_prayer_favorites", JSON.stringify(favorites));
        } catch (e) {
            console.error("Failed to save favorites:", e);
        }
    }

    function getFavoriteKey(lang, index) {
        return lang + "_" + index;
    }

    function isFavorite(lang, index) {
        var favorites = getFavorites();
        return favorites[getFavoriteKey(lang, index)] === true;
    }

    function toggleFavorite(lang, index, event) {
        if (event) {
            event.stopPropagation();
        }

        var favorites = getFavorites();
        var key = getFavoriteKey(lang, index);

        if (favorites[key]) {
            delete favorites[key];
        } else {
            favorites[key] = true;
        }

        saveFavorites(favorites);
        render();
    }

    function toggleFilter() {
        showOnlyFavorites = !showOnlyFavorites;
        render();
    }

    function render() {
        var ui = UI[currentLang] || UI.FR;
        document.getElementById("pageTitle").textContent = ui.title;
        document.getElementById("subtitle").textContent = ui.subtitle;
        document.getElementById("backLink").textContent = ui.back;

        // Update filter button
        var filterBtn = document.getElementById("filterBtn");
        var filterText = document.getElementById("filterText");
        if (showOnlyFavorites) {
            filterBtn.classList.add("active");
            filterText.textContent = ui.showAll;
        } else {
            filterBtn.classList.remove("active");
            filterText.textContent = ui.favorites;
        }

        var grid = document.getElementById("prayersGrid");
        var emptyState = document.getElementById("emptyState");
        grid.innerHTML = "";

        var list = PRAYERS[currentLang] || [];
        var displayedCount = 0;

        for (var i = 0; i < list.length; i++) {
            var p = list[i];
            var isCurrentFavorite = isFavorite(currentLang, i);

            // Skip if filtering favorites and this isn't one
            if (showOnlyFavorites && !isCurrentFavorite) {
                continue;
            }

            displayedCount++;

            var card = document.createElement("div");
            card.className = "prayer-card";

            // Add favorite star
            var star = document.createElement("span");
            star.className = "favorite-star" + (isCurrentFavorite ? " favorited" : "");
            star.textContent = isCurrentFavorite ? "★" : "☆";
            star.setAttribute("data-index", i);
            star.onclick = function(e) {
                toggleFavorite(currentLang, parseInt(this.getAttribute("data-index")), e);
            };

            card.innerHTML = "<div class=\"prayer-icon\">🙏</div><div class=\"prayer-title\">" + p.title + "</div>";
            card.insertBefore(star, card.firstChild);
            card.setAttribute("data-index", i);
            card.onclick = function(e) {
                // Don't open player if clicking on star
                if (e.target.classList.contains("favorite-star")) return;
                openPlayer(parseInt(this.getAttribute("data-index")));
            };
            grid.appendChild(card);
        }

        // Show empty state if no favorites
        if (showOnlyFavorites && displayedCount === 0) {
            grid.style.display = "none";
            emptyState.style.display = "block";
            emptyState.textContent = ui.noFavorites;
        } else {
            grid.style.display = "grid";
            emptyState.style.display = "none";
        }
    }

    function openPlayer(index) {
        var p = PRAYERS[currentLang][index];
        if (!p) return;

        var ui = UI[currentLang] || UI.FR;

        document.getElementById("playerTitle").textContent = p.title;

        // Load audio URL from window.audioUrlsPrayers{LANG} (same as confessions)
        var langUpper = currentLang.toUpperCase();
        var audioVarName = 'audioUrlsPrayers' + langUpper;
        var audioUrls = window[audioVarName];
        var prayerNum = String(index + 1).padStart(2, '0'); // Convert 0->01, 1->02, etc.
        var audioUrl = audioUrls && audioUrls[prayerNum] ? audioUrls[prayerNum] : null;

        // Fallback to old system if no URL found
        if (!audioUrl) {
            audioUrl = AUDIO_BASE + encodeURIComponent(p.audio);
            console.warn("Using fallback audio URL:", audioUrl);
        } else {
            console.log("Loading audio from audioUrlsPrayers" + langUpper + ":", audioUrl);
        }

        document.getElementById("audio").src = audioUrl;

        // Load lyrics
        var lyricsBox = document.getElementById("lyricsBox");
        lyricsBox.textContent = ui.loading;

        if (!p.lyrics) {
            lyricsBox.textContent = ui.unavailable;
            document.getElementById("playerOverlay").classList.add("active");
            document.getElementById("audio").play().catch(function(err) {
                console.error("Audio play error:", err);
            });
            return;
        }

        var lyricsUrl = LYRICS_BASE + encodeURIComponent(p.lyrics);
        console.log("Loading lyrics:", lyricsUrl);

        fetch(lyricsUrl)
            .then(function(r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.text();
            })
            .then(function(text) {
                // Remove markdown markers and clean up
                text = text.replace(/\[(VERSE|CHORUS|BRIDGE|PRE-CHORUS|INTRO|OUTRO|REFRAIN|COUPLET|PONT)\]/gi, '');
                text = text.replace(/\*\*([^*]+)\*\*/g, '$1');
                lyricsBox.textContent = text;
            })
            .catch(function(err) {
                console.error("Lyrics error:", err);
                lyricsBox.textContent = ui.unavailable;
            });

        document.getElementById("playerOverlay").classList.add("active");

        // Try to play audio
        var audioEl = document.getElementById("audio");
        var playPromise = audioEl.play();
        if (playPromise !== undefined) {
            playPromise.catch(function(err) {
                console.error("Audio play error:", err);
            });
        }
    }

    function closePlayer() {
        document.getElementById("playerOverlay").classList.remove("active");
        document.getElementById("audio").pause();
        document.getElementById("audio").currentTime = 0;
    }

    document.getElementById("closePlayer").onclick = closePlayer;

    // Close on overlay click (but not on player box click)
    document.getElementById("playerOverlay").onclick = function(e) {
        if (e.target === this) closePlayer();
    };

    // Prevent clicks inside player from closing
    document.querySelector(".player-container").onclick = function(e) {
        e.stopPropagation();
    };

    // Handle audio errors
    document.getElementById("audio").addEventListener("error", function(e) {
        console.error("Audio error:", e);
        console.error("Audio src:", this.src);
        console.error("Error details:", this.error);
    });

    render();
    </script>

    <!-- Audio URLs for prayers (like confessions system) -->
    <script src="audio-urls-prayers-fr.js"></script>
</body>
</html>
