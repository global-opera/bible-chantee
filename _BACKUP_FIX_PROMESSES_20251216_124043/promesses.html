<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promesses</title>

  <link rel="stylesheet" href="/site.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #1a237e 100%);
      min-height: 100vh;
      color: #fff;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    h1 {
      text-align: center;
      font-size: 2.5rem;
      color: #f5c842;
      margin-bottom: 30px;
    }
    #cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    #cards > div {
      background: rgba(30, 58, 95, 0.8);
      border-radius: 15px;
      padding: 25px;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    #cards > div:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(245, 200, 66, 0.3);
    }
    #cards h3 {
      color: #f5c842;
      font-size: 1.4rem;
      margin-bottom: 10px;
    }
    #cards p {
      color: #d1d5db;
      font-size: 0.95rem;
      margin-bottom: 15px;
    }
    #cards a {
      display: inline-block;
      padding: 10px 20px;
      background: #f5c842;
      color: #1a237e;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>

  <!-- Scripts : ordre simple et sûr -->
  <script src="/lang-shared.js"></script>
  <script src="/promesses-data.js"></script>
</head>

<body>
  <div class="container">
    <h1>Promesses</h1>
    <div id="cards"></div>
  </div>

<script>
(function () {
  // 1) Langue toujours définie
  const lang =
    window.currentLanguage ||
    (new URLSearchParams(window.location.search).get("lang") || "FR").toUpperCase();

  // 2) Données disponibles ?
  if (!window.PROMESSAS || !PROMESSAS[lang]) {
    document.getElementById("cards").innerHTML =
      "<p style='text-align:center;color:#fca5a5'>Aucune promesse disponible.</p>";
    return;
  }

  // 3) Génération des cartes
  const container = document.getElementById("cards");
  const temas = PROMESSAS[lang];

  Object.keys(temas).forEach(key => {
    const t = temas[key];
    const div = document.createElement("div");
    div.innerHTML = `
      <h3>${t.titulo}</h3>
      <p>${t.sub}</p>
      <a href="promesses-tema.html?tema=${key}&lang=${lang}">Ouvrir</a>
    `;
    container.appendChild(div);
  });

  console.log("Promessas chargées :", lang);
})();
</script>

</body>
</html>
