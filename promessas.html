<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promessas</title>
<link rel="stylesheet" href="/site.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0a1628 0%, #1a237e 100%);
  min-height: 100vh;
  color: #fff;
}
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
h1 {
  text-align: center;
  font-size: 2.5rem;
  color: #f5c842;
  margin-bottom: 30px;
}
#cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}
#cards > div {
  background: rgba(30, 58, 95, 0.8);
  border-radius: 15px;
  padding: 25px;
  transition: transform 0.3s, box-shadow 0.3s;
}
#cards > div:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(245, 200, 66, 0.3);
}
#cards h3 {
  color: #f5c842;
  font-size: 1.4rem;
  margin-bottom: 10px;
}
#cards p {
  color: #b0b0b0;
  font-size: 0.95rem;
  margin-bottom: 15px;
}
#cards a {
  display: inline-block;
  padding: 10px 20px;
  background: #f5c842;
  color: #1a237e;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
  transition: all 0.3s;
}
#cards a:hover {
  background: #ffdd57;
  transform: scale(1.05);
}
</style>
<script src="/lang-shared.js" defer></script>
<script src="/promessas-data.js" defer></script>
<script src="/debug-ui.js" defer></script>
</head>
<body>
<div class="container">
<h1>Promessas</h1>
<div id="cards"></div>
</div>

<script>
// PROTECTION: Attendre que DOM + scripts defer soient chargés
document.addEventListener("DOMContentLoaded", () => {
  const container = document.getElementById("cards");

  // GARDE-FOU 1: Vérifier dépendances
  if (typeof currentLanguage === "undefined") {
    const div = document.createElement("div");
    div.style.cssText = "background:#721c24;color:#f8d7da;padding:15px;border-radius:10px;margin:20px;border:1px solid #f5c6cb";
    div.textContent = "❌ ERREUR: lang-shared.js non chargé (currentLanguage manquant)";
    container.appendChild(div);
    console.error("currentLanguage is undefined");
    return;
  }

  if (typeof PROMESSAS === "undefined") {
    const div = document.createElement("div");
    div.style.cssText = "background:#721c24;color:#f8d7da;padding:15px;border-radius:10px;margin:20px;border:1px solid #f5c6cb";
    div.textContent = "❌ ERREUR: promessas-data.js non chargé (PROMESSAS manquant)";
    container.appendChild(div);
    console.error("PROMESSAS is undefined");
    return;
  }

  const temas = PROMESSAS[currentLanguage];

  // GARDE-FOU 2: Vérifier langue dans données
  if (!temas || Object.keys(temas).length === 0) {
    const div = document.createElement("div");
    div.style.cssText = "background:#856404;color:#fff3cd;padding:15px;border-radius:10px;margin:20px;border:1px solid #ffeaa7";
    div.textContent = `⚠️ Aucune promesse disponible pour ${currentLanguage}`;
    container.appendChild(div);
    console.warn(`No data for language: ${currentLanguage}`);
    return;
  }

  // GÉNÉRATION: Tout OK, créer les cartes
  for (const key in temas) {
    const t = temas[key];
    const div = document.createElement("div");
    div.innerHTML = `<h3>${t.titulo}</h3><p>${t.sub}</p>
    <a href="promessas-tema.html?tema=${key}&lang=${currentLanguage}">Abrir</a>`;
    container.appendChild(div);
  }

  console.log(`✅ ${Object.keys(temas).length} promesses chargées pour ${currentLanguage}`);
});
</script>
</div>
</body>
</html>
