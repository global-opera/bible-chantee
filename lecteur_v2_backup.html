<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bible Chantée V3 — Lecteur</title>
  <link rel="stylesheet" href="./css/style.css" />
<style>
/* BC_CLEAR_CACHE_SITE_ONLY_V1 */
#bcClearCacheWrap{position:fixed;right:14px;bottom:14px;z-index:99999}
#clearCacheBtn{
  padding:8px 14px;border-radius:10px;border:1px solid #f0c36d;
  background:#2c2f5b;color:#fff;cursor:pointer;font-size:14px
}
#clearCacheBtn:hover{opacity:.85}
</style>
<script src="js/clear-cache.js?v=1"></script>
<style>
/* BC_LANG_FLAGS_V1 */
.lang-btn img{width:20px;height:14px;vertical-align:middle;margin-right:4px;border-radius:2px}
</style>
<style>

.bc-lang-wrap{ margin-left:auto; display:flex; flex-direction:column; gap:10px; }
.bc-lang-row{ display:flex; gap:10px; justify-content:flex-end; align-items:center; flex-wrap:nowrap; }
.bc-lang-row.soon{ opacity:.20; } /* 80% transparent */
.lang-btn{ display:inline-flex; align-items:center; gap:6px; padding:6px 10px; height:32px; }
.lang-btn img{ width:20px; height:14px; vertical-align:middle; border-radius:2px; }
/* /BC_HEADER_V1_CSS */
</style>
<style>
/* BC_HEADER_V1 */
.bc-lang-wrap{margin-left:auto;display:flex;flex-direction:column;gap:8px}
.bc-lang-row{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:nowrap}
.bc-lang-row.soon{opacity:.20} /* 80% transparent */
.lang-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;height:32px}
.lang-btn img{width:20px;height:14px;vertical-align:middle;border-radius:2px}
/* /BC_HEADER_V1 */
</style>
</head>
<body>
  <div class="container">
    <div class="topbar card">
      <div>
        <div class="h1"><a href="./index.html" style="color:#d4a843;text-decoration:none;font-size:14px;">← Accueil</a> <span data-i18n="navPlayer">Lecteur</span></div>
        <div class="sub" id="currentRef">—</div>
      </div>

      <div class="langbar" id="langBar">
        <button class="lang-btn" data-lang="FR"><img src="https://flagcdn.com/w20/fr.png" alt="FR">FR</button>
        <button class="lang-btn" data-lang="EN"><img src="https://flagcdn.com/w20/gb.png" alt="EN">EN</button>
        <button class="lang-btn" data-lang="PT"><img src="https://flagcdn.com/w20/br.png" alt="PT">PT</button>
        <button class="lang-btn" data-lang="ES"><img src="https://flagcdn.com/w20/es.png" alt="ES">ES</button>
        <button class="lang-btn" data-lang="DE"><img src="https://flagcdn.com/w20/de.png" alt="DE">DE</button>
        <button class="lang-btn" data-lang="IT"><img src="https://flagcdn.com/w20/it.png" alt="IT">IT</button>
        <button class="lang-btn" data-lang="AR"><img src="https://flagcdn.com/w20/sa.png" alt="AR">AR</button>
        <button class="lang-btn" data-lang="RU"><img src="https://flagcdn.com/w20/ru.png" alt="RU">RU</button>
        <button class="lang-btn" data-lang="ZH"><img src="https://flagcdn.com/w20/cn.png" alt="ZH">ZH</button>
        <button class="lang-btn" data-lang="HI"><img src="https://flagcdn.com/w20/in.png" alt="HI">HI</button>
        <button class="lang-btn" data-lang="TL"><img src="https://flagcdn.com/w20/ph.png" alt="TL">TL</button>
        <button class="lang-btn" data-lang="SW"><img src="https://flagcdn.com/w20/ke.png" alt="SW">SW</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="h2" id="chapterLabel" data-i18n="readerChapter">Chapitre</div>

        <select id="bookSelect" class="select"></select>
        <div id="chapterGrid" class="chapters"></div>

        <div class="small" id="audioStatus"></div>
        <audio id="audioPlayer" controls preload="none" style="width:100%; margin-top:10px;"></audio>

        <!-- Bouton autoplay -->
        <button id="autoplayBtn" onclick="toggleAutoplay()" style="margin-top:10px; padding:8px 16px; border:2px solid #f0c36d; border-radius:8px; background:#2c2f5b; color:#fff; cursor:pointer; font-size:14px; transition:all 0.3s;">
          🔁 <span data-i18n="autoplayOff">Lecture continue</span>
        </button>
      </div>

      <div class="card">
        <div class="h2" data-i18n="readerLyrics">Paroles</div>
        <pre id="lyricsBox" class="pre"></pre>

        <div style="height:14px"></div>

        <div class="h2" data-i18n="readerBible">Bible</div>
        <pre id="bibleBox" class="pre">—</pre>
      </div>
    </div>

    <div class="footer">V3 standalone</div>
  </div>

  <!-- Core data -->
  <script src="./js/config.js"></script>
  <script src="./js/books.js"></script>
<script src="./js/translations.js"></script>
  <script src="./js/i18n.js"></script>

  <!-- Optional audio maps (if you generated them) -->
  <script src="./js/audio-urls-fr.js"></script>
  <script src="./js/audio-urls-en.js"></script>
  <script src="./js/audio-urls-pt.js"></script>
  <script src="./js/audio-urls-es.js"></script>
  <script src="./js/audio-urls-de.js"></script>
  <script src="./js/audio-urls-it.js"></script>

  <!-- Player -->
  <script src="./js/book-names.js"></script>
<script src="./js/player.js"></script>



<div id="bcClearCacheWrap" style="position:fixed;right:14px;bottom:14px;z-index:99999">
  <button id="clearCacheBtn" onclick="bcClearCache()"
    style="padding:8px 14px;border-radius:10px;border:1px solid #f0c36d;background:#2c2f5b;color:#fff;cursor:pointer;font-size:14px">
    🧹 Vider le cache
  </button>
</div>

<script src="js/header-v1.js?v=1"></script>

<script>
// Autoplay toggle function
function toggleAutoplay() {
  if (typeof window.BC_PLAYER !== 'undefined' && window.BC_PLAYER.toggleAutoplay) {
    var enabled = window.BC_PLAYER.toggleAutoplay();
    var btn = document.getElementById('autoplayBtn');
    if (btn) {
      if (enabled) {
        btn.style.background = '#f0c36d';
        btn.style.color = '#2c2f5b';
        btn.style.borderColor = '#f0c36d';
        btn.querySelector('span').textContent = btn.querySelector('span').getAttribute('data-i18n') === 'autoplayOff' ? 'Lecture continue ON' : 'Continuous play ON';
      } else {
        btn.style.background = '#2c2f5b';
        btn.style.color = '#fff';
        btn.style.borderColor = '#f0c36d';
        btn.querySelector('span').textContent = btn.querySelector('span').getAttribute('data-i18n') === 'autoplayOff' ? 'Lecture continue' : 'Continuous play';
      }
    }
  }
}

// Initialize button state on load
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    var btn = document.getElementById('autoplayBtn');
    if (btn && typeof window.BC_PLAYER !== 'undefined') {
      var enabled = window.BC_PLAYER.getAutoplayStatus();
      if (enabled) {
        btn.style.background = '#f0c36d';
        btn.style.color = '#2c2f5b';
      }
    }
  }, 500);
});
</script>
</body>
</html>
