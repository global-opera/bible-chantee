    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Merriweather', Georgia, serif;
            background: #000080;
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 2.5em; margin-bottom: 10px; color: #ffce00; }
        .subtitle { color: #aaa; font-size: 1.1em; }
        .stats {
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border-radius: 10px;
            margin: 20px auto;
            display: inline-block;
        }
        .search-container {
            margin: 25px auto;
            display: flex;
            gap: 10px;
            max-width: 600px;
            justify-content: center;
        }
        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #ffce00;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1em;
            outline: none;
        }
        .search-input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .search-input:focus {
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 15px rgba(255, 206, 0, 0.3);
        }
        .search-btn {
            background: #ffce00;
            border: none;
            color: #000080;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }
        .search-btn:hover {
            background: #f0c040;
            transform: scale(1.05);
        }
        .search-results {
            margin: 20px auto;
            max-width: 800px;
            max-height: 400px;
            overflow-y: auto;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            display: none;
        }
        .search-results.active {
            display: block;
        }
        .search-result-item {
            background: rgba(255,255,255,0.1);
            border-left: 3px solid #ffce00;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .search-result-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(5px);
        }
        .result-reference {
            color: #ffce00;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .result-text {
            color: #e0e0e0;
            line-height: 1.6;
        }
        .result-highlight {
            background: #ffce00;
            color: #000080;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
        }
        .search-stats {
            color: #ffce00;
            text-align: center;
            padding: 10px;
            font-size: 0.95em;
        }
        .section-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.3em;
            color: #ffce00;
            margin: 30px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }
        .book {
            background: rgba(212, 175, 55, 0.2);
            border: 2px solid rgba(212, 175, 55, 0.5);
            border-radius: 8px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .book:hover { 
            background: rgba(212, 175, 55, 0.4); 
            border-color: #ffce00;
            transform: translateY(-2px); 
        }
        .book.unavailable {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0.3;
            cursor: not-allowed;
        }
        .book.unavailable:hover { 
            transform: none; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .book.playing { 
            background: rgba(212, 175, 55, 0.6); 
            border-color: #ffce00;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .back-link { display: inline-block; margin-bottom: 15px; color: #ffce00; text-decoration: none; padding: 8px 20px; border: 2px solid #ffce00; border-radius: 20px; transition: all 0.3s; }
        .back-link:hover { background: #ffce00; color: #000080; }
        .book-num { font-size: 0.75em; color: #ddd; margin-bottom: 5px; }
        .book-name { font-size: 0.95em; font-weight: 500; }
        .player-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffce00;
            padding: 25px 20px;
            display: none;
            border-top: 5px solid #000080;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            min-height: 200px;
        }
        .player-container.active {
            display: block;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .player-info { text-align: center; margin-bottom: 10px; }
        .player-title { font-family: 'Playfair Display', Georgia, serif; font-size: 1.2em; color: #000080; }
        .player-controls { display: flex; align-items: center; gap: 15px; justify-content: center; flex-wrap: wrap; }
        audio { width: 100%; max-width: 500px; }
        .nav-btn {
            background: #000080;
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .nav-btn:hover { background: #2563eb; }
        .nav-btn:disabled { background: #444; cursor: not-allowed; }
        .play-book-btn {
            background: #ffce00;
            border: 2px solid #000080;
            color: #000080;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .play-book-btn:hover {
            background: #f0c040;
            transform: scale(1.05);
        }
        .play-book-btn.playing {
            background: #dc2626;
            color: #fff;
            border-color: #dc2626;
        }
        .book-progress {
            color: #000080;
            font-size: 0.9em;
            font-weight: 600;
            padding: 5px 15px;
            background: rgba(255,255,255,0.3);
            border-radius: 15px;
        }
        .chapter-select { padding: 8px; border-radius: 5px; background: #333; color: #fff; border: 1px solid #555; }
        .version-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 15px;
            padding: 5px 12px;
            background: rgba(255,206,0,0.15);
            border-radius: 20px;
        }
        .toggle-label { color: #aaa; font-size: 0.85em; font-weight: 600; }
        .toggle-label.toggle-v2 { color: #aaa; }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #555;
            transition: 0.3s;
            border-radius: 24px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        .toggle-switch input:checked + .toggle-slider { background: #667eea; }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(20px); }
        
        /* Boutons Paroles et Bible */
        .lyrics-btn, .bible-btn {
            background: #000080;
            border: 2px solid #ffce00;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }
        .lyrics-btn:hover, .bible-btn:hover {
            background: #2563eb;
            border-color: #f0c040;
        }
        .lyrics-btn.active, .bible-btn.active {
            background: #ffce00;
            color: #000080;
        }
        .lyrics-btn svg, .bible-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Wrapper flex pour Paroles et Bible côte à côte */
        .content-wrapper {
            display: none;
            gap: 15px;
            margin: 15px 10px 10px 10px;
            max-height: 350px;
        }
        .content-wrapper.active {
            display: flex;
        }

        /* Zone des paroles */
        .lyrics-container {
            display: none;
            flex: 1;
            min-height: 60vh;
            max-height: 70vh;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 20px;
            overflow-y: auto;
        }
        .lyrics-container.active {
            display: block;
        }
        .lyrics-container::-webkit-scrollbar {
            width: 8px;
        }
        .lyrics-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        .lyrics-container::-webkit-scrollbar-thumb {
            background: #ffce00;
            border-radius: 4px;
        }
        .lyrics-text {
            font-size: 0.95em;
            line-height: 1.8;
            white-space: pre-wrap;
            color: #e0e0e0;
        }
        .lyrics-text .section-label {
            color: #ffce00;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        .no-lyrics {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 20px;
        }

        /* Sections de paroles synchronisées */
        .lyrics-section {
            margin-bottom: 25px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid rgba(255, 206, 0, 0.3);
            transition: all 0.5s ease;
        }
        .lyrics-section.active {
            background: rgba(255, 206, 0, 0.15);
            border-left: 5px solid #ffce00;
            box-shadow: 0 0 20px rgba(255, 206, 0, 0.3);
            transform: scale(1.02);
        }
        .lyrics-section .section-title {
            font-weight: bold;
            color: #ffce00;
            margin: 0 0 10px 0;
            font-size: 1em;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 206, 0, 0.2);
        }
        .lyrics-section .lyrics-line {
            margin: 5px 0;
            line-height: 1.8;
            font-size: 0.95em;
            color: #e0e0e0;
        }

        /* Zone du texte biblique */
        .bible-container {
            display: none;
            flex: 1;
            min-height: 60vh;
            max-height: 70vh;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 20px;
            overflow-y: auto;
        }
        .bible-container.active {
            display: block;
        }
        .bible-container::-webkit-scrollbar {
            width: 8px;
        }
        .bible-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        .bible-container::-webkit-scrollbar-thumb {
            background: #ffce00;
            border-radius: 4px;
        }
        .bible-text {
            font-size: 0.95em;
            line-height: 1.8;
            color: #e0e0e0;
        }
        .verse {
            margin-bottom: 10px;
        }
        .verse-number {
            color: #ffce00;
            font-weight: bold;
            margin-right: 5px;
        }
        .no-bible {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: #666;
            font-size: 0.85em;
            margin-bottom: 180px;
        }
        footer a { color: #ffce00; text-decoration: none; }
        
        /* Mobile */
        @media (max-width: 600px) {
            .books-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .book { padding: 10px 5px; }
            .book-name { font-size: 0.85em; }
            h1 { font-size: 1.8em; }
            footer { margin-bottom: 250px; }
            .content-wrapper {
                flex-direction: column;
                max-height: none;
            }
            .lyrics-container, .bible-container {
                max-height: 200px;
            }
            .player-title { font-size: 1.1em; }

        }

        /* === BARRE LANGUES HORIZONTALE === */
        .lang-bar {
            display: flex;
            justify-content: space-between;  /* Répartir uniformément sur toute la largeur */
            width: 100%;
            padding: 10px 20px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lang-btn {
            flex: 1;  /* Boutons occupent espace égal */
            margin: 0 3px;
            padding: 8px 12px;
            background: #1e3a5f;
            color: #f5c842;
            border: 1px solid #f5c842;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
            /* iOS fixes */
            -webkit-tap-highlight-color: rgba(245, 196, 66, 0.2);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .lang-btn:hover {
            background: #2a4a7f;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(245, 196, 66, 0.3);
        }

        .lang-btn:active {
            background: #f5c842;
            color: #1e3a5f;
            transform: scale(0.98);
        }

        .lang-btn.active {
            background: #f5c842;
            color: #1e3a5f;
            border-color: #f5c842;
            font-weight: 700;
        }

        /* Mobile: boutons plus petits */
        @media (max-width: 480px) {
            .lang-btn {
                padding: 6px 8px;
                font-size: 12px;
                min-width: 50px;
            }
        }

        .lang-progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .lang-progress-fill {
            height: 100%;
            background: #ffce00;
            border-radius: 2px;
        }
    </style>
</head>

        function searchBible() {
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');
            const searchTerm = searchInput.value.trim().toLowerCase();
            const t = window.getTranslation || ((key) => null);

            if (!searchTerm || searchTerm.length < 3) {
                alert(t('readerSearchMinChars') || 'Veuillez entrer au moins 3 caractères pour la recherche');
                return;
            }

            if (typeof bibleData === 'undefined') {
                alert(t('readerSearchNoData') || 'Données bibliques non chargées');
                return;
            }

            // Recherche dans toute la Bible
            let results = [];
            let totalMatches = 0;

            for (let bookNum in bibleData) {
                const book = books.find(b => b.num === bookNum);
                if (!book) continue;

                for (let chapter in bibleData[bookNum]) {
                    const verses = bibleData[bookNum][chapter];
                    verses.forEach(verse => {
                        const verseText = verse.text.toLowerCase();
                        if (verseText.includes(searchTerm)) {
                            results.push({
                                bookNum: bookNum,
                                bookName: book.name,
                                chapter: parseInt(chapter),
                                verseNum: verse.num,
                                text: verse.text,
                                available: book.available
                            });
                            totalMatches++;
                        }
                    });
                }
            }

            // Limiter les résultats à 50 pour performance
            results = results.slice(0, 50);

            // Afficher les résultats
            if (results.length === 0) {
                searchResults.innerHTML = '<div class="search-stats">' + (t('readerSearchNoResults') || 'Aucun résultat trouvé pour') + ' "' + searchTerm + '"</div>';
                searchResults.classList.add('active');
                return;
            }

            let html = '<div class="search-stats">' + totalMatches + ' ' + (t('readerSearchFound') || 'verset(s) trouvé(s)') + ' "' + searchTerm + '"';
            if (totalMatches > 50) html += ' (' + (t('readerSearchShowing') || 'affichage des 50 premiers') + ')';
            html += '</div>';

            results.forEach(result => {
                // Highlight du terme recherché
                const regex = new RegExp('(' + searchTerm + ')', 'gi');
                const highlightedText = result.text.replace(regex, '<span class="result-highlight">$1</span>');

                const onclick = result.available
                    ? 'onclick="searchResultClick(\'' + result.bookNum + '\', ' + result.chapter + ')"'
                    : '';

                const availableClass = result.available ? '' : ' style="opacity: 0.5; cursor: not-allowed;"';

                html += '<div class="search-result-item" ' + onclick + availableClass + '>';
                html += '<div class="result-reference">' + result.bookName + ' ' + result.chapter + ':' + result.verseNum;
                if (!result.available) html += ' (' + (t('readerSearchUnavailable') || 'non disponible') + ')';
                html += '</div>';
                html += '<div class="result-text">' + highlightedText + '</div>';
                html += '</div>';
            });

            searchResults.innerHTML = html;
            searchResults.classList.add('active');
        }

        function searchResultClick(bookNum, chapter) {

            // Ouvrir le livre et jouer le chapitre

            // Petit délai pour que le lecteur s'initialise
            setTimeout(() => {

            }, 100);

            // Scroll vers le lecteur
            document.getElementById('player').scrollIntoView({ behavior: 'smooth' });

            // Fermer les résultats de recherche
            document.getElementById('searchResults').classList.remove('active');
        }

        function updateLyrics() {
            const lyricsText = document.getElementById('lyricsText');
            const lyricsContainer = document.getElementById('lyricsContainer');
            const chapterStr = String(currentChapter);

            // Utiliser les timestamps si disponibles
            if (typeof lyricsTimestamps !== 'undefined' && lyricsTimestamps[currentBook] && lyricsTimestamps[currentBook][chapterStr]) {
                const sections = lyricsTimestamps[currentBook][chapterStr];
                lyricsText.innerHTML = '';

                sections.forEach((section, index) => {
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = 'lyrics-section';
                    sectionDiv.id = 'lyrics-section-' + index;
                    sectionDiv.dataset.start = section.start;

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'section-title';
                    titleDiv.textContent = section.type;
                    sectionDiv.appendChild(titleDiv);

                    section.lines.forEach(line => {
                        const lineDiv = document.createElement('div');
                        lineDiv.className = 'lyrics-line';
                        lineDiv.textContent = line;
                        sectionDiv.appendChild(lineDiv);
                    });

                    lyricsText.appendChild(sectionDiv);
                });

                lastActiveSection = -1;
            } else {
                // Choisir paroles selon la langue
                let lyrics = null;
                const langVar = 'chapterLyrics' + currentLanguage;
                if (typeof window[langVar] !== 'undefined' && window[langVar][currentBook] && window[langVar][currentBook][chapterStr]) {
                    lyrics = window[langVar][currentBook][chapterStr];
                } else if (useV2 && typeof chapterLyricsV2 !== 'undefined' && chapterLyricsV2[currentBook] && chapterLyricsV2[currentBook][chapterStr]) {
                    lyrics = chapterLyricsV2[currentBook][chapterStr];
                } else if (typeof chapterLyrics !== 'undefined' && chapterLyrics[currentBook] && chapterLyrics[currentBook][chapterStr]) {
                    lyrics = chapterLyrics[currentBook][chapterStr];
                }
                if (lyrics) {
                    lyrics = lyrics.replace(/\[([^\]]+)\]/g, '<span class="section-label">[$1]</span>');
                    lyricsText.innerHTML = lyrics;
                } else {
                const t = window.getTranslation || ((key) => null);
                lyricsText.innerHTML = '<div class="no-lyrics">' + (t('readerNoLyrics') || 'Paroles non disponibles pour ce chapitre') + '</div>';
            }

            lyricsContainer.scrollTop = 0;

        function playBook(num, chapters) {
            currentBook = num;
            currentChapter = 1;
            totalBookChapters = chapters;

            // Reinitialiser l'autoplay
            if (autoPlayEnabled) {
                autoPlayEnabled = false;
                document.getElementById('playBookBtn').classList.remove('playing');
                document.getElementById('playBookIcon').textContent = '▶';
                document.getElementById('playBookText').textContent = t('readerPlayBook') || 'Lire tout le livre';
                document.getElementById('bookProgress').style.display = 'none';
            }

            document.querySelectorAll('.book').forEach(b => b.classList.remove('playing'));
            document.querySelector('.book[data-num="'+num+'"]').classList.add('playing');
            const select = document.getElementById('chapter-select');
            select.innerHTML = '';
            const chapterWord = window.getTranslation ? getTranslation('readerChapter') : 'Chapitre';
            for (let i = 1; i <= chapters; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = chapterWord + ' ' + i;
                select.appendChild(opt);
            }
            document.getElementById('player').classList.add('active');
            checkV2Available();
            playChapter(1);
        }

        function playChapter(chapter) {
            currentChapter = chapter;

            // DEBUG - Diagnostiquer le probleme audio
            console.log("=== DEBUG AUDIO ===");
            console.log("Book:", currentBook, "Chapter:", chapter, "Type chapter:", typeof chapter);
            console.log("audioUrls keys:", Object.keys(window.audioUrls || {}));
            console.log("Book exists:", !!window.audioUrls[currentBook]);
            if (window.audioUrls[currentBook]) {
                console.log("Chapters available:", Object.keys(window.audioUrls[currentBook]));
            }
            console.log("URL (number):", window.audioUrls[currentBook]?.[chapter]);
            console.log("URL (string):", window.audioUrls[currentBook]?.[String(chapter)]);

            // Choisir la source audio selon la langue et version
            let url;
            // CORRECTION: Convertir chapter en string pour match avec audio-urls.js
            const chapterStr = String(chapter);

            // UNIVERSAL LANGUAGE-AWARE AUDIO SOURCE SELECTION
            // Dynamically select audio source for any language (FR, PT, EN, ES, etc.)
            let audioSource;

            // Try language-specific source: window.audioUrlsFR, window.audioUrlsPT, etc.
            const langAudioVar = `audioUrls${currentLanguage}`;

            if (typeof window[langAudioVar] !== 'undefined') {
                // Language-specific audio URLs exist
                audioSource = window[langAudioVar];
                console.log(`Using ${currentLanguage} audio source (${langAudioVar})`);
            } else if (currentLanguage === 'FR') {
                // French special case: check V2 first
                if (useV2 && typeof audioUrlsV2 !== 'undefined' && audioUrlsV2[currentBook] && audioUrlsV2[currentBook][chapterStr]) {
                    url = audioUrlsV2[currentBook][chapterStr];
                } else {
                    audioSource = window.audioUrls || window.audioUrlsFR;
                }
            } else {
                // Fallback to French if language not available
                console.warn(`Language ${currentLanguage} not available, falling back to French`);
                audioSource = window.audioUrls || window.audioUrlsFR;
            }

            // Get URL from selected source
            if (!url && audioSource) {
                url = audioSource[currentBook] && audioSource[currentBook][chapterStr];
            }

            if (!url) {
                console.error("URL non trouvee pour:", currentBook, chapter);
                return;
            }
            const audio = document.getElementById('audio');
            audio.src = url;
            // audio.play() - user must click
            const book = books.find(b => b.num === currentBook);
            // Construire le titre avec le titre du chapitre
            let displayTitle = book.name + ' - Ch.' + String(chapter).padStart(2, '0');
            // Ajouter le titre du chapitre depuis chapterTitles
            if (chapterTitles && chapterTitles[currentBook] && chapterTitles[currentBook][chapterStr]) {
                displayTitle += ' - ' + chapterTitles[currentBook][chapterStr];
            }
            document.getElementById('player-title').textContent = displayTitle;
            document.getElementById('chapter-select').value = chapter;
            checkV2Available();
            document.getElementById('prev-btn').disabled = chapter <= 1;
            document.getElementById('next-btn').disabled = chapter >= book.chapters;

            // Activer automatiquement les paroles
            if (!lyricsVisible) {
                toggleLyrics();
            }

            // Mettre a jour les paroles et la Bible
            updateLyrics();
            updateBible();

            // Mettre a jour la progression du livre si autoplay actif
            if (autoPlayEnabled) {
                updateBookProgress();
            }
        }

        function togglePlayEntireBook() {

            const playBookBtn = document.getElementById('playBookBtn');

                bookProgress.style.display = 'inline-block';

                setTimeout(() => {
                    document.getElementById('audio').play();
                }, 300);
            } else {
                // Desactiver la lecture continue
                playBookBtn.classList.remove('playing');
                playBookIcon.textContent = '▶';
                playBookText.textContent = t('readerPlayBook') || 'Lire tout le livre';
                bookProgress.style.display = 'none';

                const audio = document.getElementById('audio');
                audio.pause();
            }
        }

        // FONCTION: Mettre a jour l'affichage de la progression
        function updateBookProgress() {
            const bookProgress = document.getElementById('bookProgress');
            bookProgress.textContent = (t('readerChapter') || 'Chapitre') + ' ' + currentChapter + ' / ' + totalBookChapters;
        }

        document.addEventListener('click', e => {
            const book = e.target.closest('.book');
            if (book && book.dataset.available === 'true') {
                playBook(book.dataset.num, parseInt(book.dataset.chapters));
            }
        });
        document.getElementById('chapter-select').addEventListener('change', e => {
            playChapter(parseInt(e.target.value));
        });
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentChapter > 1) playChapter(currentChapter - 1);
        });
        document.getElementById('next-btn').addEventListener('click', () => {
            const book = books.find(b => b.num === currentBook);
            if (currentChapter < book.chapters) playChapter(currentChapter + 1);
        });
        document.getElementById('audio').addEventListener('ended', () => {
            const book = books.find(b => b.num === currentBook);

            // Lecture automatique du prochain chapitre (avec ou sans autoplay)
            if (currentChapter < book.chapters) {
                playChapter(currentChapter + 1);
            } else if (autoPlayEnabled) {
                // Fin du livre atteinte en mode autoplay: arreter
                autoPlayEnabled = false;
                document.getElementById('playBookBtn').classList.remove('playing');
                document.getElementById('playBookIcon').textContent = '▶';
                document.getElementById('playBookText').textContent = t('readerPlayBook') || 'Lire tout le livre';
                document.getElementById('bookProgress').style.display = 'none';
            }
        });

        // AUTO-SCROLL des paroles synchronisées
        document.getElementById('audio').addEventListener('timeupdate', function() {
            const chapterStr = String(currentChapter);
            if (typeof lyricsTimestamps === 'undefined' || !lyricsTimestamps[currentBook] || !lyricsTimestamps[currentBook][chapterStr]) {
                return;
            }

            const sections = lyricsTimestamps[currentBook][chapterStr];
            const currentTime = this.currentTime;
            let activeIndex = 0;

            // Trouver la section active avec buffer de 2 secondes
            for (let i = sections.length - 1; i >= 0; i--) {
                if (currentTime >= sections[i].start + 3.5) {
                    activeIndex = i;
                    break;
                }
            }

            // Mettre à jour seulement si la section a changé
            if (activeIndex !== lastActiveSection) {
                // Retirer le highlight de toutes les sections
                document.querySelectorAll('.lyrics-section').forEach(s => s.classList.remove('active'));

                // Ajouter le highlight à la section active
                const activeSection = document.getElementById('lyrics-section-' + activeIndex);
                if (activeSection) {
                    activeSection.classList.add('active');

                    // Scroll automatique vers la section active (calée en haut)
                    const lyricsContainer = document.getElementById('lyricsContainer');
                    const sectionTop = activeSection.offsetTop;

                    // Caler le bloc actif en haut avec 20px de marge
                    lyricsContainer.scrollTo({
                        top: sectionTop - 20,
                        behavior: 'smooth'
                    });
                }

                lastActiveSection = activeIndex;
            }
        });

        localStorage.setItem('selectedLanguage', lang);

        // Mettre à jour URL
        const url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        history.pushState({}, '', url);

        // Traduire TOUS les éléments avec data-i18n
        if (TRANSLATIONS[lang]) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (TRANSLATIONS[lang][key]) {
                    el.textContent = TRANSLATIONS[lang][key];
                }
            });

            // Traduire les placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (TRANSLATIONS[lang][key]) {
                    el.placeholder = TRANSLATIONS[lang][key];
                }
            });
        }

        // Mettre à jour les noms des livres
        renderBooks('old-testament', oldTestament);
        renderBooks('new-testament', newTestament);

        // Mettre à jour bouton actif
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.lang === lang) {
                btn.classList.add('active');
            }
        });
    }

    // Set initial active language on page load
    changeLanguage(currentLanguage);
    </script>
</body>
</html>
