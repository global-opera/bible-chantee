    <script>
        // === INITIALISATION DE LA LANGUE (doit s'exécuter en premier) ===
        (function () {
            const VALID_LANGUAGES = ['FR', 'EN', 'ES', 'PT', 'DE', 'IT', 'RU', 'AR', 'ZH', 'HI', 'TL', 'KO'];

            function normalizeLang(v) {
                if (!v) return null;
                const x = String(v).trim().toUpperCase();
                return VALID_LANGUAGES.includes(x) ? x : null;
            }

            function getLangFromUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                return normalizeLang(urlParams.get('lang'));
            }

            function getLangFromBC() {
                try {
                    if (window.BC_LANG && typeof BC_LANG.getCurrentLanguage === 'function') {
                        return normalizeLang(BC_LANG.getCurrentLanguage());
                    }
                } catch (e) {}
                return null;
            }

            function setLangToBC(lang) {
                try {
                    if (window.BC_LANG && typeof BC_LANG.setCurrentLanguage === 'function') {
                        BC_LANG.setCurrentLanguage(lang);
                        return;
                    }
                } catch (e) {}
                try { localStorage.setItem('BC_LANG', lang); } catch (e) {}
            }

            // Lire la langue depuis l'URL en priorité
            const urlLang = getLangFromUrl();
            const baseLang = urlLang || getLangFromBC() || 'FR';

            window.currentLanguage = normalizeLang(baseLang) || 'FR';
            setLangToBC(window.currentLanguage);

            // Mettre à jour l'URL si nécessaire
            if (!urlLang || urlLang !== window.currentLanguage) {
                const u = new URL(window.location.href);
                u.searchParams.set('lang', window.currentLanguage);
                window.history.replaceState({}, '', u.toString());
            }

            console.log('[lecteur] Langue initialisée depuis URL:', window.currentLanguage, '(param URL:', urlLang, ')');
        })();
    </script>

        function getLyricsForCurrent(lang, book, chapterStr) {
            const L = (lang || 'FR').toUpperCase();
            if (L === 'PT') {
                if (typeof window.chapterLyricsPT === 'undefined') return null;
                return window.chapterLyricsPT[book] && window.chapterLyricsPT[book][chapterStr] ? window.chapterLyricsPT[book][chapterStr] : null;

                if (typeof window.chapterLyricsEN === 'undefined') return null;
                return window.chapterLyricsEN[book] && window.chapterLyricsEN[book][chapterStr] ? window.chapterLyricsEN[book][chapterStr] : null;

            if (L === 'FR') {

        function searchBible() {
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');
            const searchTerm = searchInput.value.trim().toLowerCase();

            if (!searchTerm || searchTerm.length < 3) {
                alert(t('readerSearchMinChars') || 'Veuillez entrer au moins 3 caractères pour la recherche');
                return;
            }

            const dataset = getBibleDatasetForLang(window.currentLanguage || 'FR');
            if (!dataset) {
                alert(t('readerBibleNotAvailableLang') || 'Recherche Bible non disponible dans cette langue');
                return;
            }

            let results = [];
            let totalMatches = 0;

            for (let bookNum in dataset) {
                const book = books.find(b => b.num === bookNum);
                if (!book) continue;

                for (let chapter in dataset[bookNum]) {
                    const verses = dataset[bookNum][chapter];
                    verses.forEach(verse => {
                        const verseText = String(verse.text || '').toLowerCase();
                        if (verseText.includes(searchTerm)) {
                            results.push({
                                bookNum: bookNum,
                                chapter: parseInt(chapter, 10),
                                verseNum: verse.num,
                                text: verse.text,
                                available: book.available
                            });
                            totalMatches++;
                        }
                    });
                }
            }

            results = results.slice(0, 50);

            if (results.length === 0) {
                searchResults.innerHTML = '<div class="search-stats">' + (t('readerSearchNoResults') || 'Aucun résultat trouvé pour') + ' "' + searchTerm + '"</div>';
                searchResults.classList.add('active');
                return;
            }

            let html = '<div class="search-stats">' + totalMatches + ' ' + (t('readerSearchFound') || 'verset(s) trouvé(s)') + ' "' + searchTerm + '"';
            if (totalMatches > 50) html += ' (' + (t('readerSearchShowing') || 'affichage des 50 premiers') + ')';
            html += '</div>';

            results.forEach(result => {
                const regex = new RegExp('(' + searchTerm + ')', 'gi');
                const highlightedText = String(result.text || '').replace(regex, '<span class="result-highlight">$1</span>');
                const onclick = result.available ? 'onclick="searchResultClick(\'' + result.bookNum + '\', ' + result.chapter + ')"' : '';
                const availableClass = result.available ? '' : ' style="opacity: 0.5; cursor: not-allowed;"';
                const bookName = getBookDisplayName(result.bookNum);

                html += '<div class="search-result-item" ' + onclick + availableClass + '>';
                html += '<div class="result-reference">' + bookName + ' ' + result.chapter + ':' + result.verseNum;
                if (!result.available) html += ' (' + (t('readerSearchUnavailable') || 'non disponible') + ')';
                html += '</div>';
                html += '<div class="result-text">' + highlightedText + '</div>';
                html += '</div>';
            });

            searchResults.innerHTML = html;
            searchResults.classList.add('active');
        }

        function searchResultClick(bookNum, chapter) {
            const book = books.find(b => b.num === bookNum);
            if (!book || !book.available) return;

            playBook(bookNum, book.chapters);
            setTimeout(() => { playChapter(chapter); }, 100);

            document.getElementById('player').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('searchResults').classList.remove('active');
        }

                lyricsBtn.classList.remove('active');
            }

            if (lyricsVisible || bibleVisible) contentWrapper.classList.add('active');
            else contentWrapper.classList.remove('active');
        }

        function toggleBible() {
            bibleVisible = !bibleVisible;
            const bibleContainer = document.getElementById('bibleContainer');
            const bibleBtn = document.getElementById('bibleBtn');
            const contentWrapper = document.getElementById('contentWrapper');

            if (bibleVisible) {
                bibleContainer.classList.add('active');
                bibleBtn.classList.add('active');
            } else {
                bibleContainer.classList.remove('active');
                bibleBtn.classList.remove('active');
            }

            if (lyricsVisible || bibleVisible) contentWrapper.classList.add('active');
            else contentWrapper.classList.remove('active');
        }

        function cleanLyrics(text) {
            if (!text) return '';

            // 1. Supprimer [STYLE] ou [ESTILO] et tout ce qui suit
            text = text.replace(/\[(STYLE|ESTILO)\][\s\S]*/gi, '');

            // 2. Supprimer TOUS les marqueurs entre crochets
            text = text.replace(/\[.*?\]/gi, '');

            // 3. Supprimer TOUS les marqueurs Markdown **...**
            text = text.replace(/\*\*[^*]+\*\*/g, '');

            // 4. Supprimer lignes de marqueurs seules (sans texte après)
            text = text.replace(/^[\s]*(Verse|Chorus|Bridge|Refrain|Couplet|Outro|Intro|Hook|Pre-Chorus|Post-Chorus|Conclusão|Conclusion|Ponte|Refrão|Estrofe|Interlude|Solo|Tag|Vamp|Ad-lib|Break|Verset|Verso|Glória|Final)[\s\d]*[:\s]*$/gim, '');

            // 5. Normaliser : exactement 1 ligne vide entre couplets
            text = text.replace(/\n{2,}/g, '\n\n');

            // 6. Supprimer lignes vides au début/fin
            return text.trim();
        }

        function updateLyrics() {
            const lyricsText = document.getElementById('lyricsText');
            const lyricsContainer = document.getElementById('lyricsContainer');
            const chapterStr = String(currentChapter);

            const lyrics = getLyricsForCurrent(window.currentLanguage || 'FR', currentBook, chapterStr);

            if (lyrics) {
                lyricsText.innerHTML = cleanLyrics(String(lyrics));
            } else {
                lyricsText.innerHTML =
                    '<div class="no-lyrics">' +
                    (t('readerNoLyricsLang') || 'Paroles non disponibles dans cette langue pour ce chapitre') +
                    '</div>';
            }

            lyricsContainer.scrollTop = 0;
        }

        function updateBible() {
            const bibleText = document.getElementById('bibleText');
            const bibleContainer = document.getElementById('bibleContainer');
            const chapterStr = String(currentChapter);

            const dataset = getBibleDatasetForLang(window.currentLanguage || 'FR');

            if (dataset && dataset[currentBook] && dataset[currentBook][chapterStr]) {
                const verses = dataset[currentBook][chapterStr];
                let html = '';
                verses.forEach(verse => {
                    html += '<div class="verse"><span class="verse-number">' + verse.num + '.</span>' + verse.text + '</div>';
                });
                bibleText.innerHTML = html;
            } else {
                bibleText.innerHTML = '<div class="no-bible">' + (t('readerNoBibleLang') || 'Texte biblique non disponible dans cette langue pour ce chapitre') + '</div>';
            }

            bibleContainer.scrollTop = 0;
        }

        function playBook(num, chapters) {
            currentBook = num;
            currentChapter = 1;
            totalBookChapters = chapters;

            if (autoPlayEnabled) {
                autoPlayEnabled = false;
                document.getElementById('playBookBtn').classList.remove('playing');
                document.getElementById('playBookIcon').textContent = '▶';
                document.getElementById('playBookText').textContent = t('readerPlayBook') || 'Lire tout le livre';
                document.getElementById('bookProgress').style.display = 'none';
            }

            document.querySelectorAll('.book').forEach(b => b.classList.remove('playing'));
            const activeBookEl = document.querySelector('.book[data-num="'+num+'"]');
            if (activeBookEl) activeBookEl.classList.add('playing');

            const select = document.getElementById('chapter-select');
            select.innerHTML = '';
            const chapterWord = t('readerChapter') || 'Chapitre';
            for (let i = 1; i <= chapters; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = chapterWord + ' ' + i;
                select.appendChild(opt);
            }

            document.getElementById('player').classList.add('active');
            playChapter(1);
        }

        function playChapter(chapter) {
            currentChapter = chapter;

            let url;
            const chapterStr = String(chapter);

            let audioSource;
            const lang = window.currentLanguage || 'FR';
            const langAudioVar = `audioUrls${lang}`;

            if (typeof window[langAudioVar] !== 'undefined') {
                audioSource = window[langAudioVar];
            } else {
                audioSource = window.audioUrlsFR || window.audioUrls;
            }

            if (audioSource) {
                url = audioSource[currentBook] && audioSource[currentBook][chapterStr];
            }

            if (!url) {
                alert((t('readerAudioMissing') || 'MP3 introuvable') + ' : ' + lang + ' ' + currentBook + ' ' + chapterStr);
                return;
            }

            const audio = document.getElementById('audio');
            audio.src = url;


            audio.load();
            __BC_tryAutoPlay(audio);
const bookName = getBookDisplayName(currentBook);
            const chapterWord = (lang === 'PT') ? 'Cap.' : (t('readerChapterShort') || 'Ch.');
            let displayTitle = bookName + ' - ' + chapterWord + String(chapter).padStart(2, '0');

            if (typeof window.chapterTitles !== 'undefined' && window.chapterTitles && window.chapterTitles[currentBook] && window.chapterTitles[currentBook][chapterStr]) {
                displayTitle += ' - ' + window.chapterTitles[currentBook][chapterStr];
            }

            document.getElementById('player-title').textContent = displayTitle;
            document.getElementById('chapter-select').value = chapter;

            const book = books.find(b => b.num === currentBook);
            if (book) {
                document.getElementById('prev-btn').disabled = chapter <= 1;
                document.getElementById('next-btn').disabled = chapter >= book.chapters;
            }

            if (!lyricsVisible) toggleLyrics();

            updateLyrics();
            updateBible();

            if (autoPlayEnabled) updateBookProgress();
        }

        function togglePlayEntireBook() {
            autoPlayEnabled = !autoPlayEnabled;
            const playBookBtn = document.getElementById('playBookBtn');
            const playBookIcon = document.getElementById('playBookIcon');
            const playBookText = document.getElementById('playBookText');
            const bookProgress = document.getElementById('bookProgress');

            if (autoPlayEnabled) {
                playBookBtn.classList.add('playing');
                playBookIcon.textContent = '■';
                playBookText.textContent = t('readerStopBook') || 'Arrêter lecture';
                bookProgress.style.display = 'inline-block';

                playChapter(1);
                updateBookProgress();

                setTimeout(() => { document.getElementById('audio').play(); }, 300);
            } else {
                playBookBtn.classList.remove('playing');
                playBookIcon.textContent = '▶';
                playBookText.textContent = t('readerPlayBook') || 'Lire tout le livre';
                bookProgress.style.display = 'none';

                const audio = document.getElementById('audio');
                audio.pause();
            }
        }

        function updateBookProgress() {
            const bookProgress = document.getElementById('bookProgress');
            bookProgress.textContent = (t('readerChapter') || 'Chapitre') + ' ' + currentChapter + ' / ' + totalBookChapters;
        }

        document.addEventListener('click', e => {
            const bookEl = e.target.closest('.book');
            if (bookEl && bookEl.dataset.available === 'true') {
                playBook(bookEl.dataset.num, parseInt(bookEl.dataset.chapters, 10));
            }
        });

        document.getElementById('chapter-select').addEventListener('change', e => {
            playChapter(parseInt(e.target.value, 10));
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentChapter > 1) playChapter(currentChapter - 1);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            const book = books.find(b => b.num === currentBook);
            if (book && currentChapter < book.chapters) playChapter(currentChapter + 1);
        });

        document.getElementById('audio').addEventListener('ended', () => {
            const book = books.find(b => b.num === currentBook);
            if (!book) return;

            if (currentChapter < book.chapters) {
                playChapter(currentChapter + 1);
            } else if (autoPlayEnabled) {
                autoPlayEnabled = false;
                document.getElementById('playBookBtn').classList.remove('playing');
                document.getElementById('playBookIcon').textContent = '▶';
                document.getElementById('playBookText').textContent = t('readerPlayBook') || 'Lire tout le livre';
                document.getElementById('bookProgress').style.display = 'none';
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const bookParam = urlParams.get('book');
        const chapterParam = urlParams.get('chapter');

        const returnUrl = urlParams.get('return');
        const sectionParam = urlParams.get('section');

        window.goBackToSection = function() {
            if (returnUrl) {
                const lang = window.currentLanguage || 'FR';
                window.location.href = returnUrl + (returnUrl.includes('?') ? '&' : '?') + 'lang=' + lang;
            }
        };

        function buildSectionUrl(book, chapter) {
            const lang = window.currentLanguage || 'FR';
            let url = `lecteur.html?book=${book}&chapter=${chapter}&lang=${lang}`;
            if (returnUrl) url += `&return=${encodeURIComponent(returnUrl)}`;
            if (sectionParam) url += `&section=${sectionParam}`;
            return url;
        }

            if (!returnUrl) return;

            const backBtn = document.getElementById('sectionBackBtn');
            const isConfessions = returnUrl.toLowerCase().includes('confession');
            const lang = window.currentLanguage || 'FR';

            const backLabels = isConfessions ? {

        function renderSectionMenu() {
            renderBackButton();

            if (!sectionParam || !window.PROMESSES_SECTIONS || !window.PROMESSES_SECTIONS[sectionParam]) return;

            const lang = window.currentLanguage || 'FR';
            const chapters = window.PROMESSES_SECTIONS[sectionParam];
            const labels = (window.PROMESSES_SECTION_LABELS && (window.PROMESSES_SECTION_LABELS[lang] || window.PROMESSES_SECTION_LABELS.FR)) || {};
            const sectionLabel = labels[sectionParam] || sectionParam;
            const psalmWord = labels.psalm || (lang === 'PT' ? 'Salmo' : 'Psaume');

            const menuContainer = document.getElementById('sectionMenuContainer');
            const menuTitle = document.getElementById('sectionMenuTitle');
            const chapterList = document.getElementById('sectionChapterList');

            menuTitle.textContent = sectionLabel;
            chapterList.innerHTML = '';

            chapters.forEach(ch => {
                const chNum = parseInt(ch.chapter, 10);
                const subtitle = window.PSALM_SUBTITLES && window.PSALM_SUBTITLES[chNum]
                    ? (window.PSALM_SUBTITLES[chNum][lang] || window.PSALM_SUBTITLES[chNum].FR || '')
                    : '';

                const isActive = ch.book === currentBook && String(ch.chapter) === String(currentChapter);

                const item = document.createElement('a');
                item.className = 'section-chapter-item' + (isActive ? ' active' : '');
                item.href = buildSectionUrl(ch.book, ch.chapter);
                item.innerHTML = `
                    <div>
                        <div class="section-chapter-label">${psalmWord} ${chNum}</div>
                        <div class="section-chapter-subtitle">${subtitle}</div>
                    </div>
                    <div class="section-chapter-play">▶</div>
                `;
                chapterList.appendChild(item);
            });

            menuContainer.classList.add('visible');
        }

        function applyTranslations() {
            const lang = window.currentLanguage || 'FR';
            const trans = TRANSLATIONS[lang] || TRANSLATIONS.FR;

            if (!trans) {
                console.error('[lecteur] Traductions non disponibles pour la langue:', lang);
                return;
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (trans[key]) el.textContent = trans[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (trans[key]) el.placeholder = trans[key];
            });

            renderBooks('old-testament', oldTestament);
            renderBooks('new-testament', newTestament);

            console.log('[lecteur] Traductions appliquées pour la langue:', lang);
        }

        // Appliquer les traductions au chargement de la page
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyTranslations);
        } else {
            applyTranslations();
        }

        

        function __BC_showForcePlay(msg) {
            const b = document.getElementById("forcePlayBtn");
            const m = document.getElementById("forcePlayMsg");
            if (b) b.style.display = "inline-block";
            if (m) { m.style.display = "inline-block"; m.textContent = msg || "Clique ▶ Lancer"; }
        }

        function __BC_hideForcePlay() {
            const b = document.getElementById("forcePlayBtn");
            const m = document.getElementById("forcePlayMsg");
            if (b) b.style.display = "none";
            if (m) m.style.display = "none";
        }

        function __BC_tryAutoPlay(audioEl) {
            if (!audioEl) return;
            __BC_hideForcePlay();

            const p = audioEl.play();
            if (p && typeof p.catch === "function") {
                p.catch((err) => {
                    const name = err && (err.name || err.code) ? String(err.name || err.code) : "";
                    if (name.toLowerCase().includes("notallowed")) {
                        __BC_showForcePlay("Autoplay bloqué — clique ▶ Lancer");
                    } else {
                        __BC_showForcePlay("Clique ▶ Lancer");
                    }
                    console.warn("[lecteur] autoplay refused:", err);
                });
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const b = document.getElementById("forcePlayBtn");
            const audioEl = document.getElementById("audio");
            if (b && audioEl) {
                b.addEventListener("click", () => {
                    audioEl.play().catch(()=>{});
                });
            }

renderBooks('old-testament', oldTestament);
        renderBooks('new-testament', newTestament);

            if (book) {

                    renderSectionMenu();
                }, 100);
            }
