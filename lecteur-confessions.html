<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Chantée - Confession</title>
  <style>
    :root {
      --bleu-nuit: #1E3A5F;
      --bleu-sombre: #162B46;
      --bleu-cartes: #243F66;
      --or-moyen: #F5CB42;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, var(--bleu-nuit) 0%, var(--bleu-sombre) 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: white;
      padding: 20px;
    }
    .container { max-width: 500px; margin: 0 auto; text-align: center; }
    .icon { font-size: 60px; margin-bottom: 15px; }
    .title { color: var(--or-moyen); font-size: 24px; margin-bottom: 8px; }
    .verse { color: #b0b0b0; font-style: italic; margin-bottom: 20px; font-size: 14px; }
    .player-box {
      background: var(--bleu-cartes);
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(245, 203, 66, 0.3);
      margin-bottom: 20px;
    }
    audio { width: 100%; margin-bottom: 15px; }
    .toggle-row { display: flex; gap: 10px; margin-bottom: 15px; }
    .toggle-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid rgba(245, 203, 66, 0.4);
      border-radius: 10px;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }
    .toggle-btn.active {
      background: var(--or-moyen);
      color: var(--bleu-nuit);
      font-weight: bold;
    }
    .lyrics-box {
      background: var(--bleu-sombre);
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
    }
    .back-btn {
      display: inline-block;
      padding: 12px 30px;
      background: transparent;
      border: 2px solid var(--or-moyen);
      color: var(--or-moyen);
      border-radius: 25px;
      text-decoration: none;
      transition: all 0.3s;
    }
    .back-btn:hover {
      background: var(--or-moyen);
      color: var(--bleu-nuit);
    }
  </style>
</head>

    // Check if this is a shared link (requires email gate)

      const urlParams = new URLSearchParams(window.location.search);
      const isShared = urlParams.get('shared');

        const emailData = localStorage.getItem('bc_trial_email');

        if (emailData) {
          const data = JSON.parse(emailData);
          const now = Date.now();
          const sevenDays = 7 * 24 * 60 * 60 * 1000;

          if (now - data.timestamp < sevenDays) {
            return true;
          }
        }

        showEmailGate();
        return false;
      }

      return true;
    }

<script>
// === CONFESSIONS HELPERS (404/HTML guard + fallback messages) ===
function setLyricsUnavailable(lang, details) {
  const box = document.getElementById('lyricsBox') || window.lyricsBox;
  if (!box) return;
  box.textContent = (lang ? "Paroles non disponibles pour cette langue (" + lang + ")" : "Paroles non disponibles pour cette langue")
    + (details ? "\n\n" + details : "");
}

async function safeFetchText(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const ct = (r.headers.get('content-type') || '').toLowerCase();
  const text = await r.text();

  const t = text.trim().toLowerCase();
  const looksHtml = t.startsWith('<!doctype') || t.startsWith('<html') || ct.includes('text/html');
  if (looksHtml) throw new Error('HTML response');
  return text;
}
</script>
<script>
// === CONFESSIONS AUDIO FALLBACK ===
function getConfessionAudio(lang, num) {
  const available = ['FR','PT'];
  const useLang = available.includes((lang || '').toUpperCase()) ? (lang || '').toUpperCase() : 'FR';
  return (window.CONFESSIONS_AUDIO && window.CONFESSIONS_AUDIO[useLang]) ? window.CONFESSIONS_AUDIO[useLang][num] : null;
}
</script>
