<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement reussi - Bible Chantee</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TX3ETCKJQZ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-TX3ETCKJQZ');
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #000080;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .success-box {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #ffce00;
            max-width: 500px;
        }
        .checkmark {
            font-size: 4rem;
            color: #00ff00;
            margin-bottom: 20px;
        }
        h1 {
            color: #ffce00;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        p {
            margin-bottom: 15px;
            line-height: 1.6;
            color: #ddd;
        }
        .highlight {
            color: #ffce00;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #ffce00, #ffa500);
            color: #000080;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 206, 0, 0.4);
        }
        .premium-badge {
            display: inline-block;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="success-box">
        <div class="checkmark">&#10003;</div>
        <h1>Merci pour votre achat !</h1>
        <p>Votre acces <span class="highlight">Premium illimite</span> a Bible Chantee est maintenant actif.</p>
        <p>Profitez des <span class="highlight">1189 chapitres</span> dans toutes les langues, sans aucune limite.</p>
        <div class="premium-badge">&#9733; PREMIUM ACTIVE</div>
        <br>
        <a href="/lecteur.html" class="btn">Commencer a ecouter</a>
    </div>
    <script>
        // Activer premium dans localStorage
        const user = JSON.parse(localStorage.getItem('bc_user') || '{}');
        user.premium = true;
        user.premiumDate = new Date().toISOString();
        localStorage.setItem('bc_user', JSON.stringify(user));

        // Track GA4 purchase
        gtag('event', 'purchase', {
            currency: 'CHF',
            value: 0.99,
            transaction_id: 'stripe_' + Date.now(),
            item_name: 'Bible Chantee Premium'
        });

        console.log('Premium active!', user);
    </script>
</body>
</html>
