<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Réussi - Bible Chantée</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a237e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: rgba(30, 58, 95, 0.8);
            padding: 60px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(245, 200, 66, 0.3);
        }
        .success-icon {
            font-size: 5rem;
            margin-bottom: 30px;
            animation: bounce 1s ease;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        h1 {
            color: #f5c842;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            background: #f5c842;
            color: #1a237e;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">🎉</div>
        <h1 id="title">Paiement Réussi !</h1>
        <p id="message" style="font-size: 1.2rem; margin: 20px 0;">Votre compte premium est activé.</p>
        <a href="/lecteur.html" class="cta-button" id="cta">Commencer à écouter</a>
    </div>
    <script>
        // Inline translations

            EN: { title: "Payment Successful!", message: "Your premium account is activated.", cta: "Start Listening" },
            PT: { title: "Pagamento Bem-sucedido!", message: "Sua conta premium está ativada.", cta: "Começar a Ouvir" },
            ES: { title: "¡Pago Exitoso!", message: "Tu cuenta premium está activada.", cta: "Empezar a Escuchar" },
            DE: { title: "Zahlung Erfolgreich!", message: "Ihr Premium-Konto ist aktiviert.", cta: "Jetzt Anhören" },
            IT: { title: "Pagamento Riuscito!", message: "Il tuo account premium è attivato.", cta: "Inizia ad Ascoltare" }

        premiumSystem.checkPremiumStatus();

</body>
</html>
