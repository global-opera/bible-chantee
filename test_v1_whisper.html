<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test V1 Whisper - Vérification</title>
  <style>
    body {
      background: #1a1a2e;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      color: #F5CB42;
      text-align: center;
      border-bottom: 3px solid #F5CB42;
      padding-bottom: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .chapter-card {
      background: rgba(30, 58, 95, 0.5);
      padding: 20px;
      border-radius: 10px;
      border: 2px solid transparent;
      transition: all 0.3s;
    }
    .chapter-card.success { border-color: #0f0; }
    .chapter-card.warning { border-color: #ff0; }
    .chapter-card:hover {
      border-color: #F5CB42;
      transform: translateY(-5px);
    }
    .chapter-card h3 {
      color: #F5CB42;
      margin: 0 0 15px 0;
      font-size: 18px;
    }
    .chapter-card pre {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 14px;
      margin: 0;
      max-height: 250px;
      overflow-y: auto;
    }
    .status {
      background: rgba(0,0,0,0.3);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }
    .success { color: #0f0; }
    .error { color: #f00; }
    .warning { color: #ff0; }
    .info { color: #F5CB42; }
    .fixed {
      background-color: rgba(0, 255, 0, 0.3);
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: bold;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #F5CB42;
      color: #1a1a2e;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      margin: 5px;
      transition: all 0.3s;
    }
    .btn:hover {
      background: #FFD700;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>🎵 Test V1 Whisper Original - Vérification complète</h1>

  <div class="status" id="status">
    <p class="info">⏳ Chargement...</p>
  </div>

  <div style="text-align: center; margin: 20px 0;">
    <a href="lecteur.html?book=18&chapter=5&lang=FR&version=v1" class="btn" target="_blank">
      🎧 Job 5 dans le lecteur
    </a>
    <a href="lecteur.html?book=01&chapter=1&lang=FR&version=v1" class="btn" target="_blank">
      🎧 Genèse 1 dans le lecteur
    </a>
    <a href="lecteur.html?book=19&chapter=23&lang=FR&version=v1" class="btn" target="_blank">
      🎧 Psaume 23 dans le lecteur
    </a>
  </div>

  <div class="grid" id="chapters"></div>

  <script>
    const statusDiv = document.getElementById('status');
    const chaptersDiv = document.getElementById('chapters');

    // Chapitres à tester
    const tests = [
      { book: '01_GEN', chapter: 1, name: 'Genèse 1' },
      { book: '18_JOB', chapter: 5, name: 'Job 5 (ex-maman)' },
      { book: '18_JOB', chapter: 6, name: 'Job 6 (ex-maman)' },
      { book: '19_PSA', chapter: 23, name: 'Psaume 23' },
      { book: '40_MAT', chapter: 1, name: 'Matthieu 1' },
      { book: '43_JOH', chapter: 3, name: 'Jean 3' },
    ];

    async function loadChapter(book, chapterNum) {
      const paddedChapter = String(chapterNum).padStart(3, '0');
      const url = `lyrics_v1/${book}/${book}_${paddedChapter}_FR.txt`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        let text = await response.text();

        // Nettoyer pour affichage
        text = text.replace(/\[TITLE\][\s\S]*?\[LYRICS\]/gi, '');
        text = text.replace(/\[STYLE\][\s\S]*/gi, '');
        text = text.replace(/\[(Verse|Chorus|Bridge|Outro|Intro|Pre-Chorus).*?\]/gi, '');
        text = text.replace(/\d{2}_[A-Z]+_\d+_FR/g, '');
        text = text.replace(/¶/g, '');
        text = text.trim();

        // Limiter à 600 caractères
        const preview = text.substring(0, 600) + (text.length > 600 ? '...' : '');

        // Vérifications
        const hasMaman = /maman/i.test(text);
        const hasMain = /\bmain\b/i.test(text);
        const hasWeirdChars = /[Ǹ��ǽǦ]/g.test(text);
        const hasAccents = /[éàèôêûîç]/g.test(text);

        let statusClass = 'success';
        let statusText = '✅ OK';

        if (hasMaman) {
          statusClass = 'error';
          statusText = '❌ Contient "maman"';
        } else if (hasWeirdChars) {
          statusClass = 'warning';
          statusText = '⚠️ Caractères bizarres';
        } else if (!hasAccents) {
          statusClass = 'warning';
          statusText = '⚠️ Pas d\'accents';
        }

        // Highlighter "main" si Job
        let displayText = preview;
        if (book === '18_JOB' && hasMain) {
          displayText = displayText.replace(/\b(main)\b/gi, '<span class="fixed">$1</span>');
        }

        return {
          book,
          chapter: chapterNum,
          status: statusText,
          statusClass,
          text: displayText,
          length: text.length,
          checks: {
            maman: hasMaman,
            main: hasMain,
            weird: hasWeirdChars,
            accents: hasAccents
          }
        };

      } catch (error) {
        return {
          book,
          chapter: chapterNum,
          status: `❌ Erreur: ${error.message}`,
          statusClass: 'error',
          text: '',
          length: 0,
          checks: {}
        };
      }
    }

    async function loadAllChapters() {
      statusDiv.innerHTML = '<p class="info">⏳ Chargement de ' + tests.length + ' chapitres...</p>';

      const results = await Promise.all(tests.map(t => loadChapter(t.book, t.chapter)));

      chaptersDiv.innerHTML = '';

      results.forEach((result, i) => {
        const testInfo = tests[i];
        const card = document.createElement('div');
        card.className = `chapter-card ${result.statusClass}`;
        card.innerHTML = `
          <h3>${testInfo.name}</h3>
          <div style="margin-bottom: 10px; font-size: 16px;">${result.status}</div>
          <div style="color: #999; font-size: 12px; margin-bottom: 10px;">
            Taille: ${result.length} caractères
          </div>
          <pre>${result.text}</pre>
          <div style="margin-top: 15px;">
            <a href="lecteur.html?book=${result.book.split('_')[0]}&chapter=${result.chapter}&lang=FR&version=v1"
               class="btn"
               target="_blank"
               style="font-size: 12px; padding: 5px 10px;">
              Ouvrir dans le lecteur
            </a>
          </div>
        `;
        chaptersDiv.appendChild(card);
      });

      // Vérifications globales
      const allOk = results.every(r => r.statusClass === 'success');
      const noMaman = results.every(r => !r.checks.maman);
      const goodEncoding = results.every(r => !r.checks.weird && r.checks.accents);

      let summary = `
        <p class="${allOk ? 'success' : 'warning'}">
          ${allOk ? '🎉 TOUS LES TESTS RÉUSSIS!' : '⚠️ Certains tests nécessitent attention'}
        </p>
        <p>
          Chapitres testés: ${results.length}<br>
          Aucun "maman": ${noMaman ? '✅' : '❌'}<br>
          Encodage correct: ${goodEncoding ? '✅' : '⚠️'}<br>
          Statut: ${allOk ? 'Prêt pour production ✅' : 'Vérification recommandée'}
        </p>
      `;

      statusDiv.innerHTML = summary;
    }

    loadAllChapters();
  </script>
</body>
</html>
