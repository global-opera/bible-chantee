<!doctype html>
<html lang="fr">
<head>
  <script>
    // Redirect to demo on staging (sungbible.world)
    if (window.location.hostname === 'sungbible.world') {
      window.location.replace('/demo.html' + window.location.search);
    }
  </script>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible Chantee</title>
  <script>
    (function(){
      try {
        var c = document.cookie || "";
        var isPremium = /(?:^|;\s*)bc_premium=1(?:;|$)/.test(c);
        location.replace(isPremium ? "/premium.html" : "/lecteur.html");
      } catch(e) {
        location.replace("/lecteur.html");
      }
    })();
  </script>
  <script src="translations.js"></script>
  <script src="translations-extra.js"></script>
  <script src="i18n.js"></script>
  <script src="lang-shared.js"></script>
</head>
<body></body>
</html>
