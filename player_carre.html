    var mode = (screen === "playSang" || screen === "chapterSang" || screen === "bookSang") ? "sang" : "audio";
    var urls = getAudioUrl(langCode, mode, BOOKS[bIdx].fc, cIdx + 1, bIdx);
    var triedFallback = false;
    // Stocker la partie 2 en file si elle existe
    setQueuedUrl((urls.parts && urls.parts.length > 1) ? urls.parts[1] : null);
    audio.onerror = function() { if (!triedFallback && urls.fallback) { triedFallback = true; audio.src = urls.fallback; audio.load(); audio.play().catch(function() {}); } };
    audio.src = urls.primary; audio.load(); setElapsed(0); setDuration(0); audio.play().catch(function() {}); setPlaying(true);
  }
  loadAndPlayRef.current = loadAndPlay;

  useEffect(function() { if (!audioRef.current || !audioRef.current.src) return; if (playing) { audioRef.current.play().catch(function() {}); } else { audioRef.current.pause(); } }, [playing]);
  useEffect(function() { if (screen !== "boot") return; var t1 = setTimeout(function() { setBootPhase(1); }, 2000); var t2 = setTimeout(function() { setScreen("lang"); }, 2800); return function() { clearTimeout(t1); clearTimeout(t2); }; }, [screen]);

  function goMain(i) { setMainIdx(i); if (i === 0) setScreen("bookSang"); if (i === 1) setScreen("bookAudio"); if (i === 2) setScreen("playlists"); if (i === 3) setScreen("resume"); if (i === 4) setScreen("settings"); }
  function goSettings(i) { setSettingsIdx(i); if (i === 0) setScreen("lang"); if (i === 1) setScreen("volume"); if (i === 2) setScreen("brightness"); if (i === 3) setScreen("bluetooth"); if (i === 4) setScreen("info"); }
  function selectBook(idx) { setBookIdx(idx); setChapIdx(0); if (screen === "bookSang") setScreen("chapterSang"); else setScreen("chapterAudio"); }
  function selectChapter(idx) { setChapIdx(idx); if (screen === "chapterSang") setScreen("playSang"); else setScreen("playAudio"); setTimeout(function() { loadAndPlay(bookIdx, idx); }, 50); }

  var curLang = LANGUAGES[lang]; var curBook = BOOKS[bookIdx]; var totalTime = duration || 1;
  var mainMenuItems = [t.bibleSung, t.bibleAudio, t.playlists, t.resume, t.settings];
  var settingsItems = [t.changeLang, t.volume, t.brightness, t.bluetooth, t.info];
  var playlistItems = [t.fullBible, t.newTestament, t.psalms, t.plan365, t.promises];
  var btOptions = [t.enabled, t.disabled, t.searchDevice];

  return (
    <div style={{ minHeight: "100vh", background: "linear-gradient(145deg, #2a1f0a 0%, #1a1508 40%, #0d0f1a 100%)", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ width: 330, height: 330, background: "linear-gradient(160deg, " + navyLight + ", " + navy + ")", borderRadius: 22, boxShadow: "0 0 0 2.5px " + gold + "50, 0 0 0 5px " + navy + ", 0 24px 60px rgba(0,0,0,0.7)", padding: 14, display: "flex", flexDirection: "column", gap: 14 }}>
        <div style={{ background: screenBg, borderRadius: 12, border: "2.5px solid " + gold, height: 202, boxSizing: "border-box", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "inset 0 2px 10px rgba(0,0,0,0.7), 0 0 14px " + gold + "12", filter: "brightness(" + (0.6 + bright * 0.06) + ")" }}>

                <svg width="160" height="90" viewBox="0 0 160 90" style={{ position: "absolute", top: 20 }}><line x1="10" y1="18" x2="150" y2="18" stroke={gold} strokeWidth="1.5" opacity="0.7" /><line x1="10" y1="33" x2="150" y2="33" stroke={gold} strokeWidth="1.5" opacity="0.7" /><line x1="10" y1="48" x2="150" y2="48" stroke={gold} strokeWidth="1.5" opacity="0.7" /><line x1="10" y1="63" x2="150" y2="63" stroke={gold} strokeWidth="1.5" opacity="0.7" /><line x1="10" y1="78" x2="150" y2="78" stroke={gold} strokeWidth="1.5" opacity="0.7" /></svg>

                <div style={{ color: gold, fontSize: 14, fontWeight: 700, letterSpacing: 2, fontFamily: "Georgia, serif", marginTop: -4, zIndex: 1 }}>Bible</div>
              </div>
              <div style={{ color: gold, fontSize: 14, fontWeight: 700, letterSpacing: 2, fontFamily: "Georgia, serif", marginTop: 8 }}>Chantée</div>
              <div style={{ color: whiteDim, fontSize: 11, letterSpacing: 3, fontWeight: 300, marginTop: 2 }}>Player</div>
              <div style={{ display: "flex", gap: 6, marginTop: 8 }}><div style={{ width: 5, height: 5, borderRadius: "50%", background: gold, animation: "pulse 1.2s 0s infinite" }} /><div style={{ width: 5, height: 5, borderRadius: "50%", background: gold, animation: "pulse 1.2s 0.3s infinite" }} /><div style={{ width: 5, height: 5, borderRadius: "50%", background: gold, animation: "pulse 1.2s 0.6s infinite" }} /></div>
            </div>
          )}

          {screen === "lang" && (<div style={{ flex: 1, padding: "8px 12px 6px", display: "flex", flexDirection: "column", overflow: "hidden" }}><ScreenTitle label={t.chooseLang} /><div style={{ flex: 1, overflowY: "auto" }}>{LANGUAGES.map(function(l, i) { return <MenuItem key={i} label={l.label} flag={l.flag} isSelected={i === lang} onClick={function() { if (i === lang) { setScreen("main"); } else { setLang(i); setTimeout(function() { setScreen("main"); }, 150); } }} />; })}</div></div>)}

          {screen === "main" && (<div style={{ flex: 1, padding: "8px 12px 6px", display: "flex", flexDirection: "column", overflow: "hidden" }}><div style={{ borderTop: "1px solid " + navyMid, marginBottom: 4 }}><ScreenTitle label={t.mainMenu} /></div><div style={{ flex: 1, overflowY: "auto", borderBottom: "1px solid " + gold }}><div style={{ display: "flex", flexDirection: "column", gap: 2 }}>{mainMenuItems.map(function(item, i) { return <MenuItem key={i} label={item} isSelected={i === mainIdx} onClick={function() { goMain(i); }} />; })}</div></div></div>)}

          {(screen === "bookSang" || screen === "bookAudio") && (<div style={{ flex: 1, padding: "8px 12px 6px", display: "flex", flexDirection: "column", overflow: "hidden" }}><ScreenTitle label={screen === "bookSang" ? t.bibleSung : t.bibleAudio} /><div style={{ flex: 1, overflowY: "auto" }}>{BOOKS.map(function(b, i) { return <MenuItem key={b.id} label={bookName(i)} isSelected={i === bookIdx} onClick={function() { selectBook(i); }} />; })}</div></div>)}

          {(screen === "chapterSang" || screen === "chapterAudio") && (<div style={{ flex: 1, padding: "8px 12px 6px", display: "flex", flexDirection: "column", overflow: "hidden" }}><ScreenTitle label={bookName(bookIdx)} /><div style={{ flex: 1, overflowY: "auto" }}>{Array.from({ length: curBook.ch }, function(_, i) { return i; }).map(function(ci) { return <MenuItem key={ci} label={t.chapter + " " + (ci + 1)} isSelected={ci === chapIdx} onClick={function() { selectChapter(ci); }} />; })}</div></div>)}

          {(screen === "playSang" || screen === "playAudio") && (
            <div style={{ flex: 1, padding: "8px 12px 6px", display: "flex", flexDirection: "column", gap: 0 }}>
              <div style={{ color: gold, fontSize: 13, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", textAlign: "center", paddingBottom: 8, borderBottom: "1px solid " + navyMid }}>{screen === "playSang" ? t.bibleSung : t.bibleAudio}</div>

              <div style={{ padding: "0 4px" }}>
                <div onClick={function(e) { var rect = e.currentTarget.getBoundingClientRect(); var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left; var pct = Math.max(0, Math.min(1, x / rect.width)); var newTime = Math.round(pct * totalTime); setElapsed(newTime); if (audioRef.current && audioRef.current.duration) { audioRef.current.currentTime = newTime; } }} style={{ height: 14, cursor: "pointer", display: "flex", alignItems: "center", position: "relative" }}>
                  <div style={{ height: 3, width: "100%", background: navyMid, borderRadius: 2, overflow: "hidden" }}><div style={{ height: "100%", width: ((elapsed / totalTime) * 100) + "%", background: "linear-gradient(90deg, " + gold + ", " + goldLight + ")", transition: "width 0.3s linear" }} /></div>
                  <div style={{ position: "absolute", left: ((elapsed / totalTime) * 100) + "%", top: "50%", width: 10, height: 10, borderRadius: "50%", background: gold, transform: "translate(-50%, -50%)", boxShadow: "0 0 4px " + gold + "80" }} />
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 2, color: whiteDim, fontSize: 11 }}><span>{fmtTime(elapsed)}</span><span>{fmtTime(totalTime)}</span></div>
              </div>
              <div style={{ textAlign: "center", marginTop: 8 }}><span onClick={function() { setScreen("main"); }} style={{ color: goldDim, fontSize: 11, cursor: "pointer" }}>{"\u2630"} {t.menu}</span></div>
            </div>
          )}

          {screen === "resume" && (<div style={{ flex: 1, padding: "8px 12px 6px", display: "flex", flexDirection: "column", overflow: "hidden" }}><ScreenTitle label={t.resume} /><div style={{ background: navyMid + "40", borderRadius: 8, padding: "10px 12px", margin: "4px 0 12px", border: "1px solid " + gold + "25" }}><div style={{ color: gold, fontSize: 13, padding: "2px 0" }}>{curLang.label}</div><div style={{ color: screenText, fontSize: 13, padding: "2px 0" }}>{t.bibleSung}</div><div style={{ color: screenText, fontSize: 13, padding: "2px 0" }}>{bookName(18)}</div><div style={{ color: white, fontSize: 13, padding: "2px 0" }}>{t.chapter} 23</div></div><div onClick={function() { setBookIdx(18); setChapIdx(22); setScreen("playSang"); setPlaying(true); }} style={{ padding: "7px 10px", background: gold, borderRadius: 6, color: navy, fontWeight: 700, fontSize: 13, cursor: "pointer", textAlign: "center", marginBottom: 4 }}>{"\u25B6"} {t.cont}</div><div onClick={function() { setScreen("main"); }} style={{ padding: "7px 10px", background: navyMid, borderRadius: 6, color: screenText, fontSize: 13, cursor: "pointer", textAlign: "center", border: "1px solid " + gold + "30" }}>{t.backMenu}</div></div>)}

          {screen === "playlists" && (<div style={{ flex: 1, padding: "8px 12px 6px", display: "flex", flexDirection: "column", overflow: "hidden" }}><div style={{ borderTop: "1px solid " + navyMid, marginBottom: 4 }}><ScreenTitle label={t.playlists} /></div><div style={{ flex: 1, overflowY: "auto", borderBottom: "1px solid " + gold }}><div style={{ display: "flex", flexDirection: "column", gap: 2 }}>{playlistItems.map(function(p, i) { return <MenuItem key={i} label={p} isSelected={i === playlistIdx} onClick={function() { setPlaylistIdx(i); }} />; })}</div></div></div>)}

          {screen === "settings" && (<div style={{ flex: 1, padding: "8px 12px 6px", display: "flex", flexDirection: "column", overflow: "hidden" }}><div style={{ borderTop: "1px solid " + navyMid, marginBottom: 4 }}><ScreenTitle label={t.settings} /></div><div style={{ flex: 1, overflowY: "auto", borderBottom: "1px solid " + gold }}><div style={{ display: "flex", flexDirection: "column", gap: 2 }}>{settingsItems.map(function(s, i) { return <MenuItem key={i} label={s} isSelected={i === settingsIdx} onClick={function() { goSettings(i); }} />; })}</div></div></div>)}

          {screen === "volume" && (<div style={{ flex: 1, padding: "8px 12px 6px" }}><ScreenTitle label={t.volume} /><div style={{ marginTop: 24, display: "flex", flexDirection: "column", gap: 20, alignItems: "center" }}><BarSlider value={vol} /><div style={{ display: "flex", gap: 16 }}><SmallBtn label={"\u2212"} onClick={function() { setVol(function(v) { return Math.max(0, v - 1); }); }} /><SmallBtn label="+" onClick={function() { setVol(function(v) { return Math.min(10, v + 1); }); }} /></div><span onClick={function() { setScreen("settings"); }} style={{ color: goldDim, fontSize: 12, cursor: "pointer" }}>{"\u25C0"} {t.back}</span></div></div>)}

          {screen === "brightness" && (<div style={{ flex: 1, padding: "8px 12px 6px" }}><ScreenTitle label={t.brightness} /><div style={{ marginTop: 24, display: "flex", flexDirection: "column", gap: 20, alignItems: "center" }}><BarSlider value={bright} /><div style={{ display: "flex", gap: 16 }}><SmallBtn label={"\u2212"} onClick={function() { setBright(function(v) { return Math.max(1, v - 1); }); }} /><SmallBtn label="+" onClick={function() { setBright(function(v) { return Math.min(10, v + 1); }); }} /></div><span onClick={function() { setScreen("settings"); }} style={{ color: goldDim, fontSize: 12, cursor: "pointer" }}>{"\u25C0"} {t.back}</span></div></div>)}

          {screen === "bluetooth" && (<div style={{ flex: 1, padding: "8px 12px 6px" }}><ScreenTitle label={t.bluetooth} /><div style={{ display: "flex", flexDirection: "column", gap: 2 }}>{btOptions.map(function(b, i) { return <MenuItem key={i} label={b} isSelected={i === btIdx} onClick={function() { setBtIdx(i); }} />; })}</div><span onClick={function() { setScreen("settings"); }} style={{ color: goldDim, fontSize: 12, cursor: "pointer", display: "block", marginTop: 12, textAlign: "center" }}>{"\u25C0"} {t.back}</span></div>)}

          {screen === "info" && (<div style={{ flex: 1, padding: "8px 12px 6px", display: "flex", flexDirection: "column", overflow: "hidden" }}><div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}><div style={{ fontSize: 24, color: gold }}>{"\u{1D11E}"}</div><div style={{ color: gold, fontSize: 13, fontWeight: 700, letterSpacing: 1 }}>Bible Chantée Player</div></div><div style={{ flex: 1, overflowY: "auto" }}><div style={{ background: navyMid + "40", borderRadius: 8, padding: "8px 12px", border: "1px solid " + gold + "20" }}>{[[t.firmware, "1.1"], [t.memory, "128 GB"], [t.languages, "7"], [t.books, "66 \u00D7 7"]].map(function(row) { return (<div key={row[0]} style={{ display: "flex", justifyContent: "space-between", padding: "3px 0", borderBottom: "1px solid " + navyMid, fontSize: 12 }}><span style={{ color: whiteDim }}>{row[0]}</span><span style={{ color: gold }}>{row[1]}</span></div>); })}</div></div><span onClick={function() { setScreen("settings"); }} style={{ color: goldDim, fontSize: 12, cursor: "pointer", textAlign: "center", display: "block", paddingTop: 4 }}>{"\u25C0"} {t.back}</span></div>)}

        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <PhysBtn label={"\u25C0\u25C0"} onClick={function() { if (screen === "playSang" || screen === "playAudio") { var newB = Math.max(0, bookIdx - 1); setBookIdx(newB); setChapIdx(0); loadAndPlay(newB, 0); } }} />
          <PhysBtn label={"\u25C0"} onClick={function() { if (screen === "playSang" || screen === "playAudio") { var newC = Math.max(0, chapIdx - 1); setChapIdx(newC); loadAndPlay(bookIdx, newC); } }} />
          <PhysBtn label={playing ? "\u23F8" : "\u25B6"} accent={playing} onClick={function() { if (screen === "playSang" || screen === "playAudio") setPlaying(function(p) { return !p; }); }} />
          <PhysBtn label={"\u25B6"} onClick={function() { if (screen === "playSang" || screen === "playAudio") { var newC = Math.min(BOOKS[bookIdx].ch - 1, chapIdx + 1); setChapIdx(newC); loadAndPlay(bookIdx, newC); } }} />
          <PhysBtn label={"\u25B6\u25B6"} onClick={function() { if (screen === "playSang" || screen === "playAudio") { var newB = Math.min(BOOKS.length - 1, bookIdx + 1); setBookIdx(newB); setChapIdx(0); loadAndPlay(newB, 0); } }} />
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <button onClick={function() { setScreen("lang"); }} style={{ width: 36, height: 36, background: "linear-gradient(180deg, " + navyMid + ", " + navy + ")", border: "1.5px solid " + gold + "40", borderRadius: 8, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 2px 4px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05)", padding: 0 }} onMouseDown={function(e) { e.currentTarget.style.transform = "scale(0.93)"; }} onMouseUp={function(e) { e.currentTarget.style.transform = "scale(1)"; }}>
            <svg width="26" height="26" viewBox="0 0 26 26"><text x="3" y="17" fill={gold} fontSize="12" fontWeight="700" fontFamily="serif">A</text><line x1="12" y1="4" x2="14" y2="22" stroke={gold} strokeWidth="1" opacity="0.5" /><line x1="16" y1="9" x2="24" y2="9" stroke={gold} strokeWidth="2" strokeLinecap="round" /><line x1="16" y1="14" x2="24" y2="14" stroke={gold} strokeWidth="2" strokeLinecap="round" /><line x1="16" y1="19" x2="24" y2="19" stroke={gold} strokeWidth="2" strokeLinecap="round" /></svg>
          </button>
          <div style={{ width: 110, height: 36, borderRadius: 7, border: "1.5px solid " + gold, background: "linear-gradient(180deg, #232b6a 0%, #1a2158 100%)", display: "flex", alignItems: "center", justifyContent: "center", position: "relative", overflow: "hidden", cursor: "pointer" }}>
            <svg width="110" height="36" viewBox="0 0 110 36" style={{ position: "absolute", top: 0, left: 0 }}><line x1="6" y1="8" x2="104" y2="8" stroke={gold} strokeWidth="0.8" opacity="0.5" /><line x1="6" y1="14" x2="104" y2="14" stroke={gold} strokeWidth="0.8" opacity="0.5" /><line x1="6" y1="20" x2="104" y2="20" stroke={gold} strokeWidth="0.8" opacity="0.5" /><line x1="6" y1="26" x2="104" y2="26" stroke={gold} strokeWidth="0.8" opacity="0.5" /><line x1="6" y1="32" x2="104" y2="32" stroke={gold} strokeWidth="0.8" opacity="0.5" /></svg>
            <div style={{ position: "relative", zIndex: 1, display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ color: gold, fontSize: 28, lineHeight: 1, fontFamily: "serif", filter: "drop-shadow(0 1px 3px rgba(0,0,0,0.5))" }}>{"\u{1D11E}"}</span>
              <div style={{ display: "flex", flexDirection: "column", lineHeight: 1.1 }}><span style={{ color: gold, fontSize: 9, fontWeight: 700, letterSpacing: 1, fontFamily: "Georgia, serif" }}>Bible</span><span style={{ color: gold, fontSize: 9, fontWeight: 700, letterSpacing: 1, fontFamily: "Georgia, serif" }}>Chantée</span></div>
            </div>
          </div>
          <PhysBtn label={"\u2630"} onClick={function() { setScreen("main"); }} />
        </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BibleChanteePlayer />);
</script>
