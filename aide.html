<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Bible Chantée V3 — Aide</title>
  <link rel="stylesheet" href="./css/style.css"/>
<style>
/* BC_CLEAR_CACHE_SITE_ONLY_V1 */
#bcClearCacheWrap{position:fixed;right:14px;bottom:14px;z-index:99999}
#clearCacheBtn{
  padding:8px 14px;border-radius:10px;border:1px solid #f0c36d;
  background:#2c2f5b;color:#fff;cursor:pointer;font-size:14px
}
#clearCacheBtn:hover{opacity:.85}
</style>
<script src="js/book-names.js?v=1"></script>
<script src="js/ux-fixes.js?v=1"></script>
<script src="js/clear-cache.js?v=1"></script>
<!-- BC_V3_BOOTSTRAP_V1 -->
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <h1 data-i18n="navHelp">Aide</h1>
        <div class="tag">V3</div>
      </div>
      <div class="langs">
        <button class="lang-btn" data-lang="FR">FR</button><button class="lang-btn" data-lang="EN">EN</button><button class="lang-btn" data-lang="PT">PT</button><button class="lang-btn" data-lang="ES">ES</button><button class="lang-btn" data-lang="DE">DE</button><button class="lang-btn" data-lang="IT">IT</button><button class="lang-btn" data-lang="AR">AR</button><button class="lang-btn" data-lang="RU">RU</button><button class="lang-btn" data-lang="ZH">ZH</button><button class="lang-btn" data-lang="HI">HI</button><button class="lang-btn" data-lang="TL">TL</button><button class="lang-btn" data-lang="SW">SW</button>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>V3</h2>
      <div class="muted">Page aide (à compléter).</div>
      <div style="height:12px"></div>
      <a class="btn-gold" href="./index.html">Accueil</a>
      <a class="btn-gold" href="./lecteur.html" style="margin-left:8px">Lecteur</a>
    </div>
    <div class="footer">© 2025 Bible Chantée — V3</div>
  </div>
  <script src="./js/config.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/i18n.js"></script>
  <script>document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>I18N.setLang(b.dataset.lang)));</script>



<!-- BC_V3_BOOTSTRAP_V1 -->
<div id="bcClearCacheWrap" style="position:fixed;right:14px;bottom:14px;z-index:99999">
  <button id="clearCacheBtn" onclick="bcClearCache()"
    style="padding:8px 14px;border-radius:10px;border:1px solid #f0c36d;background:#2c2f5b;color:#fff;cursor:pointer;font-size:14px">
    🧹 Vider le cache
  </button>
</div>
</body>
</html>
