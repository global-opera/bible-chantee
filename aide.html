<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>Aide - Bible Chantée V3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bleu-nuit: #1E3A5F;
            --bleu-sombre: #162B46;
            --bleu-cartes: #243F66;
            --bleu-hover: #2C4A73;
            --or-moyen: #F5CB42;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bleu-sombre) 0%, var(--bleu-nuit) 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--or-moyen);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #b0b0b0;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 25px;
            background: transparent;
            border: 2px solid var(--or-moyen);
            border-radius: 25px;
            color: var(--or-moyen);
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: var(--or-moyen);
            color: var(--bleu-nuit);
        }

        .lang-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .lang-btn {
            padding: 8px 16px;
            background: var(--bleu-cartes);
            color: var(--or-moyen);
            border: 1px solid var(--or-moyen);
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .lang-btn:hover, .lang-btn.active {
            background: var(--or-moyen);
            color: var(--bleu-nuit);
        }

        .faq-section {
            margin-bottom: 40px;
        }

        .section-title {
            color: var(--or-moyen);
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .faq-item {
            background: rgba(30, 58, 95, 0.8);
            border-radius: 11px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .faq-item:hover {
            box-shadow: 0 5px 20px rgba(245, 200, 66, 0.2);
        }

        .faq-question {
            padding: 18px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bleu-cartes);
            transition: background 0.3s;
        }

        .faq-question:hover {
            background: var(--bleu-hover);
        }

        .faq-question-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--or-moyen);
        }

        .faq-icon {
            font-size: 1.5rem;
            color: var(--or-moyen);
            transition: transform 0.3s;
        }

        .faq-item.active .faq-icon {
            transform: rotate(180deg);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 20px;
        }

        .faq-item.active .faq-answer {
            max-height: 500px;
            padding: 20px;
        }

        .faq-answer-text {
            color: #e0e0e0;
            line-height: 1.6;
            font-size: 1rem;
        }

        .faq-answer ul {
            margin-left: 20px;
            margin-top: 10px;
        }

        .faq-answer li {
            margin-bottom: 8px;
        }

        .contact-card {
            background: rgba(30, 58, 95, 0.8);
            border-radius: 11px;
            padding: 25px;
            text-align: center;
            margin-top: 30px;
        }

        .contact-card h3 {
            color: var(--or-moyen);
            margin-bottom: 15px;
        }

        .contact-card p {
            color: #b0b0b0;
            margin-bottom: 20px;
        }

        .contact-btn {
            display: inline-block;
            padding: 12px 30px;
            background: var(--or-moyen);
            color: var(--bleu-nuit);
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 200, 66, 0.4);
        }

        .footer {
            text-align: center;
            color: #808080;
            margin-top: 50px;
            padding: 20px;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
            .faq-question-text {
                font-size: 1rem;
            }
        }
    </style>

        // Get language from localStorage

        // Update page content
        function updateContent(lang) {
            const t = TRANSLATIONS[lang] || TRANSLATIONS.FR;

            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('pageSubtitle').textContent = t.pageSubtitle;
            document.getElementById('backBtn').textContent = t.backBtn;
            document.getElementById('faqTitle').textContent = t.faqTitle;
            document.getElementById('contactTitle').textContent = t.contactTitle;
            document.getElementById('contactText').textContent = t.contactText;
            document.getElementById('contactBtn').textContent = t.contactBtn;

            // Generate FAQ items
            const faqContainer = document.getElementById('faqContainer');
            faqContainer.innerHTML = '';

            t.faqs.forEach((faq, index) => {
                const faqItem = document.createElement('div');
                faqItem.className = 'faq-item';
                faqItem.innerHTML = `
                    <div class="faq-question" data-index="${index}">
                        <span class="faq-question-text">${faq.q}</span>
                        <span class="faq-icon">▼</span>
                    </div>
                    <div class="faq-answer">
                        <div class="faq-answer-text">${faq.a}</div>
                    </div>
                `;
                faqContainer.appendChild(faqItem);
            });

            // Add click handlers to questions
            document.querySelectorAll('.faq-question').forEach(question => {
                question.addEventListener('click', () => {
                    const item = question.parentElement;
                    const wasActive = item.classList.contains('active');

                    // Close all items
                    document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('active'));

                    // Toggle current item
                    if (!wasActive) {
                        item.classList.add('active');
                    }
                });
            });
        }

        // Language button handlers

            btn.addEventListener('click', () => {
                const lang = btn.dataset.lang;
                currentLang = lang;
                localStorage.setItem('bc_lang', lang);

                // Update active button
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Update content
                updateContent(lang);
            });
        });

        // Initialize
        updateContent(currentLang);
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if (btn.dataset.lang === currentLang) {
                btn.classList.add('active');
            }
        });
    </script>
</body>
</html>
