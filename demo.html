<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Chantee - Decouvrez le projet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a1628;
            --bg-card: #0f2744;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent-gold: #d4af37;
            --accent-blue: #4a90d9;
            --success-green: #22c55e;
            --warning-orange: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #1a4a7a 0%, #0a1628 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }
        .header {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(180deg, #2a5a8a 0%, #1a4a7a 100%);
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #a8c8e8;
            margin-bottom: 0.5rem;
        }
        .header .subtitle {
            font-size: 1.2rem;
            color: var(--accent-gold);
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        .lang-btn {
            padding: 0.8rem 1.5rem;
            border: 2px solid var(--accent-gold);
            background: transparent;
            color: var(--text-primary);
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .lang-btn:hover, .lang-btn.active {
            background: var(--accent-gold);
            color: #000;
        }
        .lang-btn.disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
            text-align: center;
        }
        .stat-box {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-gold);
        }
        .stat-label { color: var(--text-secondary); font-size: 0.9rem; }
        .progress-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
        }
        .progress-section h2 {
            font-family: 'Playfair Display', serif;
            color: var(--accent-gold);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .lang-progress {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }
        .lang-card {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 1rem;
        }
        .lang-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .lang-name { font-weight: 600; font-size: 1.1rem; }
        .lang-status {
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
        }
        .status-complete { background: var(--success-green); color: #000; }
        .status-progress { background: var(--warning-orange); color: #000; }
        .status-planned { background: #555; color: #fff; }
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 0.5rem 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent-gold);
            border-radius: 4px;
        }
        .progress-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .tracks { margin: 2rem 0; }
        .track {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .track-info { flex: 1; min-width: 200px; }
        .track-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .track-desc { color: var(--text-secondary); font-size: 0.9rem; }
        .track audio { width: 100%; max-width: 300px; }
        .donation-appeal {
            background: linear-gradient(135deg, #1a3a5c 0%, #0f2744 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
            text-align: center;
        }
        .donation-appeal h2 {
            font-family: 'Playfair Display', serif;
            color: var(--accent-gold);
            margin-bottom: 1rem;
        }
        .donation-appeal p {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 1rem;
        }
        .highlight {
            color: var(--accent-gold);
            font-weight: 600;
        }
        .description {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            margin: 2rem 0;
            line-height: 1.8;
        }
        .description h2 {
            font-family: 'Playfair Display', serif;
            color: var(--accent-gold);
            margin-bottom: 1rem;
        }
        .cta {
            text-align: center;
            margin: 2rem 0;
        }
        .cta-btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: var(--accent-gold);
            color: #000;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.3s;
            margin: 0.5rem;
        }
        .cta-btn:hover { transform: scale(1.05); }
        .cta-btn.secondary {
            background: transparent;
            border: 2px solid var(--accent-gold);
            color: var(--accent-gold);
        }
        .streaming {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        .streaming a {
            padding: 0.8rem 1.2rem;
            background: var(--bg-card);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
        }
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .section-title {
            text-align: center;
            margin: 2rem 0;
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Bible Chantee</h1>
        <p class="subtitle" id="subtitle"></p>
    </header>
    
    <div class="container">
        <div class="lang-selector">
            <button class="lang-btn active" onclick="setLang('FR')">FR Francais</button>
            <button class="lang-btn" onclick="setLang('PT')">BR Portugues</button>
            <button class="lang-btn" onclick="setLang('EN')">GB English</button>
            <button class="lang-btn disabled" onclick="setLang('ES')">ES Espanol</button>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-number">1189</div>
                <div class="stat-label" id="stat-chapters"></div>
            </div>
            <div class="stat-box">
                <div class="stat-number">66</div>
                <div class="stat-label" id="stat-books"></div>
            </div>
            <div class="stat-box">
                <div class="stat-number">12</div>
                <div class="stat-label" id="stat-languages"></div>
            </div>
            <div class="stat-box">
                <div class="stat-number">80+</div>
                <div class="stat-label" id="stat-hours"></div>
            </div>
        </div>
        
        <h2 class="section-title" id="title-listen"></h2>
        <div class="tracks" id="tracks-container"></div>
        
        <div class="progress-section">
            <h2 id="title-progress"></h2>
            <div class="lang-progress" id="progress-container"></div>
        </div>
        
        <div class="donation-appeal">
            <h2 id="donation-title"></h2>
            <p id="donation-text1"></p>
            <p id="donation-text2"></p>
            <a href="crowdfunding.html" class="cta-btn" id="btn-support"></a>
            
        </div>
        
        <div class="description">
            <h2 id="about-title"></h2>
            <p id="about-text1"></p>
            <br>
            <p id="about-text2"></p>
        </div>
        
        <h2 class="section-title" id="title-available"></h2>
        <div class="streaming">
            <a href="#">Spotify</a>
            <a href="#">Apple Music</a>
            <a href="#">YouTube Music</a>
            <a href="#">Amazon Music</a>
        </div>
        
        <div class="cta">
            <a href="crowdfunding.html" class="cta-btn" id="btn-donate"></a>
            
        </div>
    </div>
    
    <footer class="footer">
        <p>Bible Chantee - Mania Libris</p>
        <p id="footer-text"></p>
    </footer>
    
    <script>
        const translations = {

                statChapters: "Chapitres",

                donationText1: "Chaque contribution finance la <span class='highlight'>generation de nouveaux chapitres</span>, l'<span class='highlight'>ajout de nouvelles langues</span>, et la <span class='highlight'>diffusion gratuite</span> de la Parole de Dieu.",
                donationText2: "<strong>10% de tous les revenus sont reverses aux oeuvres missionnaires.</strong>",
                btnSupport: "Soutenir le projet",

                aboutTitle: "Un projet unique",
                aboutText1: "La Bible Chantee transforme chaque chapitre de la Bible en une chanson originale. Generee par intelligence artificielle et supervisee par des theologiens, chaque piste capture l'essence spirituelle du texte biblique.",

                titleAvailable: "Disponible sur",

                btnListen: "Ecouter maintenant",
                footerText: "10% des revenus reverses aux missions",
                statusComplete: "Complet",

                statusPlanned: "Prevu",
                chapters: "chapitres",
                tracks: [
                    { id: "01_GEN_01_FR", title: "Genese 1", desc: "La Creation" },
                    { id: "19_PSA_23_FR", title: "Psaume 23", desc: "L'Eternel est mon berger" },
                    { id: "19_PSA_150_FR", title: "Psaume 150", desc: "Louez l'Eternel" }
                ]
            },
            PT: {
                subtitle: "A Biblia inteira em musica - 1189 capitulos",
                statChapters: "Capitulos",
                statBooks: "Livros",
                statLanguages: "Idiomas previstos",
                statHours: "Horas por idioma",
                titleListen: "Ouca alguns trechos",
                titleProgress: "Progresso do projeto - 12 idiomas",
                donationTitle: "Suas doacoes nos ajudam a progredir!",
                donationText1: "Cada contribuicao financia a <span class='highlight'>geracao de novos capitulos</span>, a <span class='highlight'>adicao de novos idiomas</span> e a <span class='highlight'>distribuicao gratuita</span> da Palavra de Deus.",
                donationText2: "<strong>10% de toda a receita e destinada a obras missionarias.</strong>",
                btnSupport: "Apoiar o projeto",
                btnExplore: "Explorar a Biblia Cantada",
                aboutTitle: "Um projeto unico",
                aboutText1: "A Biblia Cantada transforma cada capitulo da Biblia em uma cancao original. Gerada por inteligencia artificial e supervisionada por teologos, cada faixa captura a essencia espiritual do texto biblico.",
                aboutText2: "<strong>Nossa visao:</strong> Tornar a Palavra de Deus acessivel a todos, em todos os idiomas, atraves do poder da musica.",
                titleAvailable: "Disponivel em",
                btnDonate: "Fazer uma doacao",
                btnListen: "Ouvir agora",
                footerText: "10% da receita destinada a missoes",
                statusComplete: "Completo",
                statusProgress: "Em andamento",
                statusPlanned: "Previsto",
                chapters: "capitulos",
                tracks: [
                    { id: "01_GEN_01_PT", title: "Genesis 1", desc: "A Criacao" },
                    { id: "19_PSA_23_PT", title: "Salmo 23", desc: "O Senhor e meu pastor" },
                    { id: "19_PSA_150_PT", title: "Salmo 150", desc: "Louvai ao Senhor" }
                ]
            },
            EN: {
                subtitle: "The entire Bible set to music - 1189 chapters",
                statChapters: "Chapters",
                statBooks: "Books",
                statLanguages: "Languages planned",
                statHours: "Hours per language",
                titleListen: "Listen to samples",
                titleProgress: "Project progress - 12 languages",
                donationTitle: "Your donations help us progress!",
                donationText1: "Each contribution funds the <span class='highlight'>generation of new chapters</span>, <span class='highlight'>adding new languages</span>, and the <span class='highlight'>free distribution</span> of God's Word.",
                donationText2: "<strong>10% of all revenue goes to missionary work.</strong>",
                btnSupport: "Support the project",
                btnExplore: "Explore the Sung Bible",
                aboutTitle: "A unique project",
                aboutText1: "The Sung Bible transforms each chapter of the Bible into an original song. Generated by artificial intelligence and supervised by theologians, each track captures the spiritual essence of the biblical text.",
                aboutText2: "<strong>Our vision:</strong> Make God's Word accessible to everyone, in every language, through the power of music.",
                titleAvailable: "Available on",
                btnDonate: "Make a donation",
                btnListen: "Listen now",
                footerText: "10% of revenue donated to missions",
                statusComplete: "Complete",
                statusProgress: "In progress",
                statusPlanned: "Planned",
                chapters: "chapters",
                tracks: [
                    { id: "01_GEN_01_EN", title: "Genesis 1", desc: "The Creation" },
                    { id: "19_PSA_23_EN", title: "Psalm 23", desc: "The Lord is my shepherd" },
                    { id: "19_PSA_150_EN", title: "Psalm 150", desc: "Praise the Lord" }
                ]
            },
            ES: {
                subtitle: "La Biblia entera en musica - 1189 capitulos",
                statChapters: "Capitulos",
                statBooks: "Libros",
                statLanguages: "Idiomas previstos",
                statHours: "Horas por idioma",
                titleListen: "Escucha extractos",
                titleProgress: "Progreso del proyecto - 12 idiomas",
                donationTitle: "Tus donaciones nos ayudan a progresar!",
                donationText1: "Cada contribucion financia la <span class='highlight'>generacion de nuevos capitulos</span>, la <span class='highlight'>adicion de nuevos idiomas</span> y la <span class='highlight'>distribucion gratuita</span> de la Palabra de Dios.",
                donationText2: "<strong>10% de todos los ingresos se destinan a obras misioneras.</strong>",
                btnSupport: "Apoyar el proyecto",
                btnExplore: "Explorar la Biblia Cantada",
                aboutTitle: "Un proyecto unico",
                aboutText1: "La Biblia Cantada transforma cada capitulo de la Biblia en una cancion original. Generada por inteligencia artificial y supervisada por teologos, cada pista captura la esencia espiritual del texto biblico.",
                aboutText2: "<strong>Nuestra vision:</strong> Hacer accesible la Palabra de Dios a todos, en todos los idiomas, a traves del poder de la musica.",
                titleAvailable: "Disponible en",
                btnDonate: "Hacer una donacion",
                btnListen: "Escuchar ahora",
                footerText: "10% de los ingresos destinados a misiones",
                statusComplete: "Completo",
                statusProgress: "En curso",
                statusPlanned: "Previsto",
                chapters: "capitulos",
                tracks: [
                    { id: "01_GEN_01_ES", title: "Genesis 1", desc: "La Creacion" },
                    { id: "19_PSA_23_ES", title: "Salmo 23", desc: "El Senor es mi pastor" },
                    { id: "19_PSA_150_ES", title: "Salmo 150", desc: "Alabad al Senor" }
                ]
            }
        };
        
        const audioBase = {
            FR: "https://archive.org/download/bible-chantee-fr-v2/",
            PT: "https://archive.org/download/bible-chantee-pt-v2/",
            EN: "https://archive.org/download/bible-chantee-en-v2/",
            ES: "https://archive.org/download/bible-chantee-es-v2/"
        };
        
        const progressData = [
            { flag: "FR", name: "Francais", mp3: 1189, total: 1189, status: "complete" },
            { flag: "BR", name: "Portugues", mp3: 1189, total: 1189, status: "complete" },
            { flag: "GB", name: "English", mp3: 557, total: 1189, status: "progress" },
            { flag: "ES", name: "Espanol", mp3: 0, total: 1189, status: "planned" },
            { flag: "DE", name: "Deutsch", mp3: 0, total: 1189, status: "planned" },
            { flag: "IT", name: "Italiano", mp3: 0, total: 1189, status: "planned" },
            { flag: "SA", name: "Arabic", mp3: 0, total: 1189, status: "planned" },
            { flag: "RU", name: "Russian", mp3: 0, total: 1189, status: "planned" },
            { flag: "CN", name: "Chinese", mp3: 0, total: 1189, status: "planned" },
            { flag: "IN", name: "Hindi", mp3: 0, total: 1189, status: "planned" },
            { flag: "PH", name: "Tagalog", mp3: 0, total: 1189, status: "planned" },
            { flag: "KE", name: "Kiswahili", mp3: 0, total: 1189, status: "planned" }
        ];
        
        let currentLang = 'FR';
        
        function setLang(lang) {
            if (lang === 'ES') return;
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach((btn, i) => {
                btn.classList.remove('active');
                if (btn.textContent.includes(lang) || (lang === 'PT' && btn.textContent.includes('BR'))) {
                    btn.classList.add('active');
                }
            });
            updatePage();
        }
        
        function updatePage() {
            const t = translations[currentLang];
            
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('stat-chapters').textContent = t.statChapters;
            document.getElementById('stat-books').textContent = t.statBooks;
            document.getElementById('stat-languages').textContent = t.statLanguages;
            document.getElementById('stat-hours').textContent = t.statHours;
            document.getElementById('title-listen').textContent = t.titleListen;
            document.getElementById('title-progress').textContent = t.titleProgress;
            document.getElementById('donation-title').textContent = t.donationTitle;
            document.getElementById('donation-text1').innerHTML = t.donationText1;
            document.getElementById('donation-text2').innerHTML = t.donationText2;
            document.getElementById('btn-support').textContent = t.btnSupport;
            document.getElementById('btn-explore').textContent = t.btnExplore;
            document.getElementById('about-title').textContent = t.aboutTitle;
            document.getElementById('about-text1').textContent = t.aboutText1;
            document.getElementById('about-text2').innerHTML = t.aboutText2;
            document.getElementById('title-available').textContent = t.titleAvailable;
            document.getElementById('btn-donate').textContent = t.btnDonate;
            document.getElementById('btn-listen').textContent = t.btnListen;
            document.getElementById('footer-text').textContent = t.footerText;
            
            loadTracks();
            loadProgress();
        }
        
        function loadTracks() {
            const t = translations[currentLang];
            const base = audioBase[currentLang];
            const container = document.getElementById('tracks-container');
            
            container.innerHTML = t.tracks.map(track => `
                <div class="track">
                    <div class="track-info">
                        <div class="track-title">${track.title}</div>
                        <div class="track-desc">${track.desc}</div>
                    </div>
                    <audio controls preload="none">
                        <source src="${base}${track.id}.mp3" type="audio/mpeg">
                    </audio>
                </div>
            `).join('');
        }
        
        function loadProgress() {
            const t = translations[currentLang];
            const container = document.getElementById('progress-container');
            
            container.innerHTML = progressData.map(lang => {
                const percent = Math.round((lang.mp3 / lang.total) * 100);
                const statusClass = lang.status === 'complete' ? 'status-complete' : 
                                   lang.status === 'progress' ? 'status-progress' : 'status-planned';
                const statusText = lang.status === 'complete' ? t.statusComplete : 
                                  lang.status === 'progress' ? t.statusProgress : t.statusPlanned;
                
                return `
                    <div class="lang-card">
                        <div class="lang-card-header">
                            <span class="lang-name">${lang.flag} ${lang.name}</span>
                            <span class="lang-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percent}%"></div>
                        </div>
                        <div class="progress-text">${lang.mp3} / ${lang.total} ${t.chapters} (${percent}%)</div>
                    </div>
                `;
            }).join('');
        }
        
        updatePage();
    </script>
</body>
</html>
