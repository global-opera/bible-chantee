            font-size: 1rem;

        .stats {

        .stat-box {

            background: var(--bg-card);

            padding: 2rem;
            margin: 2rem 0;
        }

            color: var(--accent-gold);
            margin-bottom: 1.5rem;

        }
        .lang-progress {

            align-items: center;
            margin-bottom: 0.5rem;
        }
        .lang-name { font-weight: 600; font-size: 1.1rem; }
        .lang-status {
            font-size: 0.8rem;

            border-radius: 12px;
        }

        .status-progress { background: var(--warning-orange); color: #000; }
        .status-planned { background: #555; color: #fff; }
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 0.5rem 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent-gold);
            border-radius: 4px;
        }
        .progress-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .tracks { margin: 2rem 0; }
        .track {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;

            font-weight: 600;
            margin-bottom: 0.3rem;

            color: #000;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.3s;
            margin: 0.5rem;

        .cta-btn.secondary {
            background: transparent;
            border: 2px solid var(--accent-gold);
            color: var(--accent-gold);

            margin: 2rem 0;

            margin-top: 0.3rem;

            font-size: 0.9rem;
            font-weight: 600;

        .preorder-btn {

        let currentLang = 'FR';
        
        function setLang(lang) {
            if (lang === 'ES') return;
            currentLang = lang;

            // Save language to localStorage
            localStorage.setItem('sungbible_lang', lang.toLowerCase());

            // Update crowdfunding links with language parameter
            document.querySelectorAll('a[href*="crowdfunding.html"]').forEach(link => {
                link.href = `crowdfunding.html?lang=${lang.toLowerCase()}`;
            });

            document.querySelectorAll('.lang-btn').forEach((btn, i) => {
                btn.classList.remove('active');
                if (btn.textContent.includes(lang) || (lang === 'PT' && btn.textContent.includes('BR'))) {
                    btn.classList.add('active');
                }
            });

            // Google Analytics: Track language selection
            if (typeof gtag !== 'undefined') {
                gtag('event', 'language_change', {
                    'event_category': 'engagement',
                    'event_label': lang,
                    'value': lang
                });
            }

            updatePage();
        }
        
        function updatePage() {
            const t = translations[currentLang];

            document.title = t.mainTitle;
            document.getElementById('main-title').textContent = t.mainTitle;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('stat-chapters').textContent = t.statChapters;
            document.getElementById('stat-books').textContent = t.statBooks;
            document.getElementById('stat-languages').textContent = t.statLanguages;

            streamingLinks.forEach(link => {
                link.title = t.streamingComingSoon;

            document.getElementById('preorder-title').textContent = t.preorderTitle;
            document.getElementById('preorder-subtitle').textContent = t.preorderSubtitle;
            document.getElementById('btn-share').textContent = t.btnShare;
            document.getElementById('btn-review').textContent = t.btnReview;

            // Mettre à jour le lien du bouton avis Google
            const reviewLink = document.getElementById('review-link');
            if (reviewLink) {
                reviewLink.href = googleReviewUrl;
            }

            loadTracks();
            loadProgress();
        }
        
        function loadTracks() {
            const t = translations[currentLang];
            const base = audioBase[currentLang];
            const container = document.getElementById('tracks-container');

            container.innerHTML = t.tracks.map((track, index) => `
                <div class="track">
                    <div class="track-info">
                        <div class="track-title">${track.title}</div>
                        <div class="track-desc">${track.desc}</div>
                    </div>
                    <audio controls preload="none" id="audio-${index}" data-track-id="${track.id}">
                        <source src="${base}${track.id.split('_').slice(0,2).join('_')}/${track.id}.mp3" type="audio/mpeg">
                    </audio>
                    <button class="lyrics-btn" id="lyrics-btn-${index}" onclick="toggleLyrics('${track.id}', ${index})">
                        ${t.btnLyrics}
                    </button>
                    <div class="lyrics-container" id="lyrics-${index}"></div>
                </div>
            `).join('');

            // Add event listeners for audio play tracking
            setTimeout(() => {
                document.querySelectorAll('audio').forEach(audio => {
                    audio.addEventListener('play', function() {
                        const trackId = this.getAttribute('data-track-id');
                        if (typeof gtag !== 'undefined') {
                            gtag('event', 'audio_play', {
                                'event_category': 'audio',
                                'event_label': trackId,
                                'language': currentLang
                            });
                        }
                    });
                });
            }, 100);
        }
        
        function loadProgress() {
            const t = translations[currentLang];
            const container = document.getElementById('progress-container');
            
            container.innerHTML = progressData.map(lang => {
                const percent = Math.round((lang.mp3 / lang.total) * 100);
                const statusClass = lang.status === 'complete' ? 'status-complete' : 
                                   lang.status === 'progress' ? 'status-progress' : 'status-planned';
                const statusText = lang.status === 'complete' ? t.statusComplete : 
                                  lang.status === 'progress' ? t.statusProgress : t.statusPlanned;
                
                return `
                    <div class="lang-card">
                        <div class="lang-card-header">
                            <span class="lang-name"><img src="${lang.img}" alt="${lang.flag}" style="width:20px;height:14px;vertical-align:middle;margin-right:5px"> ${lang.name}</span>
                            <span class="lang-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percent}%"></div>
                        </div>
                        <div class="progress-text">${lang.mp3} / ${lang.total} ${t.chapters} (${percent}%)</div>
                    </div>
                `;
            }).join('');
        }

        function cleanLyrics(text) {
            if (!text) return '';

            // 1. Supprimer [STYLE] ou [ESTILO] et tout ce qui suit
            text = text.replace(/\[(STYLE|ESTILO)\][\s\S]*/gi, '');

            // 2. Supprimer TOUS les marqueurs entre crochets
            text = text.replace(/\[.*?\]/gi, '');

            // 3. Supprimer TOUS les marqueurs Markdown **...**
            text = text.replace(/\*\*[^*]+\*\*/g, '');

            // 4. Supprimer lignes de marqueurs seules (sans texte après)
            text = text.replace(/^[\s]*(Verse|Chorus|Bridge|Refrain|Couplet|Outro|Intro|Hook|Pre-Chorus|Post-Chorus|Conclusão|Conclusion|Ponte|Refrão|Estrofe|Interlude|Solo|Tag|Vamp|Ad-lib|Break|Verset|Verso|Glória|Final)[\s\d]*[:\s]*$/gim, '');

            // 5. Normaliser : exactement 1 ligne vide entre couplets
            text = text.replace(/\n{2,}/g, '\n\n');

            // 6. Supprimer lignes vides au début/fin
            return text.trim();
        }

        function toggleLyrics(trackId, index) {
            const t = translations[currentLang];
            const lyricsContainer = document.getElementById(`lyrics-${index}`);
            const btn = document.getElementById(`lyrics-btn-${index}`);

            // Si les paroles sont déjà affichées, les masquer
            if (lyricsContainer.classList.contains('show')) {
                lyricsContainer.classList.remove('show');
                btn.textContent = t.btnLyrics;
                return;
            }

            // Google Analytics: Track lyrics view
            if (typeof gtag !== 'undefined') {
                gtag('event', 'view_lyrics', {
                    'event_category': 'engagement',
                    'event_label': trackId,
                    'language': currentLang
                });
            }

            // Extraire le numéro de livre et de chapitre de l'ID
            // Format: "01_GEN_01_FR" -> livre: "01", chapitre: 1
            const parts = trackId.split('_');
            const bookNum = parts[0];
            const chapterNum = parseInt(parts[2]);

            let lyricsText = '';

            // Récupérer les paroles selon la langue
            if (currentLang === 'FR') {
                if (window.chapterLyrics && window.chapterLyrics[bookNum] && window.chapterLyrics[bookNum][chapterNum]) {
                    lyricsText = window.chapterLyrics[bookNum][chapterNum];
                } else {
                    lyricsText = t.lyricsComingSoon;
                }
            } else if (currentLang === 'PT') {
                if (window.chapterLyricsPT && window.chapterLyricsPT[bookNum] && window.chapterLyricsPT[bookNum][chapterNum]) {
                    lyricsText = window.chapterLyricsPT[bookNum][chapterNum];
                } else {
                    lyricsText = t.lyricsComingSoon;
                }
            } else if (currentLang === 'EN') {
                if (window.chapterLyricsEN && window.chapterLyricsEN[bookNum] && window.chapterLyricsEN[bookNum][chapterNum]) {
                    lyricsText = window.chapterLyricsEN[bookNum][chapterNum];
                } else {
                    lyricsText = t.lyricsComingSoon;
                }
            } else {
                // ES ou autres : paroles non disponibles
                lyricsText = t.lyricsComingSoon;
            }

            // Afficher les paroles nettoyées
            lyricsContainer.textContent = cleanLyrics(lyricsText);
            lyricsContainer.classList.add('show');
            btn.textContent = t.btnHide;
        }

            const t = translations[currentLang];

            if (navigator.share) {
                navigator.share(shareData).catch(err => {
                    console.log('Error sharing:', err);

                // Fallback: copier le lien
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert(t.linkCopied);
                }).catch(err => {
                    // Fallback si clipboard ne fonctionne pas
                    prompt(t.linkCopied, window.location.href);
                });
            }
        }
