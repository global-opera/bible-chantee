<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Chantée - Démo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #1a4a7a 0%, #0a1628 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(180deg, #2a5a8a 0%, #1a4a7a 100%);
        }
        h1 { font-size: 2.5rem; color: #d4af37; margin-bottom: 0.5rem; }
        .subtitle { color: #a8c8e8; font-size: 1.2rem; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .lang-buttons { display: flex; justify-content: center; gap: 1rem; margin: 2rem 0; flex-wrap: wrap; }
        .lang-btn {
            padding: 0.8rem 1.5rem;
            border: 2px solid #d4af37;
            background: transparent;
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
        }
        .lang-btn:hover, .lang-btn.active { background: #d4af37; color: #000; }
        .track {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .track-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
        .track-desc { color: rgba(255,255,255,0.7); margin-bottom: 1rem; }
        audio { width: 100%; }
        .form-section {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
            text-align: center;
        }
        .form-section h2 { color: #d4af37; margin-bottom: 1rem; }
        input, select {
            width: 100%;
            max-width: 300px;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
        }
        button[type="submit"] {
            padding: 1rem 2rem;
            background: #d4af37;
            color: #000;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        button[type="submit"]:hover { background: #e8c54a; }
    </style>
</head>
<body>
    <header class="header">
        <h1>Bible Chantée</h1>
        <p class="subtitle">La Parole de Dieu en musique</p>
    </header>

    <div class="container">
        <div class="lang-buttons">
            <button class="lang-btn active" onclick="setLang('FR')">🇫🇷 Français</button>
            <button class="lang-btn" onclick="setLang('PT')">🇧🇷 Português</button>
            <button class="lang-btn" onclick="setLang('EN')">🇬🇧 English</button>
        </div>

        <div id="tracks"></div>

        <div class="form-section">
            <h2>Accès gratuit - 100 chapitres</h2>
            <p style="margin-bottom:1rem;color:rgba(255,255,255,0.7);">Inscrivez-vous pour écouter les 1189 chapitres</p>
            <form action="/thank-you" method="POST" name="subscribe">
                <input type="hidden" name="form-name" value="subscribe">
                <input type="email" name="email" placeholder="Votre email" required><br>
                <select name="language" required>
                    <option value="fr">Français</option>
                    <option value="pt">Português</option>
                    <option value="en">English</option>
                </select><br>
                <button type="submit">S'inscrire</button>
            </form>
        </div>
    </div>

    <script>
        const tracks = {
            FR: [
                { id: "01_GEN_01_FR", title: "Genèse 1", desc: "La Création" },
                { id: "19_PSA_23_FR", title: "Psaume 23", desc: "L'Éternel est mon berger" },
                { id: "19_PSA_150_FR", title: "Psaume 150", desc: "Louez l'Éternel" }
            ],
            PT: [
                { id: "01_GEN_01_PT", title: "Gênesis 1", desc: "A Criação" },
                { id: "19_PSA_23_PT", title: "Salmo 23", desc: "O Senhor é meu pastor" },
                { id: "19_PSA_150_PT", title: "Salmo 150", desc: "Louvai ao Senhor" }
            ],
            EN: [
                { id: "01_GEN_01_EN", title: "Genesis 1", desc: "The Creation" },
                { id: "19_PSA_23_EN", title: "Psalm 23", desc: "The Lord is my shepherd" },
                { id: "19_PSA_150_EN", title: "Psalm 150", desc: "Praise the Lord" }
            ]
        };

        let currentLang = 'FR';

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderTracks();
        }

        function renderTracks() {
            const container = document.getElementById('tracks');
            container.innerHTML = tracks[currentLang].map(t => `
                <div class="track">
                    <div class="track-title">${t.title}</div>
                    <div class="track-desc">${t.desc}</div>
                    <audio controls preload="none">
                        <source src="demo-audio/${t.id}.mp3" type="audio/mpeg">
                    </audio>
                </div>
            `).join('');
        }

        renderTracks();
    </script>
</body>
</html>
