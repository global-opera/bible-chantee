<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription réussie - Bible Chantée</title>
    <style>
        :root {
            --bg-dark: #0a1628;
            --bg-card: #0f2744;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent-gold: #d4af37;
            --success-green: #22c55e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(180deg, #1a4a7a 0%, #0a1628 100%);
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .success-container {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 3rem;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .success-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }
        h1 {
            color: var(--success-green);
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: var(--accent-gold);
            color: #000;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✅</div>
        <h1>Thank you!</h1>
        <p>
            We have received your submission successfully.
        </p>
        <p>
            <strong>Your message has been received.</strong>
        </p>
        <a href="/demo.html" class="btn">Back to demo page</a>
        <br><br>
        <a href="/" class="btn" style="background: transparent; border: 2px solid var(--accent-gold); color: var(--accent-gold);">Back to homepage</a>
    </div>
</body>
</html>
