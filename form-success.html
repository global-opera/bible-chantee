<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank you! - Sung Bible</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a2332;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      color: #d4a84b;
      font-size: 3em;
      margin-bottom: 20px;
    }
    p {
      color: #ffffff;
      font-size: 1.3em;
      margin: 15px 0;
    }
    .sub {
      color: #888888;
      font-size: 1em;
    }
    .btn {
      display: inline-block;
      margin-top: 40px;
      padding: 15px 50px;
      background: #d4a84b;
      color: #1a2332;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.1em;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #b8943f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✓ Thank you!</h1>
    <p>You have been subscribed successfully.</p>
    <p class="sub">We'll notify you when new content is available.</p>
    <a href="/" class="btn">Back to Home</a>
  </div>
</body>
</html>
