<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soutenir Bible Chantée</title>
    <meta name="description" content="Soutenez Bible Chantée, un projet gratuit qui partage la Parole de Dieu en musique">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bleu-nuit: #1E3A5F;
            --bleu-sombre: #162B46;
            --bleu-cartes: #243F66;
            --bleu-hover: #2C4A73;
            --or-moyen: #F5CB42;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, var(--bleu-nuit) 0%, var(--bleu-sombre) 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--or-moyen);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #b0b0b0;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 25px;
            background: transparent;
            border: 2px solid var(--or-moyen);
            border-radius: 25px;
            color: var(--or-moyen);
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: var(--or-moyen);
            color: var(--bleu-nuit);
        }

        .lang-bar {
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .flags-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .lang-btn {
            width: 75px;
            height: 50px;
            border: 2px solid rgba(245, 203, 66, 0.4);
            border-radius: 8px;
            background: var(--bleu-cartes);
            cursor: pointer;
            padding: 8px;
            transition: all 0.3s;
        }

        .lang-btn:hover {
            border-color: var(--or-moyen);
            background: var(--bleu-hover);
            transform: scale(1.05);
        }

        .lang-btn.active {
            border-color: var(--or-moyen);
            background: var(--bleu-hover);
            box-shadow: 0 0 15px rgba(245, 203, 66, 0.3);
        }

        .lang-btn.disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .lang-btn.disabled:hover {
            transform: none;
            border-color: rgba(245, 203, 66, 0.4);
            background: var(--bleu-cartes);
        }

        .flag-img {
            width: 100%;
            height: auto;
            max-height: 30px;
        }

        .card {
            background: rgba(30, 58, 95, 0.8);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(245, 203, 66, 0.2);
        }

        .card.highlight {
            border: 2px solid var(--or-moyen);
            background: linear-gradient(135deg, #243F66 0%, #1E3A5F 100%);
        }

        .card h2 {
            color: var(--or-moyen);
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .card p {
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 10px;
        }

        .card ul {
            list-style: none;
            padding-left: 0;
        }

        .card ul li {
            padding: 8px 0;
            padding-left: 30px;
            position: relative;
            color: #e0e0e0;
        }

        .card ul li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: var(--or-moyen);
            font-weight: bold;
        }

        .donate-btn {
            display: inline-block;
            padding: 15px 40px;
            background: var(--or-moyen);
            color: var(--bleu-nuit);
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s;
            margin: 20px 0;
        }

        .donate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(245, 203, 66, 0.5);
        }

        .or-text {
            text-align: center;
            color: #b0b0b0;
            margin: 20px 0;
            font-style: italic;
        }

        .payment-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .payment-card {
            background: var(--bleu-hover);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .payment-card h3 {
            color: var(--or-moyen);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .payment-card code {
            display: block;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 5px;
            color: #fff;
            font-family: monospace;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .payment-card button {
            padding: 8px 20px;
            background: var(--or-moyen);
            color: var(--bleu-nuit);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .payment-card button:hover {
            transform: scale(1.05);
        }

        .card a {
            color: var(--or-moyen);
            text-decoration: none;
        }

        .card a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            color: #888;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .card {
                padding: 20px;
            }

            .flags-row {
                gap: 6px;
            }

            .lang-btn {
                width: 55px;
                height: 40px;
            }

            .payment-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

        function updateContent(lang) {
            const t = TRANSLATIONS[lang] || TRANSLATIONS.FR;

            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('pageSubtitle').textContent = t.pageSubtitle;
            document.getElementById('backBtn').textContent = t.backBtn;

            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="card">
                    <h2>${t.mission.title}</h2>
                    <p>${t.mission.text}</p>
                </div>

                <div class="card">
                    <h2>${t.how.title}</h2>
                    <ul>
                        ${t.how.items.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                </div>

                <div class="card highlight">
                    <h2>${t.donate.title}</h2>

                    <center>
                        <a href="https://gofund.me/65145a53" target="_blank" class="donate-btn">
                            ${t.donate.gofundme}
                        </a>
                    </center>

                    <p class="or-text">${t.donate.or}</p>

                    <div class="payment-options">
                        <div class="payment-card">
                            <h3>${t.donate.iban}</h3>
                            <code>CH93 0900 0000 1403 3867 5</code>
                            <button onclick="copyToClipboard('CH93 0900 0000 1403 3867 5', '${t.donate.copied}')">${t.donate.copy}</button>
                        </div>

                        <div class="payment-card">
                            <h3>${t.donate.paypal}</h3>
                            <code>scassani@gmail.com</code>
                            <button onclick="copyToClipboard('scassani@gmail.com', '${t.donate.copied}')">${t.donate.copy}</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2>${t.thanks.title}</h2>
                    <p>${t.thanks.text}</p>
                </div>

                <div class="card">
                    <h2>${t.contact.title}</h2>
                    <p>${t.contact.text} <a href="mailto:info@biblechantee.com">info@biblechantee.com</a></p>
                </div>
            `;
        }

        function copyToClipboard(text, message) {
            navigator.clipboard.writeText(text);
            alert(message);
        }

        // Language button handlers
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('disabled')) return;

                const lang = btn.dataset.lang;
                currentLang = lang;
                localStorage.setItem('bc_lang', lang);

                // Update active button
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Update content
                updateContent(lang);
            });
        });

        // Initialize
        updateContent(currentLang);
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if (btn.dataset.lang === currentLang) {
                btn.classList.add('active');
            }
        });
