<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soutenir Bible Chantée</title>
    <meta name="description" content="Soutenez Bible Chantée, un projet gratuit qui partage la Parole de Dieu en musique">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bleu-nuit: #1E3A5F;
            --bleu-sombre: #162B46;
            --bleu-cartes: #243F66;
            --bleu-hover: #2C4A73;
            --or-moyen: #F5CB42;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, var(--bleu-nuit) 0%, var(--bleu-sombre) 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--or-moyen);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #b0b0b0;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 25px;
            background: transparent;
            border: 2px solid var(--or-moyen);
            border-radius: 25px;
            color: var(--or-moyen);
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: var(--or-moyen);
            color: var(--bleu-nuit);
        }

        .card {
            background: rgba(30, 58, 95, 0.8);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(245, 203, 66, 0.2);
        }

        .card.highlight {
            border: 2px solid var(--or-moyen);
            background: linear-gradient(135deg, #243F66 0%, #1E3A5F 100%);
        }

        .card h2 {
            color: var(--or-moyen);
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .card p {
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 10px;
        }

        .card ul {
            list-style: none;
            padding-left: 0;
        }

        .card ul li {
            padding: 8px 0;
            padding-left: 30px;
            position: relative;
            color: #e0e0e0;
        }

        .card ul li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: var(--or-moyen);
            font-weight: bold;
        }

        .donate-btn {
            display: inline-block;
            padding: 15px 40px;
            background: var(--or-moyen);
            color: var(--bleu-nuit);
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s;
            margin: 20px 0;
        }

        .donate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(245, 203, 66, 0.5);
        }

        .or-text {
            text-align: center;
            color: #b0b0b0;
            margin: 20px 0;
            font-style: italic;
        }

        /* Grille de paiement */
        .payment-section {
            max-width: 700px;
            margin: 0 auto;
        }

        /* Lignes avec 2 boutons écartés */
        .payment-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Ligne avec 1 bouton centré */
        .payment-row-center {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* Cartes plus larges pour que tout tienne */
        /* TOUTES les cartes (IBAN, PayPal, Stripe, TWINT, PIX) ont le MÊME fond bleu */
        .payment-box {
            background: #243F66;
            border: 1px solid rgba(245, 203, 66, 0.2);
            border-radius: 12px;
            padding: 20px 25px;
            text-align: center;
            min-width: 320px;
            flex: 1;
        }

        .payment-box:hover {
            border-color: #F5CB42;
            background: #2C4A73;
        }

        /* Carte Stripe - MÊME style bleu (PAS de fond jaune) */
        .payment-box.stripe,
        .stripe-card {
            background: #243F66 !important;
        }

        /* Titre en or */
        .payment-box h4 {
            color: #F5CB42;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        /* Info IBAN/email/tel - largeur suffisante pour IBAN complet */
        .payment-info {
            background: rgba(0,0,0,0.2);
            padding: 10px 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.95em;
            white-space: nowrap;
            overflow: visible;
            min-width: 300px;
            margin-bottom: 12px;
            color: #fff;
        }

        /* Boutons Copier et Payer - même style */
        .copy-btn, .stripe-btn {
            background: #F5CB42 !important;
            color: #1E3A5F !important;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            line-height: 1.5;
        }

        .copy-btn:hover, .stripe-btn:hover {
            background: #FFD966;
            transform: scale(1.05);
        }

        .payment-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .card a {
            color: var(--or-moyen);
            text-decoration: none;
        }

        .card a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            color: #888;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .card {
                padding: 20px;
            }

            .payment-row, .payment-row-center {
                flex-direction: column;
                align-items: center;
            }

            .payment-box {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
